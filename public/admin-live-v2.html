<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYFA BIRR Admin</title><style>body{font-family:Arial;background:#080b22;color:#fff;margin:0}header{padding:14px;background:#121633;position:sticky;top:0}main{padding:16px;max-width:1200px;margin:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab,button{border:0;border-radius:9px;padding:10px 13px;background:#303753;color:#fff;cursor:pointer}.tab.active{background:#a855f7}.card{background:#121633;border:1px solid #2a3158;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:#aab4d0}.field input,.field select,.field textarea{background:#0b0f2c;color:#fff;border:1px solid #2a3158;border-radius:8px;padding:10px}.ok{background:#19c37d}.danger{background:#ef4444}.section{display:none}.section.active{display:block}@media(max-width:800px){.grid{grid-template-columns:1fr}}#login{min-height:100vh;display:grid;place-items:center}#login .card{width:min(420px,92vw)}.msg{margin-top:10px;padding:9px;border-radius:8px;background:#1b2250}</style></head><body><div id="login"><div class="card"><h2>MYFA BIRR Admin</h2><div class="field"><label>Username</label><input id="lu" value="admin"></div><div class="field" style="margin-top:8px"><label>Password</label><input id="lp" type="password" value="admin"></div><button class="ok" style="width:100%;margin-top:12px" onclick="login()">Authorize</button><div id="lm" class="msg"></div></div></div><div id="app" style="display:none"><header><b>MYFA BIRR Admin</b> <button style="float:right" onclick="logout()">Logout</button></header><main><div class="tabs"><button class="tab active" onclick="show('config',this)">Economy & Withdrawals</button><button class="tab" onclick="show('tasks',this)">Tasks & Promos</button><button class="tab" onclick="show('users',this)">Users</button><button class="tab" onclick="show('withdrawals',this)">Withdrawals</button><button class="tab" onclick="show('games',this)">Game Settings</button><button class="tab" onclick="show('channel',this)">Channel</button><button class="tab" onclick="show('tools',this)">Logs & Tools</button></div><section id="config" class="section active"><div class="card"><h2>Economy & Referrals</h2><div class="grid" id="cg"></div></div><div class="card"><h2>Withdrawals & Endpoints</h2><div class="grid" id="wg"></div></div><div class="card"><button class="ok" onclick="saveConfig()">Save & Push to Firebase</button><span id="sm" class="msg"></span></div></section><section id="tasks" class="section"><div class="card"><h2>Create Bonus Task</h2><div class="grid"><div class="field"><label>Name</label><input id="tn"></div><div class="field"><label>Reward</label><input id="tr" type="number"></div><div class="field"><label>URL / Channel</label><input id="tu"></div><div class="field"><label>Type</label><select id="tt"><option value="auto">Auto</option><option value="manual">Manual</option></select></div><div class="field"><label>Max Users</label><input id="tm" type="number" value="0"></div></div><button class="ok" style="margin-top:10px" onclick="createTask()">Create Task</button></div><div class="card"><h2>Active Tasks</h2><div id="tl"></div></div><div class="card"><h2>Create Promo</h2><div class="grid"><div class="field"><label>Code</label><input id="pc"></div><div class="field"><label>Reward</label><input id="pr" type="number"></div><div class="field"><label>Max Uses</label><input id="pm" type="number"></div></div><button style="margin-top:10px" onclick="createPromo()">Create Code</button><div id="pl"></div></div></section><section id="users" class="section"><div class="card"><h2>Users</h2><input id="us" placeholder="Search ID or name" style="width:100%"><div id="ul"></div></div></section><section id="withdrawals" class="section"><div class="card"><h2>Pending Withdrawals</h2><div id="wl"></div></div></section><section id="games" class="section"><div class="card"><h2>Game Settings</h2><div class="grid" id="gg"></div><button class="ok" style="margin-top:10px" onclick="saveConfig()">Save Game Settings</button></div></section><section id="channel" class="section"><div class="card"><h2>Official Channel Posts</h2><textarea id="postText" placeholder="Post text"></textarea><button class="ok" style="margin-top:10px" onclick="postChannel()">Publish</button><div id="posts"></div></div></section><section id="tools" class="section"><div class="card"><h2>Admin Logs</h2><button onclick="loadAll()">Refresh Data</button><pre id="logs" style="white-space:pre-wrap"></pre></div></section></main></div><script>const K='MYFA_ADMIN_SESSION';let D={};const cfgFields=[['currencyName','App Currency Name','text'],['exchangeRate','Exchange Rate','number'],['taxRate','Dynamic Tax Rate %','number'],['cashToGemsTaxRate','Cash to Gems Tax %','number'],['monetagZoneId','Monetag Zone ID','text'],['monetagLimit','Monetag Daily Limit','number'],['adsgramBlockId','Adsgram Reward Block ID','text'],['adsgramLimit','Adsgram Daily Limit','number'],['adsterraLink','Adsterra Direct Link','text'],['adsterraLimit','Adsterra Daily Limit','number'],['realMoneyPerAd','Reward Per Ad ($)','number'],['referralBonusReferrer','Inviter Referral Bonus','number'],['referralBonusReferee','Invitee Referral Bonus','number'],['loginBase','Daily Login Base Reward','number'],['loginMult','Login Streak Multiplier','number'],['comboReward','Daily Combo Reward','number'],['oxWinRate','OX Win-Rate Override','number'],['spinRewardText','Targeted Spin Reward','text'],['scratchMin','Scratch Min Reward','number'],['scratchMax','Scratch Max Reward','number'],['reqReferrals','Req. Referrals','number'],['reqAds','Req. Ads','number'],['autoApproveLimit','Auto-Approve Threshold ($)','number'],['minWithdraw','Min Withdrawal ($)','number'],['maxWithdraw','Max Daily Withdrawal ($)','number'],['telegramBotLink','Bot Telegram Link','text'],['miniAppShortname','Mini App Shortname','text'],['supportChannel','Support Channel URL','text'],['telegramChatId','Admin Chat ID','text'],['adminTelegramIds','Admin Telegram IDs','text'],['paymentApiUrl','Payment API URL','text'],['autoWithdrawDelay','Processing Delay (mins)','number'],['withdrawChannelId','Notification Channel ID','text'],['withdrawChannelUsername','Notification Channel Username','text']];const gameFields=[['dropDailyLimit','Daily Free Drops','number'],['spinSlices','Spin Slices','text'],['spinCost','Spin Cost','number'],['spinForcedReward','Forced Spin Reward','number'],['scratchCost','Scratch Cost','number'],['scratchMin','Scratch Min','number'],['scratchMax','Scratch Max','number'],['scratchJackpotChance','Scratch Jackpot %','number']];function makeFields(){cg.innerHTML=cfgFields.slice(0,20).map(f=>field(f)).join('');wg.innerHTML=cfgFields.slice(20).map(f=>field(f)).join('');gg.innerHTML=gameFields.map(f=>field(f)).join('')}function field([id,label,type]){return `<div class="field"><label>${label}</label><input id="f_${id}" type="${type}" ></div>`}async function login(){const r=await fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:lu.value,password:lp.value})});const d=await r.json().catch(()=>({}));if(!d.success){lm.textContent=d.error||'Login failed';return}sessionStorage.setItem(K,d.token);openApp();loadAll()}function openApp(){login.style.display='none';app.style.display='block';makeFields()}function logout(){sessionStorage.removeItem(K);location.reload()}async function api(target,body={}){const token=sessionStorage.getItem(K);if(!token){logout();throw Error('Login required')}const r=await fetch('/api/admin-gateway?target='+encodeURIComponent(target),{method:'POST',headers:{'Content-Type':'application/json','X-MYFA-ADMIN-SESSION':token},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Admin request failed');return d}async function loadAll(){try{D=await api('data');populateConfig(D.config||{});renderTasks();renderPromos();renderUsers();renderWithdrawals();logs.textContent=(D.adminLogs||[]).join('\n')}catch(e){lm.textContent=e.message}}function populateConfig(c){for(const [id] of cfgFields){const el=document.getElementById('f_'+id);if(el)el.value=c[id]??''}for(const [id] of gameFields){const el=document.getElementById('f_'+id);if(el)el.value=c[id]??''}}function readConfig(){const o={};for(const [id] of cfgFields.concat(gameFields)){const el=document.getElementById('f_'+id);if(!el)continue;o[id]=el.type==='number'?(el.value===''?0:Number(el.value)):el.value}return o}async function saveConfig(){try{await api('config-update',{fullConfig:readConfig()});sm.textContent=' Saved to Firebase ✓';await loadAll()}catch(e){sm.textContent=' '+e.message}}async function createTask(){try{await api('tasks',{action:'create',task:{name:tn.value,reward:Number(tr.value),url:tu.value,type:tt.value,maxUsers:Number(tm.value||0)}});tn.value='';tr.value='';tu.value='';await loadAll()}catch(e){alert(e.message)}}async function toggleTask(id,en){try{await api('tasks',{action:'toggle',task:{id,enabled:en}});await loadAll()}catch(e){alert(e.message)}}async function deleteTask(id){try{await api('tasks',{action:'delete',task:{id}});await loadAll()}catch(e){alert(e.message)}}function renderTasks(){tl.innerHTML=Object.entries(D.tasks||{}).map(([id,t])=>`<div class="card"><b>${escape(t.name||id)}</b> — ${t.reward||0} Gems — ${t.enabled===false?'Disabled':'Active'}<div><button onclick="toggleTask('${id}',${t.enabled===false?'true':'false'})">${t.enabled===false?'Enable':'Disable'}</button> <button class="danger" onclick="deleteTask('${id}')">Delete</button></div></div>`).join('')||'<p>No bonus tasks.</p>'}async function createPromo(){try{await api('promos',{action:'create',promo:{code:pc.value,reward:Number(pr.value),maxUses:Number(pm.value)}});pc.value='';pr.value='';pm.value='';await loadAll()}catch(e){alert(e.message)}}async function deletePromo(code){try{await api('promos',{action:'delete',code});await loadAll()}catch(e){alert(e.message)}}function renderPromos(){pl.innerHTML=Object.values(D.promos||{}).map(p=>`<div class="item"><b>${escape(p.code)}</b> — ${p.reward} Gems — ${p.uses||0}/${p.maxUses||p.limit||0} <button class="danger" onclick="deletePromo('${escapeAttr(p.code)}')">Delete</button></div>`).join('')||'<p>No promo codes.</p>'}function renderUsers(){const q=(us?.value||'').toLowerCase();ul.innerHTML=Object.entries(D.users||{}).filter(([id,u])=>(id+' '+(u.accountName||u.username||'')).toLowerCase().includes(q)).slice(0,100).map(([id,u])=>`<div class="item">${escape(u.accountName||u.username||'User')} — ${id} — ${u.points||0} Gems <button onclick="userAdd('${id}')">+Gems</button><button onclick="userReset('${id}')">Reset Ads</button></div>`).join('')||'<p>No users.</p>'}async function userAdd(id){const v=prompt('Gems to add');if(v===null)return;try{await api('user-action',{userId:id,action:'add-balance',value:Number(v)});await loadAll()}catch(e){alert(e.message)}}async function userReset(id){try{await api('user-action',{userId:id,action:'reset-ads'});await loadAll()}catch(e){alert(e.message)}}function renderWithdrawals(){wl.innerHTML=Object.entries(D.withdrawals||{}).filter(([,w])=>w.status==='pending').map(([id,w])=>`<div class="item"><b>${id}</b> — ${w.userId} — ${w.amount} ${w.method||''}<button onclick="wd('${id}','approve')">Approve</button><button class="danger" onclick="wd('${id}','reject')">Reject</button></div>`).join('')||'<p>No pending withdrawals.</p>'}async function wd(id,action){try{await api('withdrawals',{ids:[id],action,reason:'Rejected by admin'});await loadAll()}catch(e){alert(e.message)}}async function testChannel(){alert('Use Official Channel section to publish.')}async function postChannel(){try{await api('channel/post',{action:'create',post:{text:postText.value}});postText.value='';await loadAll()}catch(e){alert(e.message)}}function show(id,el){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(id==='tasks')renderTasks()}function escape(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function escapeAttr(v){return escape(v).replace(/`/g,'&#96;')}if(sessionStorage.getItem(K)){openApp();loadAll()}</script></body></html>
