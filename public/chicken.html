<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicken of Fire</title>
    <link rel="stylesheet" href="chicken.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="header">
        <h2 style="margin:0; font-style:italic; font-weight:900;">CHICKEN <span style="color:var(--gold);">ROAD</span></h2>
        <div class="balance-pill">
            <i class="fa-solid fa-gem" style="color:var(--gold);"></i> <span id="user-balance">...</span>
        </div>
        <i class="fa-solid fa-xmark" style="font-size:1.5rem; cursor:pointer;" onclick="window.location.href='/'"></i>
    </div>
    
    <div id="game-container">
        <!-- SVG Chicken -->
        <img id="chicken" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='60' r='30' fill='%23fff'/><circle cx='70' cy='40' r='20' fill='%23fff'/><circle cx='75' cy='35' r='5' fill='%23000'/><path d='M85 45 L100 50 L85 55 Z' fill='%23F59E0B'/><path d='M50 30 L60 10 L70 30 Z' fill='%23EF4444'/><path d='M40 90 L40 100 M60 90 L60 100' stroke='%23F59E0B' stroke-width='5'/></svg>" alt="Chicken">
    </div>
    
    <div id="control-panel">
        <input type="number" id="wagerAmount" class="bet-input" value="10">
        <div class="diff-selector">
            <button class="diff-btn">Easy</button>
            <button class="diff-btn active">Medium</button>
            <button class="diff-btn">Hard</button>
            <button class="diff-btn" style="color:var(--red);">Hardcore</button>
        </div>
        <button id="btn-go" class="action-btn btn-go" onclick="startRound()">GO / BET</button>
        <button id="btn-cashout" class="action-btn btn-cashout" onclick="cashOut()">CASH OUT</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('userId');
        
        let state = 'IDLE'; // IDLE, PLAYING, CRASHED
        let currentLane = 0;
        let deathLane = 999;
        let wager = 0;
        const multipliers = [1.00, 1.20, 1.50, 2.00, 3.00, 5.00, 10.0, 25.0];
        
        function initGrid() {
            const container = document.getElementById('game-container');
            container.innerHTML = document.getElementById('chicken').outerHTML; // Keep chicken
            const w = container.clientWidth;
            const laneWidth = w / 7;
            
            for(let i=0; i<7; i++) {
                let div = document.createElement('div');
                div.className = 'lane';
                div.style.left = (i * laneWidth) + 'px';
                div.style.width = laneWidth + 'px';
                
                let text = document.createElement('div');
                text.className = 'multiplier-text';
                text.innerText = multipliers[i].toFixed(2) + 'x';
                div.appendChild(text);
                
                container.appendChild(div);
            }
            
            // Initial positioning
            const chicken = document.getElementById('chicken');
            chicken.className = '';
            chicken.style.left = (laneWidth / 2) + 'px';
            chicken.style.bottom = '50px';
        }
        
        window.addEventListener('resize', initGrid);
        initGrid();
        
        async function startRound() {
            if (state === 'PLAYING') { hop(); return; }
            
            wager = parseFloat(document.getElementById('wagerAmount').value);
            if (isNaN(wager) || wager <= 0) return alert("Invalid wager");
            
            try {
                const res = await fetch('/api/chicken/play', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId, wager })
                });
                const data = await res.json();
                
                if (!data.success) {
                    alert(data.error); return;
                }
                
                document.getElementById('user-balance').innerText = data.balance.toFixed(2);
                deathLane = data.deathLane;
                
                state = 'PLAYING';
                currentLane = 0;
                initGrid();
                
                document.getElementById('btn-go').innerText = "HOP (Next)";
                document.getElementById('btn-cashout').style.display = 'block';
                updateCashoutBtn();
                
            } catch (e) { alert("Error starting game."); }
        }
        
        function hop() {
            if (state !== 'PLAYING') return;
            currentLane++;
            
            const container = document.getElementById('game-container');
            const laneWidth = container.clientWidth / 7;
            const chicken = document.getElementById('chicken');
            
            // The Parabolic Hop
            chicken.style.transform = `translateX(-50%) translateY(-30px) scale(1.2)`;
            setTimeout(() => {
                chicken.style.left = ((currentLane + 0.5) * laneWidth) + 'px';
                chicken.style.transform = `translateX(-50%) translateY(0) scale(1)`;
                
                if (currentLane === deathLane) {
                    triggerDeath();
                } else {
                    updateCashoutBtn();
                }
            }, 150);
        }
        
        function triggerDeath() {
            state = 'CRASHED';
            const chicken = document.getElementById('chicken');
            const container = document.getElementById('game-container');
            
            // Erupt Fire
            let fire = document.createElement('div');
            fire.className = 'fire-pillar';
            fire.style.left = chicken.style.left;
            fire.style.transform = 'translateX(-50%)';
            container.appendChild(fire);
            
            chicken.classList.add('roasted');
            
            document.getElementById('btn-go').innerText = "GO / BET";
            document.getElementById('btn-cashout').style.display = 'none';
        }
        
        async function cashOut() {
            if (state !== 'PLAYING' || currentLane === 0) return;
            
            let payout = wager * multipliers[currentLane];
            state = 'IDLE';
            
            document.getElementById('btn-go').innerText = "GO / BET";
            document.getElementById('btn-cashout').style.display = 'none';
            
            try {
                const res = await fetch('/api/chicken/cashout', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId, payout })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('user-balance').innerText = data.balance.toFixed(2);
                    alert("Cashed out: $" + payout.toFixed(2));
                }
            } catch (e) {}
        }
        
        function updateCashoutBtn() {
            let payout = wager * multipliers[currentLane];
            document.getElementById('btn-cashout').innerText = "CASH OUT $" + payout.toFixed(2);
        }
    </script>
</body>
</html>
