<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>MYFA Ongoing</title><link rel="stylesheet" href="/assets/ongoing/ongoing.css?v=motion7"></head><body>
<div id="ongoing-app" aria-label="MYFA Ongoing">
  <main class="stage" id="stage">
    <section class="slide active" data-page="1" aria-hidden="false"><div class="art"><img class="artwork" src="/assets/ongoing/page1.png" alt=""><div class="fx p1fx">
      <i class="reveal r-welcome"></i><i class="reveal r-brand"></i><i class="reveal r-tag"></i><i class="reveal r-quote"></i>
      <i class="fx-icon play"></i><i class="fx-icon gift"></i><i class="fx-icon people"></i><i class="fx-icon rocket"></i><i class="fx-bottom"></i><i class="fx-cta"></i>
      <i class="particle a"></i><i class="particle b"></i><i class="particle c"></i><i class="particle d"></i>
    </div><button class="hotspot skip" data-skip aria-label="Skip"></button><button class="hotspot continue" data-next aria-label="Continue"></button></div></section>
    <section class="slide" data-page="2" aria-hidden="true"><div class="art"><img class="artwork" src="/assets/ongoing/page2.png" alt=""><div class="fx p2fx">
      <i class="reveal r-head"></i><i class="reveal r-sub"></i><i class="cardfx drop"></i><i class="cardfx tasks"></i><i class="cardfx spin"></i><i class="cardfx scratch"></i><i class="cardfx streak"></i><i class="cardfx gems"></i><i class="reveal r-p2quote"></i><i class="fx-bottom"></i>
      <i class="particle a"></i><i class="particle b"></i><i class="particle c"></i><i class="particle d"></i>
    </div><button class="hotspot skip" data-skip aria-label="Skip"></button><button class="hotspot p2next" data-next aria-label="Next"></button></div></section>
    <section class="slide" data-page="3" aria-hidden="true"><div class="art"><img class="artwork" src="/assets/ongoing/page3.png" alt=""><div class="fx p3fx">
      <i class="reveal r-title"></i><i class="reveal r-brand3"></i><i class="reveal r-tag3"></i><i class="benefitfx real"></i><i class="benefitfx community"></i><i class="benefitfx safe"></i><i class="benefitfx love"></i><i class="noteFx"></i><i class="fx-cta"></i><i class="fx-bottom"></i>
      <i class="particle a"></i><i class="particle b"></i><i class="particle c"></i><i class="particle d"></i>
    </div><button class="hotspot skip" data-skip aria-label="Skip"></button><button class="hotspot finish" data-finish aria-label="Get started"></button></div></section>
  </main>
</div><script src="/assets/ongoing/ongoing.js?v=motion7" defer></script></body></html>
