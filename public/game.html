<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game - MYFA BIRR</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F19;
            --color-cyan: #00F2FE;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-main);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .header {
            position: sticky;
            top: 0;
            display: flex;
            align-items: center;
            padding: 15px;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
        }
        .back-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #game-container {
            width: 100vw;
            height: calc(100vh - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="goBack()">
            <i class="fa-solid fa-arrow-left"></i> Back to App
        </button>
    </div>

    <div id="game-container">
        <h2 style="color:#94A3B8;"><i class="fa-solid fa-spinner fa-spin"></i> Loading Game...</h2>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const game = params.get('game');
        const userId = params.get('userId');

        function goBack() {
            window.location.href = '/?userId=' + (userId || '');
        }

        function initLudoEngine() {
            document.getElementById('game-container').innerHTML = `
                <div style="text-align:center;">
                    <i class="fa-solid fa-dice" style="font-size:4rem; color:var(--color-cyan); margin-bottom:15px;"></i>
                    <h2>Ludo Multiplayer</h2>
                    <p style="color:#94A3B8;">Engine loading... coming soon!</p>
                </div>
            `;
        }

        // Bootstrap the requested game
        if (game === 'ludo') {
            initLudoEngine();
        } else {
            document.getElementById('game-container').innerHTML = `<h2>Game not found</h2>`;
        }
    </script>
</body>
</html>
