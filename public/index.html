            try {
                // Fetch Global Config First

                        </div>
                    `;
                    return;
                }

                // 2. Forced Language
                if (appConfig.forcedLang && appConfig.forcedLang.toLowerCase() !== 'auto') {
                    currentLang = appConfig.forcedLang.toUpperCase();
                    const langBtn = document.getElementById('langToggle'); if(langBtn) { langBtn.style.display = 'none'; if(langBtn.previousElementSibling) langBtn.previousElementSibling.style.display = 'none'; }
                    
                } else if (!currentLang) {
                    currentLang = 'EN';
                }
                if(document.getElementById('langToggle')) document.getElementById('langToggle').innerText = currentLang;

                // 3. Default Theme
                const savedTheme = localStorage.getItem('appTheme');

                    if (!appConfig.defaultNight) {
                        document.body.classList.add('theme-light');
                        localStorage.setItem('appTheme', 'light');
                    }
                }
                
                const themeBtn = document.getElementById('themeToggle');

                } else {
                    document.body.classList.remove('theme-light');
                    if (themeBtn) themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
                }

                // 4. Default Sound
                if (!localStorage.getItem('appSound') && typeof appConfig.defaultSound === 'boolean') {
                    soundEnabled = appConfig.defaultSound;
                }
                const soundBtn = document.getElementById('soundToggle'); if(soundBtn) soundBtn.innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';

                if (!impersonatedUserId && (!tgUser || !tgUser.id)) {
                    document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>Telegram Web App Error. Please open inside Telegram.</h2>";

                            document.body.innerHTML = "<h2 style='text-align:center; color:red; margin-top:50px;'>Access Denied (VPN/Proxy Detected)</h2>";
                            return;
                        }
                    } catch(e) {}

                // 6. Max Sessions (UUID generation)
                let sessionId = localStorage.getItem('appSessionId');
                if (!sessionId) {
                    sessionId = (crypto.randomUUID && typeof crypto.randomUUID === 'function') ? crypto.randomUUID() : 'session-' + Date.now() + '-' + Math.random().toString(36).substring(2, 10);
                    localStorage.setItem('appSessionId', sessionId);

                userId = impersonatedUserId || tgUser.id.toString();

                const realName = tgUser ? (tgUser.first_name + (tgUser.last_name ? " " + tgUser.last_name : "")) : "Impersonated User";

                let res = await fetch(`${API_BASE_URL}/api/user/${userId}?sessionId=${sessionId}`);

    const l = document.getElementById('loading-overlay');
    if (l) { l.style.opacity = '0'; l.style.pointerEvents = 'none'; setTimeout(()=> { l.style.display = 'none'; }, 500); }
}, 2500);

                        idleTimer = setTimeout(() => {
                            document.body.innerHTML = `

function translateDOM(node) {
    if(currentLang === 'EN') return; 
    if (node.nodeType === Node.TEXT_NODE) {
        let text = node.textContent.trim();
        if (amharicDict[text]) {
            node.originalText = text;
            node.textContent = node.textContent.replace(text, amharicDict[text]);
        }
    } else {
        if(node.tagName === 'SCRIPT' || node.tagName === 'STYLE') return;
        for (let i = 0; i < node.childNodes.length; i++) {
            translateDOM(node.childNodes[i]);
        }
    }
}

function restoreDOM(node) {
    if (node.nodeType === Node.TEXT_NODE) {
        if (node.originalText) {
            node.textContent = node.textContent.replace(node.textContent.trim(), node.originalText);
            delete node.originalText;
        }
    } else {
        if(node.tagName === 'SCRIPT' || node.tagName === 'STYLE') return;
        for (let i = 0; i < node.childNodes.length; i++) {
            restoreDOM(node.childNodes[i]);
        }
    }
}

function applyTranslation() {
    if (currentLang === 'AM') {
        translateDOM(document.body);
    } else {
        restoreDOM(document.body);
    }
}

            <button class="btn" style="flex:1; background:linear-gradient(45deg, #00A8FF, #00F2FE); color:white; font-size:1.2rem; padding:18px; font-weight:800; box-shadow:0 0 20px rgba(0,242,254,0.4);" onclick="executeSponsorTask()"><i class="${iconClass}"></i> Start</button>
            <button id="so-verify-btn" class="btn" style="flex:1; background:linear-gradient(45deg, #00E676, #10B981); color:white; font-size:1.2rem; padding:18px; font-weight:900; box-shadow:0 0 20px rgba(0,230,118,0.4);" onclick="verifySponsorTask()"><i class="fa-solid fa-circle-check"></i> Check</button>
        `;
    }

    document.getElementById('sponsorOverlay').classList.add('open');
}

window.closeSponsorTask = function() {
    document.getElementById('sponsorOverlay').classList.remove('open');
}

window.executeSponsorTask = function() {
    if (!currentSponsorTask) return;
    // Mark as started locally
    window.open(currentSponsorTask.url, '_blank');
}

window.verifySponsorTask = async function() {
    if(!currentSponsorTask) return;
    const btn = document.getElementById('so-verify-btn');
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';
    btn.disabled = true;

    try {
        let endpoint = currentSponsorTask.type === 'manual' ? '/api/sponsor/verify-manual' : '/api/sponsor/verify-auto';
        let bodyData = { userId, taskId: currentSponsorTask.id };
        
        if (currentSponsorTask.type === 'manual') {
            const fileInput = document.getElementById('so-proof-file');
            if (fileInput && fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                await new Promise(r => reader.onload = r);
                bodyData.imageBase64 = reader.result;
            } else {
                showToast("Please upload screenshot proof", "error");
                btn.innerHTML = '<i class="fa-solid fa-check-double"></i> Check';
                btn.disabled = false;
                return;
            }
        } else {
            bodyData.channelId = currentSponsorTask.channelId;
            bodyData.reward = currentSponsorTask.reward;
        }

        const res = await fetch(`${API_BASE_URL}${endpoint}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(bodyData)
        });
        const data = await res.json();
        
        if (data.success) {
            if(currentSponsorTask.type === 'manual') {
                showToast("Proof submitted! Pending approval.", 'success');
            } else {
                showToast(`+${currentSponsorTask.reward} Gems Claimed!`, 'success');
            }
            const uRes = await fetch(`${API_BASE_URL}/api/user/${userId}`);
            currentUser = await uRes.json();
            closeSponsorTask();
            updateTasksUI(document.getElementById('content-area'));
        } else {
            showToast(data.error || "Verification failed. Did you complete the task?", "error");
            btn.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Check Failed';
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Check';
                btn.disabled = false;
            }, 3000);
        }
    } catch(e) {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-arrows-rotate"></i> Try Again'; }
        showToast("Network error. Try again.", "error");
    }
}

    </script>
</body>
