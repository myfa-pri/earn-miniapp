name: Validate Campaign Manager
on:
  push:
    paths:
      - 'public/campaign-manager-app.js'
      - 'public/ad-studio-pro.html'
      - '.github/workflows/validate-campaign-manager.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and page wiring
        run: |
          node --check public/campaign-manager-app.js
          grep -q 'campaign-manager-app.js?v=20260909-7' public/ad-studio-pro.html
          ! grep -q 'campaign-manager-recovery.js' public/ad-studio-pro.html
          ! grep -q 'campaign-manager.js?v=' public/ad-studio-pro.html
          ! grep -q 'campaign-manager-polish.js?v=' public/ad-studio-pro.html
          echo 'Standalone Campaign Manager validation passed'
      - name: Remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/validate-campaign-manager.yml
          git commit -m 'chore: remove one-time campaign manager validator' || true
          git push || true