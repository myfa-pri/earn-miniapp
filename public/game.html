<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYFA DROP - Premium Arcade</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #111;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas when playing */
            display: flex;
            flex-direction: column;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            font-size: 24px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hud-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .score-text { color: #FCDD09; }
        .timer-text { color: #fff; }
        .combo-text { 
            color: #078930; 
            font-size: 20px;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }
        .combo-text.active {
            opacity: 1;
            transform: scale(1.2);
        }

        /* Buttons */
        .btn {
            pointer-events: auto;
            background: linear-gradient(135deg, #FCDD09, #d4ba06);
            color: #111;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(252, 221, 9, 0.4);
            text-transform: uppercase;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(252, 221, 9, 0.4);
        }

        .btn-exit {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: 2px solid #fff;
            box-shadow: none;
            z-index: 100;
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(17, 17, 17, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 50;
        }

        .screen h1 {
            font-size: 48px;
            color: #FCDD09;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(252, 221, 9, 0.5);
            text-align: center;
        }

        .screen p {
            font-size: 18px;
            margin-bottom: 40px;
            color: #ccc;
            text-align: center;
            max-width: 80%;
        }

        .hidden { display: none !important; }

        #reward-text {
            color: #078930;
            font-size: 32px;
            margin: 20px 0;
        }
        
        .freeze-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 200, 255, 0.2);
            pointer-events: none;
            display: none;
            z-index: 5;
        }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div class="freeze-overlay" id="freezeOverlay"></div>

    <button class="btn btn-exit" id="btnExit">EXIT</button>

    <div id="ui-layer">
        <div class="hud hidden" id="gameHud">
            <div class="hud-left">
                <div class="score-text">SCORE: <span id="scoreVal">0</span></div>
                <div class="combo-text" id="comboVal">x1 COMBO!</div>
            </div>
            <div class="hud-right">
                <div class="timer-text"><span id="timerVal">30</span>s</div>
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div class="screen" id="startScreen">
        <h1>MYFA DROP</h1>
        <p>Catch the Adey Abeba flowers!<br>Avoid the red bombs.<br>Grab blue snowflakes to freeze time.</p>
        <button class="btn" id="btnStart">START GAME</button>
        <p id="startError" style="color: #ff4444; margin-top: 20px;" class="hidden">Error starting game. Try again.</p>
    </div>

    <!-- End Screen -->
    <div class="screen hidden" id="endScreen">
        <h1>TIME'S UP!</h1>
        <p>Final Score: <span id="finalScoreVal">0</span></p>
        <div id="reward-text" class="hidden">Reward: <span id="rewardVal"></span></div>
        <p id="endLoading">Saving score...</p>
        <button class="btn hidden" id="btnBackToApp">BACK TO APP</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const startScreen = document.getElementById('startScreen');
    const endScreen = document.getElementById('endScreen');
    const gameHud = document.getElementById('gameHud');
    const btnStart = document.getElementById('btnStart');
    const btnExit = document.getElementById('btnExit');
    const btnBackToApp = document.getElementById('btnBackToApp');
    
    const scoreVal = document.getElementById('scoreVal');
    const timerVal = document.getElementById('timerVal');
    const comboVal = document.getElementById('comboVal');
    const finalScoreVal = document.getElementById('finalScoreVal');
    const endLoading = document.getElementById('endLoading');
    const rewardText = document.getElementById('reward-text');
    const rewardVal = document.getElementById('rewardVal');
    const startError = document.getElementById('startError');
    const freezeOverlay = document.getElementById('freezeOverlay');

    // Resize canvas
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Assets
    const earnImg = new Image();
    earnImg.src = 'https://i.ibb.co/5XTLbPKG/image.png';

    // Game State
    let gameState = 'START'; // START, PLAYING, END
    let score = 0;
    let combo = 0;
    let timeLeft = 30;
    let lastTime = 0;
    let timeAccumulator = 0;
    let animationId = null;
    let sessionId = null;
    let userId = window.localStorage.getItem('userId') || 'guest';
    
    let isFrozen = false;
    let freezeTimer = 0;

    // Entities
    let objects = [];
    let particles = [];
    
    const TYPE_EARN = 0;
    const TYPE_BOOM = 1;
    const TYPE_FREEZE = 2;

    class GameObject {
        constructor() {
            this.radius = 30 + Math.random() * 20;
            this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
            this.y = -this.radius;
            this.speed = 200 + Math.random() * 300; // pixels per second
            
            const rand = Math.random();
            if (rand < 0.7) this.type = TYPE_EARN;
            else if (rand < 0.9) this.type = TYPE_BOOM;
            else this.type = TYPE_FREEZE;
            
            this.markedForDeletion = false;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 5;
        }

        update(dt) {
            if (!isFrozen) {
                this.y += this.speed * dt;
                this.rotation += this.rotSpeed * dt;
            }
            if (this.y - this.radius > canvas.height) {
                this.markedForDeletion = true;
                if (this.type === TYPE_EARN) {
                    // Reset combo if you miss an earn
                    combo = 0;
                    updateComboUI();
                }
            }
        }

        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            
            if (this.type === TYPE_EARN) {
                if (earnImg.complete) {
                    ctx.drawImage(earnImg, -this.radius, -this.radius, this.radius * 2, this.radius * 2);
                } else {
                    ctx.fillStyle = '#FCDD09';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (this.type === TYPE_BOOM) {
                // Bomb rendering
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#222';
                ctx.fillRect(-5, -this.radius - 10, 10, 15);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 20px Montserrat';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💣', 0, 0);
            } else if (this.type === TYPE_FREEZE) {
                // Freeze powerup
                ctx.fillStyle = '#00c8ff';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 20px Montserrat';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('❄️', 0, 0);
            }
            ctx.restore();
        }
    }
    
    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 400;
            this.vy = (Math.random() - 0.5) * 400;
            this.life = 1.0;
            this.color = color;
            this.size = Math.random() * 5 + 3;
        }
        update(dt) {
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.life -= dt * 2;
        }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    function createExplosion(x, y, type) {
        let color = type === TYPE_EARN ? '#FCDD09' : (type === TYPE_BOOM ? '#ff3333' : '#00c8ff');
        for (let i=0; i<15; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    // Input handling
    function handleTap(x, y) {
        if (gameState !== 'PLAYING') return;

        let hit = false;
        // Iterate backwards to hit top-most object
        for (let i = objects.length - 1; i >= 0; i--) {
            let obj = objects[i];
            let dx = x - obj.x;
            let dy = y - obj.y;
            if (dx * dx + dy * dy <= obj.radius * obj.radius * 1.5) { // slightly larger hit area
                obj.markedForDeletion = true;
                hit = true;
                createExplosion(obj.x, obj.y, obj.type);
                
                if (obj.type === TYPE_EARN) {
                    combo++;
                    let points = 10 * Math.min(combo, 5); // Max 5x multiplier
                    score += points;
                    updateComboUI();
                } else if (obj.type === TYPE_BOOM) {
                    combo = 0;
                    score = Math.max(0, score - 50);
                    updateComboUI();
                    
                    // Screen shake effect
                    canvas.style.transform = 'translate(10px, 10px)';
                    setTimeout(() => canvas.style.transform = 'translate(-10px, -10px)', 50);
                    setTimeout(() => canvas.style.transform = 'translate(0, 0)', 100);
                    
                } else if (obj.type === TYPE_FREEZE) {
                    isFrozen = true;
                    freezeTimer = 3.0; // 3 seconds freeze
                    freezeOverlay.style.display = 'block';
                }
                
                scoreVal.textContent = score;
                break; // Only hit one object per tap
            }
        }
        
        if (!hit) {
            combo = 0;
            updateComboUI();
        }
    }

    canvas.addEventListener('mousedown', (e) => handleTap(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            handleTap(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
        }
    });

    function updateComboUI() {
        if (combo > 1) {
            comboVal.textContent = `x${Math.min(combo, 5)} COMBO!`;
            comboVal.classList.add('active');
            setTimeout(() => comboVal.classList.remove('active'), 200);
        } else {
            comboVal.classList.remove('active');
        }
    }

    let spawnTimer = 0;
    let spawnRate = 0.8; // seconds

    function update(dt) {
        if (gameState !== 'PLAYING') return;

        // Freeze Logic
        if (isFrozen) {
            freezeTimer -= dt;
            if (freezeTimer <= 0) {
                isFrozen = false;
                freezeOverlay.style.display = 'none';
            }
        }

        // Timer
        if (!isFrozen) {
            timeAccumulator += dt;
            if (timeAccumulator >= 1) {
                timeAccumulator -= 1;
                timeLeft--;
                timerVal.textContent = timeLeft;
                
                // Increase difficulty
                spawnRate = Math.max(0.2, 0.8 - (30 - timeLeft) * 0.02);
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }

            // Spawn objects
            spawnTimer += dt;
            if (spawnTimer >= spawnRate) {
                spawnTimer = 0;
                objects.push(new GameObject());
            }
        }

        // Update entities
        objects.forEach(obj => obj.update(dt));
        objects = objects.filter(obj => !obj.markedForDeletion);
        
        particles.forEach(p => p.update(dt));
        particles = particles.filter(p => p.life > 0);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (gameState === 'PLAYING') {
            objects.forEach(obj => obj.draw(ctx));
            particles.forEach(p => p.draw(ctx));
        }
    }

    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        // Cap dt to prevent huge jumps on tab switch
        if (dt < 0.1) {
            update(dt);
            draw();
        }

        if (gameState === 'PLAYING') {
            animationId = requestAnimationFrame(loop);
        }
    }

    async function startGame() {
        btnStart.disabled = true;
        btnStart.textContent = 'STARTING...';
        startError.classList.add('hidden');

        try {
            const res = await fetch('/api/game/drop/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId })
            });
            
            // Allow bypassing API for local testing if needed
            let data = {};
            if (res.ok) {
                data = await res.json();
            } else {
                console.warn('API error, using mock start');
                data = { success: true, sessionId: 'mock-session-' + Date.now() };
            }
            
            if (data.success && data.sessionId) {
                sessionId = data.sessionId;
                
                // Reset state
                score = 0;
                combo = 0;
                timeLeft = 30;
                objects = [];
                particles = [];
                isFrozen = false;
                freezeOverlay.style.display = 'none';
                timeAccumulator = 0;
                scoreVal.textContent = '0';
                timerVal.textContent = '30';
                updateComboUI();
                
                startScreen.classList.add('hidden');
                gameHud.classList.remove('hidden');
                gameState = 'PLAYING';
                
                lastTime = performance.now();
                animationId = requestAnimationFrame(loop);
            } else {
                throw new Error('Failed to start');
            }
        } catch (e) {
            startError.classList.remove('hidden');
        } finally {
            btnStart.disabled = false;
            btnStart.textContent = 'START GAME';
        }
    }

    async function endGame() {
        gameState = 'END';
        cancelAnimationFrame(animationId);
        
        gameHud.classList.add('hidden');
        endScreen.classList.remove('hidden');
        finalScoreVal.textContent = score;
        
        btnBackToApp.classList.add('hidden');
        rewardText.classList.add('hidden');
        endLoading.classList.remove('hidden');

        try {
            const res = await fetch('/api/game/drop/finish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, sessionId, score })
            });
            
            let data = {};
            if (res.ok) {
                data = await res.json();
            } else {
                 console.warn('API error, using mock finish');
                 data = { success: true, reward: '10 Coins' };
            }
            
            if (data.success) {
                endLoading.classList.add('hidden');
                rewardText.classList.remove('hidden');
                rewardVal.textContent = data.reward ? data.reward : `${score} points`;
                
                if (window.confetti) {
                    window.confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#FCDD09', '#078930']
                    });
                }
            } else {
                endLoading.textContent = 'Failed to save score.';
            }
        } catch (e) {
            endLoading.textContent = 'Error connecting to server.';
        } finally {
            btnBackToApp.classList.remove('hidden');
        }
    }

    btnStart.addEventListener('click', startGame);
    
    btnBackToApp.addEventListener('click', () => {
        window.location.href = 'index.html';
    });
    
    btnExit.addEventListener('click', () => {
        if (animationId) cancelAnimationFrame(animationId);
        window.location.href = 'index.html';
    });

</script>
</body>
</html>
