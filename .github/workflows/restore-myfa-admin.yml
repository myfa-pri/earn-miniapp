name: Restore MYFA Admin Panel

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore admin page from legacy full panel
        shell: bash
        run: |
          cp public/admin-live.html public/myfa.html

      - name: Commit restored admin page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/myfa.html
          git commit -m "Restore full MYFA admin panel" || exit 0
          git push
