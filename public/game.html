<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo - MYFA BIRR</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F19;
            --color-cyan: #00F2FE;
        }
        body {
            margin: 0; padding: 0; background: var(--bg-main); color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }
        .header {
            display: flex; align-items: center; padding: 15px;
            background: rgba(11, 15, 25, 0.9); border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .back-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white;
            padding: 8px 15px; border-radius: 8px; font-size: 0.95rem; cursor: pointer;
        }
        #game-container {
            flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        canvas {
            background: #f0f0f0; max-width: 100vw; max-height: 100vw; box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 10px;
        }
        .quantum-btn {
            background: linear-gradient(45deg, #00F2FE, #4FACFE); border: none; color: black; font-weight: bold;
            padding: 10px 20px; border-radius: 10px; cursor: pointer;
        }
        .cyber-card { background: #1E293B; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        
        /* 3D Tumbling Dice */
        .dice-scene {
            width: 50px; height: 50px;
            perspective: 400px;
            margin-right: 15px;
            cursor: pointer;
        }
        .dice {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease-out;
            transform: rotateY(0deg) rotateX(0deg);
        }
        .dice.rolling {
            animation: roll 0.6s linear infinite;
        }
        @keyframes roll {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(720deg) rotateZ(360deg); }
        }
        .face {
            position: absolute; width: 50px; height: 50px;
            background: white; border: 2px solid #ccc; border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; font-weight: bold; color: black;
            box-sizing: border-box;
        }
        .front  { transform: rotateY(  0deg) translateZ(25px); }
        .back   { transform: rotateY(180deg) translateZ(25px); }
        .right  { transform: rotateY( 90deg) translateZ(25px); }
        .left   { transform: rotateY(-90deg) translateZ(25px); }
        .top    { transform: rotateX( 90deg) translateZ(25px); }
        .bottom { transform: rotateX(-90deg) translateZ(25px); }

        #wager-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 50;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> Back to App</button>
    </div>
    
    <div id="game-container">
        <!-- Wager Overlay -->
        <div id="wager-overlay">
            <div class="cyber-card" style="padding: 20px; text-align:center; max-width:90%;">
                <h2 style="color:var(--color-cyan);"><i class="fa-solid fa-dice"></i> Ludo Wager</h2>
                <p style="color:#94A3B8; font-size:0.9rem;">Win to multiply your wager!</p>
                <div style="margin: 20px 0;">
                    <label style="display:block; margin-bottom:5px;">Wager Amount:</label>
                    <input type="number" id="wagerAmount" value="50" style="width:120px; text-align:center; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.2); color:white; padding:10px; border-radius:8px;">
                </div>
                <div style="margin: 20px 0;">
                    <label style="display:block; margin-bottom:5px;">Opponents:</label>
                    <select id="botCount" style="width:120px; text-align:center; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.2); color:white; padding:10px; border-radius:8px;">
                        <option value="1">1 Bot (2x)</option>
                        <option value="2">2 Bots (3x)</option>
                        <option value="3">3 Bots (4x)</option>
                    </select>
                </div>
                <button class="btn quantum-btn" onclick="startGame()" style="width:100%;">Start Match</button>
            </div>
        </div>
        
        <canvas id="ludoCanvas" width="600" height="600"></canvas>
        
        <div id="ui-bar" style="width:100%; max-width:600px; display:flex; justify-content:space-between; align-items:center; padding:15px; box-sizing:border-box;">
            <div id="turn-indicator" style="font-size:1.2rem; font-weight:bold;">Initializing...</div>
            <div class="dice-scene" onclick="rollDiceAction()">
                <div class="dice" id="dice">
                    <div class="face front">1</div>
                    <div class="face top">2</div>
                    <div class="face right">3</div>
                    <div class="face left">4</div>
                    <div class="face bottom">5</div>
                    <div class="face back">6</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('userId');

        function goBack() {
            window.location.href = '/?userId=' + (userId || '');
        }

        const canvas = document.getElementById('ludoCanvas');
        const ctx = canvas.getContext('2d');
        const cellSize = 600 / 15;

        // Path Definition (52 spaces on main track)
        const pathList = [
            {x:1, y:6}, {x:2, y:6}, {x:3, y:6}, {x:4, y:6}, {x:5, y:6},
            {x:6, y:5}, {x:6, y:4}, {x:6, y:3}, {x:6, y:2}, {x:6, y:1}, {x:6, y:0},
            {x:7, y:0},
            {x:8, y:0}, {x:8, y:1}, {x:8, y:2}, {x:8, y:3}, {x:8, y:4}, {x:8, y:5},
            {x:9, y:6}, {x:10, y:6}, {x:11, y:6}, {x:12, y:6}, {x:13, y:6}, {x:14, y:6},
            {x:14, y:7},
            {x:14, y:8}, {x:13, y:8}, {x:12, y:8}, {x:11, y:8}, {x:10, y:8}, {x:9, y:8},
            {x:8, y:9}, {x:8, y:10}, {x:8, y:11}, {x:8, y:12}, {x:8, y:13}, {x:8, y:14},
            {x:7, y:14},
            {x:6, y:14}, {x:6, y:13}, {x:6, y:12}, {x:6, y:11}, {x:6, y:10}, {x:6, y:9},
            {x:5, y:8}, {x:4, y:8}, {x:3, y:8}, {x:2, y:8}, {x:1, y:8}, {x:0, y:8},
            {x:0, y:7}, {x:0, y:6}
        ];

        const safeIndices = [0, 8, 13, 21, 26, 34, 39, 47];
        pathList.forEach((p, i) => { p.safe = safeIndices.includes(i); });

        const homeStretches = {
            red: [{x:1, y:7}, {x:2, y:7}, {x:3, y:7}, {x:4, y:7}, {x:5, y:7}],
            green: [{x:7, y:1}, {x:7, y:2}, {x:7, y:3}, {x:7, y:4}, {x:7, y:5}],
            yellow: [{x:13, y:7}, {x:12, y:7}, {x:11, y:7}, {x:10, y:7}, {x:9, y:7}],
            blue: [{x:7, y:13}, {x:7, y:12}, {x:7, y:11}, {x:7, y:10}, {x:7, y:9}]
        };

        const basePositions = {
            red: [{x:1, y:1}, {x:4, y:1}, {x:1, y:4}, {x:4, y:4}],
            green: [{x:10, y:1}, {x:13, y:1}, {x:10, y:4}, {x:13, y:4}],
            yellow: [{x:10, y:10}, {x:13, y:10}, {x:10, y:13}, {x:13, y:13}],
            blue: [{x:1, y:10}, {x:4, y:10}, {x:1, y:13}, {x:4, y:13}]
        };

        function buildPlayerPath(color) {
            let startIdx = 0;
            if (color === 'green') startIdx = 13;
            if (color === 'yellow') startIdx = 26;
            if (color === 'blue') startIdx = 39;

            let p = [];
            for (let i = 0; i <= 50; i++) {
                p.push(pathList[(startIdx + i) % 52]);
            }
            homeStretches[color].forEach(hs => {
                p.push({x: hs.x, y: hs.y, safe: true});
            });
            p.push({x: 7, y: 7, safe: true}); // Finished center
            return p;
        }

        const playerPaths = {
            red: buildPlayerPath('red'),
            green: buildPlayerPath('green'),
            yellow: buildPlayerPath('yellow'),
            blue: buildPlayerPath('blue')
        };

        const hexColors = { red: '#FF3366', green: '#00CC66', yellow: '#FFCC00', blue: '#3399FF' };
        
        let tokens = [];
        let players = [];
        let turnIndex = 0;
        let currentPlayer = '';
        let uiState = 'SETUP'; // SETUP, WAITING_ROLL, ROLLING, WAITING_MOVE, GAME_OVER
        let currentRoll = 0;
        let wager = 0;
        let numBots = 0;

        function startGame() {
            wager = parseInt(document.getElementById('wagerAmount').value);
            numBots = parseInt(document.getElementById('botCount').value);
            if(isNaN(wager) || wager < 10) return alert("Min wager is 10");
            
            document.getElementById('wager-overlay').style.display = 'none';
            players = ['red', 'green', 'yellow', 'blue'].slice(0, numBots + 1);
            
            tokens = [];
            players.forEach(c => {
                for(let i=0; i<4; i++) tokens.push({color: c, idx: i, pos: -1});
            });

            turnIndex = 0;
            currentPlayer = 'red';
            uiState = 'WAITING_ROLL';
            
            updateTurnUI();
            renderBoard();
        }

        function renderBoard() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            
            // Draw bases
            ctx.fillStyle = hexColors['red']; ctx.fillRect(0, 0, 6*cellSize, 6*cellSize);
            ctx.fillStyle = hexColors['green']; ctx.fillRect(9*cellSize, 0, 6*cellSize, 6*cellSize);
            ctx.fillStyle = hexColors['yellow']; ctx.fillRect(9*cellSize, 9*cellSize, 6*cellSize, 6*cellSize);
            ctx.fillStyle = hexColors['blue']; ctx.fillRect(0, 9*cellSize, 6*cellSize, 6*cellSize);
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(1*cellSize, 1*cellSize, 4*cellSize, 4*cellSize);
            ctx.fillRect(10*cellSize, 1*cellSize, 4*cellSize, 4*cellSize);
            ctx.fillRect(10*cellSize, 10*cellSize, 4*cellSize, 4*cellSize);
            ctx.fillRect(1*cellSize, 10*cellSize, 4*cellSize, 4*cellSize);

            // Draw paths
            pathList.forEach((p, i) => {
                ctx.strokeStyle = '#ccc';
                ctx.strokeRect(p.x*cellSize, p.y*cellSize, cellSize, cellSize);
                ctx.fillStyle = p.safe ? '#e2e8f0' : '#ffffff';
                ctx.fillRect(p.x*cellSize, p.y*cellSize, cellSize, cellSize);
                
                if (i===0) { ctx.fillStyle=hexColors['red']; ctx.fillRect(p.x*cellSize, p.y*cellSize, cellSize, cellSize); }
                if (i===13) { ctx.fillStyle=hexColors['green']; ctx.fillRect(p.x*cellSize, p.y*cellSize, cellSize, cellSize); }
                if (i===26) { ctx.fillStyle=hexColors['yellow']; ctx.fillRect(p.x*cellSize, p.y*cellSize, cellSize, cellSize); }
                if (i===39) { ctx.fillStyle=hexColors['blue']; ctx.fillRect(p.x*cellSize, p.y*cellSize, cellSize, cellSize); }
            });

            // Draw home stretches
            for(let c in homeStretches) {
                homeStretches[c].forEach(p => {
                    ctx.fillStyle = hexColors[c];
                    ctx.fillRect(p.x*cellSize, p.y*cellSize, cellSize, cellSize);
                    ctx.strokeStyle = '#333';
                    ctx.strokeRect(p.x*cellSize, p.y*cellSize, cellSize, cellSize);
                });
            }

            // Center Home Triangles
            ctx.beginPath(); ctx.moveTo(6*cellSize, 6*cellSize); ctx.lineTo(9*cellSize, 6*cellSize); ctx.lineTo(7.5*cellSize, 7.5*cellSize); ctx.fillStyle = hexColors['green']; ctx.fill();
            ctx.beginPath(); ctx.moveTo(9*cellSize, 6*cellSize); ctx.lineTo(9*cellSize, 9*cellSize); ctx.lineTo(7.5*cellSize, 7.5*cellSize); ctx.fillStyle = hexColors['yellow']; ctx.fill();
            ctx.beginPath(); ctx.moveTo(9*cellSize, 9*cellSize); ctx.lineTo(6*cellSize, 9*cellSize); ctx.lineTo(7.5*cellSize, 7.5*cellSize); ctx.fillStyle = hexColors['blue']; ctx.fill();
            ctx.beginPath(); ctx.moveTo(6*cellSize, 9*cellSize); ctx.lineTo(6*cellSize, 6*cellSize); ctx.lineTo(7.5*cellSize, 7.5*cellSize); ctx.fillStyle = hexColors['red']; ctx.fill();

            // Count map for staggering
            let countMap = {};
            tokens.forEach(t => {
                let abs = t.pos === -1 ? basePositions[t.color][t.idx] : playerPaths[t.color][t.pos];
                let key = `${abs.x},${abs.y}`;
                if (!countMap[key]) countMap[key] = [];
                countMap[key].push(t);
            });

            // Draw Tokens
            tokens.forEach(t => {
                let abs = t.pos === -1 ? basePositions[t.color][t.idx] : playerPaths[t.color][t.pos];
                let list = countMap[`${abs.x},${abs.y}`];
                let idx = list.indexOf(t);
                
                let cx = abs.x * cellSize + cellSize/2;
                let cy = abs.y * cellSize + cellSize/2;
                
                if (list.length > 1 && t.pos !== -1) {
                    let offset = cellSize * 0.2;
                    if (idx === 0) { cx -= offset; cy -= offset; }
                    else if (idx === 1) { cx += offset; cy -= offset; }
                    else if (idx === 2) { cx -= offset; cy += offset; }
                    else if (idx === 3) { cx += offset; cy += offset; }
                }

                ctx.beginPath();
                ctx.arc(cx, cy, cellSize*0.35, 0, Math.PI*2);
                ctx.fillStyle = hexColors[t.color];
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#fff';
                ctx.stroke();

                // Highlight human valid moves
                if (currentPlayer === 'red' && uiState === 'WAITING_MOVE' && t.color === 'red') {
                    if (evaluateMove(t, currentRoll) >= 0) {
                        ctx.beginPath();
                        ctx.arc(cx, cy, cellSize*0.4, 0, Math.PI*2);
                        ctx.strokeStyle = '#00F2FE';
                        ctx.lineWidth = 3;
                        ctx.setLineDash([5, 5]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                }
            });
        }

        function rollDiceAction() {
            if (currentPlayer !== 'red' || uiState !== 'WAITING_ROLL') return;
            executeRoll();
        }

        function executeRoll() {
            uiState = 'ROLLING';
            const d = document.getElementById('dice');
            d.classList.add('rolling');
            
            setTimeout(() => {
                d.classList.remove('rolling');
                currentRoll = Math.floor(Math.random() * 6) + 1;
                
                // Snap to face
                if (currentRoll === 1) d.style.transform = "rotateY(0deg)";
                if (currentRoll === 6) d.style.transform = "rotateY(-180deg)";
                if (currentRoll === 3) d.style.transform = "rotateY(-90deg)";
                if (currentRoll === 4) d.style.transform = "rotateY(90deg)";
                if (currentRoll === 2) d.style.transform = "rotateX(-90deg)";
                if (currentRoll === 5) d.style.transform = "rotateX(90deg)";
                
                handleRollResult();
            }, 600);
        }

        function handleRollResult() {
            let validMoves = [];
            tokens.filter(t => t.color === currentPlayer).forEach(t => {
                if (evaluateMove(t, currentRoll) >= 0) validMoves.push(t);
            });
            
            if (validMoves.length === 0) {
                setTimeout(nextTurn, 1000);
            } else {
                uiState = 'WAITING_MOVE';
                renderBoard();
                if (currentPlayer !== 'red') {
                    setTimeout(botPlay, 1000);
                }
            }
        }

        function botPlay() {
            if (uiState !== 'WAITING_MOVE') return;
            let validMoves = [];
            tokens.filter(t => t.color === currentPlayer).forEach(t => {
                let score = evaluateMove(t, currentRoll);
                if (score >= 0) validMoves.push({token: t, score});
            });

            if (validMoves.length === 0) {
                setTimeout(nextTurn, 1000);
                return;
            }

            validMoves.sort((a, b) => b.score - a.score);
            executeMove(validMoves[0].token, currentRoll);
        }

        function evaluateMove(t, roll) {
            if (t.pos === -1) {
                if (roll === 6) return 300; // Priority 3
                return -1;
            }
            let newPos = t.pos + roll;
            if (newPos > 56) return -1;
            if (newPos === 56) return 500; // Priority 2
            
            let abs = playerPaths[t.color][newPos];
            let score = t.pos; // Priority 4 (closest to home)
            
            if (!abs.safe) {
                let enemies = tokens.filter(other => 
                    other.color !== t.color && 
                    other.pos >= 0 && other.pos <= 50 &&
                    playerPaths[other.color][other.pos].x === abs.x &&
                    playerPaths[other.color][other.pos].y === abs.y
                );
                if (enemies.length > 0) score += 1000 * enemies.length; // Priority 1
            }
            return score;
        }

        function executeMove(t, roll) {
            if (t.pos === -1) t.pos = 0;
            else t.pos += roll;
            
            let killed = false;
            let home = false;
            
            if (t.pos === 56) {
                home = true;
            } else if (t.pos <= 50) {
                let abs = playerPaths[t.color][t.pos];
                if (!abs.safe) {
                    tokens.forEach(other => {
                        if (other.color !== t.color && other.pos >= 0 && other.pos <= 50) {
                            let oAbs = playerPaths[other.color][other.pos];
                            if (oAbs.x === abs.x && oAbs.y === abs.y) {
                                other.pos = -1; 
                                killed = true;
                            }
                        }
                    });
                }
            }
            
            renderBoard();
            
            if (tokens.filter(tk => tk.color === t.color && tk.pos === 56).length === 4) {
                endGame(t.color);
                return;
            }

            if (roll === 6 || killed || home) {
                currentRoll = 0;
                uiState = 'WAITING_ROLL';
                updateTurnUI();
            } else {
                setTimeout(nextTurn, 500);
            }
        }

        function nextTurn() {
            if(uiState === 'GAME_OVER') return;
            turnIndex = (turnIndex + 1) % players.length;
            currentPlayer = players[turnIndex];
            uiState = 'WAITING_ROLL';
            updateTurnUI();
            renderBoard();
        }

        function updateTurnUI() {
            if(uiState === 'GAME_OVER') return;
            const ind = document.getElementById('turn-indicator');
            ind.style.color = hexColors[currentPlayer];
            ind.innerText = currentPlayer === 'red' ? "Your Turn (Click Dice)" : `Bot Turn (${currentPlayer})`;
            
            if (currentPlayer !== 'red' && uiState === 'WAITING_ROLL') {
                setTimeout(executeRoll, 1000);
            }
        }

        async function endGame(winnerColor) {
            uiState = 'GAME_OVER';
            let isWin = (winnerColor === 'red');
            let payout = isWin ? wager * numBots : 0;
            
            let msg = isWin ? `You won! Payout: $${payout}` : `Bot (${winnerColor}) won. You lost.`;
            document.getElementById('turn-indicator').innerText = msg;
            
            try {
                await fetch('/api/ludo/result', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId, wager, isWin, payout })
                });
            } catch(e) {}
            
            setTimeout(() => {
                alert(msg);
                goBack();
            }, 2000);
        }

        canvas.addEventListener('click', (e) => {
            if (currentPlayer !== 'red' || uiState !== 'WAITING_MOVE') return;
            let rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width;
            let scaleY = canvas.height / rect.height;
            
            let cx = (e.clientX - rect.left) * scaleX;
            let cy = (e.clientY - rect.top) * scaleY;
            
            let gridX = Math.floor(cx / cellSize);
            let gridY = Math.floor(cy / cellSize);
            
            let validMoves = [];
            tokens.filter(t => t.color === 'red').forEach(t => {
                let abs = t.pos === -1 ? basePositions[t.color][t.idx] : playerPaths[t.color][t.pos];
                if (abs.x === gridX && abs.y === gridY) {
                    if (evaluateMove(t, currentRoll) >= 0) {
                        validMoves.push(t);
                    }
                }
            });

            if (validMoves.length > 0) {
                uiState = 'MOVING';
                executeMove(validMoves[0], currentRoll);
            }
        });
        
        // Initial Draw
        renderBoard();
    </script>
</body>
</html>
