<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#03050d">
<title>MYFA • Ongoing</title>
<style>
:root{--gold:#ffd43b;--green:#18e06f;--red:#ff315f;--blue:#20c9ff;--pink:#ff28d7;--violet:#7b2cff;--bg:#02040b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:Arial,Helvetica,sans-serif}body{display:flex;align-items:center;justify-content:center;color:#fff}
#ongoing{position:relative;width:100%;height:100%;min-height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 20%,#182452 0,#080c20 42%,#01030a 100%)}
#ongoing.preview-mode::before{content:"WEB PREVIEW • ?ongoing";position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:80;font-size:10px;font-weight:800;letter-spacing:.7px;color:#fff;background:rgba(3,8,22,.72);border:1px solid rgba(255,212,59,.45);padding:7px 11px;border-radius:999px;backdrop-filter:blur(10px);pointer-events:none}
.bg-stars,.bg-stars:before,.bg-stars:after{position:absolute;inset:-20%;content:"";pointer-events:none;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px),radial-gradient(circle,#65dfff 0 1px,transparent 1.5px),radial-gradient(circle,#ffd84a 0 1px,transparent 1.5px);background-size:97px 113px,151px 139px,211px 181px;opacity:.28;animation:stars 20s linear infinite}
.bg-stars:before{inset:10%;opacity:.22;animation-duration:31s;transform:scale(1.3)}.bg-stars:after{inset:30%;opacity:.2;animation-duration:43s;transform:scale(1.7)}
@keyframes stars{to{transform:translate3d(80px,60px,0) rotate(.5deg)}}
.stage{position:relative;width:min(430px,100vw);height:min(100vh,760px);display:flex;align-items:center;justify-content:center;z-index:5}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transform:translateX(34px) scale(.985);transition:opacity .42s ease,transform .55s cubic-bezier(.2,.8,.2,1),visibility .42s;pointer-events:none}
.screen.active{opacity:1;visibility:visible;transform:none;pointer-events:auto}
.art{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art img.page{width:100%;height:100%;object-fit:contain;display:block;filter:saturate(1.02);user-select:none;-webkit-user-drag:none;animation:artBreath 7s ease-in-out infinite}
@keyframes artBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.006)}}
.art:after{content:"";position:absolute;inset:1.5% 3%;border-radius:9% 9% 8% 8%;pointer-events:none;box-shadow:inset 0 0 35px rgba(0,0,0,.28),inset 0 0 4px rgba(255,220,80,.2)}
.sparkle{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px rgba(255,230,80,.8);animation:twinkle 1.8s ease-in-out infinite;pointer-events:none}.s1{left:14%;top:19%;animation-delay:.2s}.s2{left:78%;top:25%;animation-delay:.8s}.s3{left:24%;top:72%;animation-delay:1.1s}.s4{left:86%;top:66%;animation-delay:.5s}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:1;transform:scale(1.6)}}
.flowers{position:absolute;inset:0;pointer-events:none;overflow:hidden}.petal{position:absolute;font-size:20px;filter:drop-shadow(0 0 6px rgba(255,210,30,.5));animation:float 7s linear infinite;opacity:0}.p1{left:8%;top:-3%;animation-delay:0s}.p2{left:72%;top:7%;animation-delay:1.5s;font-size:15px}.p3{left:42%;top:-4%;animation-delay:3.2s;font-size:13px}.p4{left:88%;top:38%;animation-delay:4.2s;font-size:18px}.p5{left:18%;top:42%;animation-delay:2.2s;font-size:14px}
@keyframes float{0%{transform:translate3d(0,-20px,0) rotate(0);opacity:0}12%{opacity:.85}50%{transform:translate3d(16px,45vh,0) rotate(170deg);opacity:.75}88%{opacity:.35}100%{transform:translate3d(-10px,92vh,0) rotate(330deg);opacity:0}}
.overlay-btn{position:absolute;border:0;background:transparent;cursor:pointer;z-index:20;touch-action:manipulation;outline:none}.overlay-btn:focus-visible{box-shadow:0 0 0 3px #fff,0 0 0 6px #00d9ff;border-radius:30px}.page1-next{left:14%;right:5%;bottom:8%;height:8%}.page2-next{left:14%;right:5%;bottom:8%;height:8%}.page3-next{left:14%;right:5%;bottom:8%;height:8%}.skip{right:4%;top:4%;width:22%;height:7%}
.tap-ring{position:absolute;inset:0;pointer-events:none;opacity:0}.active .tap-ring{animation:softPulse 2.8s ease-in-out infinite}.tap-ring:before{content:"";position:absolute;left:15%;right:5%;bottom:8%;height:8%;border-radius:50px;box-shadow:0 0 0 0 rgba(255,255,255,.32)}
@keyframes softPulse{0%,100%{opacity:0}50%{opacity:.7}}
#status{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:50;font-size:11px;letter-spacing:.5px;color:rgba(255,255,255,.6);background:rgba(0,0,0,.38);padding:6px 10px;border-radius:999px;backdrop-filter:blur(8px);opacity:0;transition:opacity .2s}#status.show{opacity:1}
#loading{position:absolute;z-index:60;inset:0;display:flex;align-items:center;justify-content:center;background:#02040b;transition:opacity .35s}.loader{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:#ffd43b;border-right-color:#ff29d6;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#error{display:none;position:absolute;z-index:100;inset:0;align-items:center;justify-content:center;text-align:center;padding:30px;background:#02040b}.errorbox{max-width:340px;border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:25px;background:rgba(10,16,35,.9)}.errorbox h2{margin:0 0 10px}.errorbox p{color:#b9c3d9;line-height:1.5}
@media(max-height:700px){.stage{height:100vh}.overlay-btn{transform:scale(.98)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div id="ongoing">
 <div class="bg-stars"></div>
 <div class="stage">
  <section class="screen active" data-page="1" aria-label="MYFA onboarding page 1">
   <div class="art"><img class="page" src="/assets/ongoing/page1.png" alt="MYFA onboarding page 1"><div class="sparkle s1"></div><div class="sparkle s2"></div><div class="sparkle s3"></div><div class="sparkle s4"></div><div class="flowers"><i class="petal p1">✦</i><i class="petal p2">✦</i><i class="petal p3">✦</i><i class="petal p4">✦</i><i class="petal p5">✦</i></div><div class="tap-ring"></div><button class="overlay-btn skip" data-action="skip" aria-label="Skip onboarding"></button><button class="overlay-btn page1-next" data-action="next" aria-label="Continue to page 2"></button></div>
  </section>
  <section class="screen" data-page="2" aria-label="MYFA onboarding page 2">
   <div class="art"><img class="page" src="/assets/ongoing/page2.png" alt="MYFA onboarding page 2"><div class="sparkle s1"></div><div class="sparkle s2"></div><div class="sparkle s3"></div><div class="sparkle s4"></div><div class="flowers"><i class="petal p1">✦</i><i class="petal p2">✦</i><i class="petal p3">✦</i><i class="petal p4">✦</i><i class="petal p5">✦</i></div><div class="tap-ring"></div><button class="overlay-btn skip" data-action="skip" aria-label="Skip onboarding"></button><button class="overlay-btn page2-next" data-action="next" aria-label="Continue to page 3"></button></div>
  </section>
  <section class="screen" data-page="3" aria-label="MYFA onboarding page 3">
   <div class="art"><img class="page" src="/assets/ongoing/page3.png" alt="MYFA onboarding page 3"><div class="sparkle s1"></div><div class="sparkle s2"></div><div class="sparkle s3"></div><div class="sparkle s4"></div><div class="flowers"><i class="petal p1">✦</i><i class="petal p2">✦</i><i class="petal p3">✦</i><i class="petal p4">✦</i><i class="petal p5">✦</i></div><div class="tap-ring"></div><button class="overlay-btn skip" data-action="skip" aria-label="Skip onboarding"></button><button class="overlay-btn page3-next" data-action="finish" aria-label="Get started"></button></div>
  </section>
 </div>
 <div id="status" aria-live="polite"></div>
 <div id="loading"><div class="loader" aria-label="Loading"></div></div>
 <div id="error"><div class="errorbox"><h2>MYFA Ongoing</h2><p id="errorText">Open this page inside Telegram for the real account flow, or use <b>?ongoing</b> in your browser for a visual preview.</p></div></div>
</div>
<script>
(function(){
 'use strict';
 const screens=[...document.querySelectorAll('.screen')];
 const loading=document.getElementById('loading'), error=document.getElementById('error'), status=document.getElementById('status');
 let page=1, busy=false, tgUser=null;
 const tg=window.Telegram && window.Telegram.WebApp;
 const params=new URLSearchParams(window.location.search);
 const webPreview=params.has('ongoing');
 const testUser=params.get('test_user');
 if(tg){try{tg.ready();tg.expand();}catch(e){}}
 tgUser=tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
 if(testUser && /^\d+$/.test(testUser)) tgUser={id:testUser,first_name:'Web Test User'};
 if(webPreview) document.getElementById('ongoing').classList.add('preview-mode');
 function showStatus(t){status.textContent=t;status.classList.add('show');clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>status.classList.remove('show'),1800)}
 function show(n){page=Math.max(1,Math.min(3,n));screens.forEach(s=>s.classList.toggle('active',Number(s.dataset.page)===page));}
 async function userState(){
   if(!tgUser || !tgUser.id) return null;
   const r=await fetch('/api/user/'+encodeURIComponent(tgUser.id),{cache:'no-store'});
   if(!r.ok) throw new Error('Unable to load account');
   return await r.json();
 }
 async function finish(){
   if(busy)return;busy=true;showStatus('Starting MYFA…');
   // ?ongoing without a Telegram account is a safe visual browser preview.
   // It never changes a real account and lets the owner test all 3 pages.
   if(webPreview && !testUser && !tgUser){
     busy=false;
     showStatus('Preview complete • no account changed');
     busy=false;
     return;
   }
   try{
     if(!tgUser || !tgUser.id) throw new Error('Open MYFA in Telegram or add ?test_user=YOUR_TELEGRAM_ID');
     const r=await fetch('/api/first-open-complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:String(tgUser.id)})});
     const d=await r.json().catch(()=>({}));
     if(!(d.success || d.error==='Already completed.')) throw new Error(d.error||'Could not complete onboarding');
     try{if(tg)tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success')}catch(e){}
     window.location.replace('/');
   }catch(e){busy=false;showStatus(e.message||'Please try again');}
 }
 function skip(){ if(busy)return; finish(); }
 document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='next')show(page+1);else if(a==='finish'||a==='skip')finish();});
 let sx=0,sy=0;document.addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});document.addEventListener('touchend',e=>{if(!sx)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=sy=0;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)){if(dx<0&&page<3)show(page+1);else if(dx>0&&page>1)show(page-1)}} ,{passive:true});
 document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&page<3)show(page+1);if(e.key==='ArrowLeft'&&page>1)show(page-1);if(e.key==='Escape')skip()});
 (async()=>{try{
   // Browser preview: ?ongoing shows the onboarding without Telegram.
   if(webPreview && !testUser && !tgUser){loading.style.opacity='0';setTimeout(()=>loading.style.display='none',360);return;}
   if(!tgUser||!tgUser.id){loading.style.display='none';error.style.display='flex';return}
   const u=await userState();
   if(u&&u.firstOpenCompleted && !webPreview){window.location.replace('/');return}
   loading.style.opacity='0';setTimeout(()=>loading.style.display='none',360);
 }catch(e){loading.style.display='none';error.style.display='flex';}})();
})();
</script>
</body></html>
