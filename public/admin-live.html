<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYFA Admin</title><style>body{font-family:Arial;background:#0b0b2a;color:#fff;padding:20px}.card{background:#171744;padding:20px;border-radius:14px;margin:12px 0}input,button{padding:10px;border-radius:8px;margin:5px}button{cursor:pointer}</style></head><body><div id="app"><div class="card"><h2>MYFA Admin</h2><input id="u" value="admin"><input id="p" type="password" value="admin"><button onclick="login()">Login</button></div></div><script>const K='MYFA_ADMIN_SESSION';let D={};async function login(){const r=await fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:u.value,password:p.value})});const d=await r.json();if(!d.success)return alert(d.error||'Login failed');sessionStorage.setItem(K,d.token);load()}async function api(t,b={}){const r=await fetch('/api/admin-gateway?target='+t,{method:'POST',headers:{'Content-Type':'application/json','X-MYFA-ADMIN-SESSION':sessionStorage.getItem(K)},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw Error(d.error||'Admin request failed');return d}async function load(){D=await api('data');render()}function render(){const c=D.config||{};const tasks=D.tasks||{};app.innerHTML='<div class="card"><h2>MYFA Admin</h2><button onclick="load()">Refresh</button><button onclick="show(\'config\')">Economy & Withdrawals</button><button onclick="show(\'tasks\')">Bonus Tasks</button><button onclick="show(\'users\')">Users</button><button onclick="show(\'withdrawals\')">Withdrawals</button></div><div id="view"></div>';show('config')}function inp(id,label,val){return '<label style="display:block">'+label+'<br><input id="'+id+'" value="'+(val??'')+'" style="width:95%"></label>'}function show(x){let v=document.getElementById('view');if(x==='config'){v.innerHTML='<div class="card"><h3>Config</h3>'+inp('currency','Currency Name',D.config.currencyName||'Gems')+inp('rate','Exchange Rate',D.config.exchangeRate||100)+inp('tax','Tax %',D.config.taxRate||0)+inp('mtzone','Monetag Zone',D.config.monetagZoneId||'')+inp('mtlimit','Monetag Daily Limit',D.config.monetagLimit||0)+inp('adreward','Reward Per Ad',D.config.realMoneyPerAd||0.05)+inp('ref1','Inviter Bonus',D.config.referralBonusReferrer||0)+inp('ref2','Invitee Bonus',D.config.referralBonusReferee||0)+inp('minw','Min Withdrawal',D.config.minWithdraw||0)+inp('maxw','Max Daily Withdrawal',D.config.maxWithdraw||0)+'<button onclick="saveConfig()">Save to Firebase</button></div>'}else if(x==='tasks'){v.innerHTML='<div class="card"><h3>Active Tasks</h3><div id="tl"></div><hr>'+inp('tn','Task Name','')+inp('tr','Reward','100')+inp('tu','Target URL / Channel','https://t.me/')+'<button onclick="createTask()">Create Task</button></div>';tl.innerHTML=Object.entries(tasks).map(([id,t])=>'<div class="card"><b>'+t.name+'</b> — '+t.reward+' Gems <button onclick="toggleTask(\''+id+'\')">Toggle</button><button onclick="deleteTask(\''+id+'\')">Delete</button></div>').join('')}else if(x==='users'){v.innerHTML='<div class="card"><h3>Users</h3><div>'+Object.entries(D.users||{}).slice(0,50).map(([id,u])=>'<div>'+id+' — '+(u.accountName||u.username||'User')+' — '+(u.points||0)+' Gems</div>').join('')+'</div></div>'}else if(x==='withdrawals'){v.innerHTML='<div class="card"><h3>Pending Withdrawals</h3><div>'+Object.entries(D.withdrawals||{}).filter(([,w])=>w.status==='pending').map(([id,w])=>'<div>'+id+' — '+w.userId+' — '+w.amount+' <button onclick="wd(\''+id+'\',\'approve\')">Approve</button><button onclick="wd(\''+id+'\',\'reject\')">Reject</button></div>').join('')+'</div></div>'}}async function saveConfig(){const fullConfig={currencyName:currency.value,exchangeRate:rate.value,taxRate:tax.value,monetagZoneId:mtzone.value,monetagLimit:mtlimit.value,realMoneyPerAd:adreward.value,referralBonusReferrer:ref1.value,referralBonusReferee:ref2.value,minWithdraw:minw.value,maxWithdraw:maxw.value};await api('config',{fullConfig});await load();alert('Saved to Firebase')}async function createTask(){await api('task-create',{task:{name:tn.value,reward:tr.value,url:tu.value}});await load();show('tasks');alert('Task created')}async function toggleTask(id){await api('task-toggle',{id});await load();show('tasks')}async function deleteTask(id){await api('task-delete',{id});await load();show('tasks')}async function wd(id,action){await api('withdrawals',{ids:[id],action});await load();show('withdrawals')}if(sessionStorage.getItem(K))load().catch(()=>sessionStorage.removeItem(K))</script></body></html>
