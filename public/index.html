<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Besh Besh</title>
    
    <!-- MONETAG AD SDK -->
    <script src='//libtl.com/sdk.js' data-zone='10024038' data-sdk='show_10024038'></script>
    <!-- ADSGRAM SDK -->
    <script src="https://api.adsgram.ai/js/adsgram.js?blockId=int-20922"></script>

    <!-- FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/index.css">

    <!-- SDKs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <!-- OFFLINE ALERT -->
    <div id="offline-alert" class="toast error" style="display: none; bottom: auto; top: -100px; z-index: 4000;">
        <i class="fa-solid fa-wifi"></i> <span>No Internet</span>
    </div>

    <div class="app-container" id="app-container">

        <!-- THEME & SOUND SWITCH (Top Right) -->
        <div class="theme-switch-wrapper" style="position: fixed; top: 15px; right: 15px; z-index: 1000; display: flex; align-items: center; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 20px;">
            <i class="fa-solid fa-volume-high" id="soundToggleIcon" onclick="toggleSound()" style="cursor: pointer; color: white; margin-right: 15px; font-size: 1.1rem;"></i>
            <i class="fa-solid fa-moon" id="themeToggleIcon" onclick="toggleTheme()" style="cursor: pointer; color: white; font-size: 1.1rem;"></i>
        </div>

        <!-- LOADING SCREEN -->
        <div id="loading-overlay">
            <i class="fa-solid fa-gem loading-logo" style="font-size: 4rem; color: #B026FF;"></i>
            <h3 class="loading-text">Besh Besh</h3>
        </div>

        <!-- HEADERS -->
        <div id="homeHeader" class="home-header">
            <h1 style="font-size: 2.5rem; font-weight:800;">Besh Besh</h1>
            <div style="font-size: 0.9rem; opacity: 0.8;">Earn rewards daily</div>
        </div>

        <div id="pageHeader" class="page-header glass" style="position: sticky; top: 0; z-index: 10; margin-bottom: 20px; display: none;">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="profile-pic" id="pageHeaderAvatar" style="width:40px; height:40px;"></div>
                <div>
                    <div style="font-weight:700;" id="pageHeaderName">User</div>
                    <div class="badge badge-silver" id="pageHeaderStatus" style="font-size: 0.6rem;">Member</div>
                </div>
            </div>
            <div style="font-weight:800; color:var(--accent-color); font-size: 1.1rem;">
                <i class="fa-solid fa-gem"></i> <span id="pageHeaderBalance">0</span>
            </div>
        </div>

        <!-- PROFILE SECTION (Home Only) -->
        <div id="profileSection" class="profile-section">
            <div class="profile-card glass">
                <div class="profile-pic" id="mainAvatar"></div>
                <h2 id="profileNameDisplay" style="margin-top: 15px; font-weight: 800;">User</h2>
                <div class="points-display"><i class="fa-solid fa-gem"></i> <span id="homePointsVal">0</span></div>
                
                <div style="margin-top: 20px; text-align: left;">
                    <div style="font-size: 0.8rem; font-weight: 600; color: #888;">Daily Login Streak</div>
                    <div class="streak-container" id="streakContainer"></div>
                </div>
            </div>
        </div>

        <!-- MAIN CONTENT AREA (All Pages Render Here to Fix Blank Space) -->
        <div id="mainContent" class="content-section" style="min-height: 50vh;"></div>

        <!-- BOTTOM NAV -->
        <div class="bottom-nav glass">
            <a href="javascript:void(0)" class="nav-item active" onclick="navTo('home')"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="javascript:void(0)" class="nav-item" onclick="navTo('tasks')"><i class="fa-solid fa-list-check"></i><span>Tasks</span></a>
            <a href="javascript:void(0)" class="nav-item" onclick="navTo('games')"><i class="fa-solid fa-gamepad"></i><span>Games</span></a>
            <a href="javascript:void(0)" class="nav-item" onclick="navTo('leaderboard')"><i class="fa-solid fa-trophy"></i><span>Top</span></a>
            <a href="javascript:void(0)" class="nav-item" onclick="navTo('referral')"><i class="fa-solid fa-user-group"></i><span>Invite</span></a>
            <a href="javascript:void(0)" class="nav-item" onclick="navTo('withdraw')"><i class="fa-solid fa-wallet"></i><span>Pay</span></a>
        </div>
    </div>

    <!-- AUDIO -->
    <audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="successSound" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

    <div id="toast" class="toast"></div>

    <script>
        const API_BASE_URL = ''; 
        let AppConfig = {}, BonusTasks = [], currentUser = null, userId = null, LeaderboardData = null;
        let userPhotoUrl = 'https://ui-avatars.com/api/?name=User&background=B026FF&color=fff';
        
        let isDarkMode = localStorage.getItem('theme') !== 'light';
        let soundEnabled = localStorage.getItem('sound') !== 'off';

        // Initialize SDKs
        let AdController;
        try { AdController = window.Adsgram.init({ blockId: "int-20922" }); } catch(e) {}

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
            document.body.classList.toggle('day-mode', !isDarkMode);
            document.body.classList.toggle('dark-mode', isDarkMode);
            document.getElementById('themeToggleIcon').className = isDarkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('sound', soundEnabled ? 'on' : 'off');
            document.getElementById('soundToggleIcon').className = soundEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
        }

        function playSound(id) { if(soundEnabled) document.getElementById(id)?.play().catch(()=>{}); }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerHTML = `<i class="fa-solid fa-bell"></i> ${msg}`;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const tg = window.Telegram.WebApp;
            if(tg.expand) tg.expand();
            
            document.body.classList.toggle('day-mode', !isDarkMode);
            document.body.classList.toggle('dark-mode', isDarkMode);
            document.getElementById('themeToggleIcon').className = isDarkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            document.getElementById('soundToggleIcon').className = soundEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';

            const tgUser = tg.initDataUnsafe?.user;
            userId = tgUser?.id?.toString() || new URLSearchParams(window.location.search).get('userId') || "test_user_1";
            let realName = tgUser ? (tgUser.username || tgUser.first_name) : "User";
            userPhotoUrl = `/api/avatar/${userId}`; 

            try {
                const [c, t] = await Promise.all([fetch('/api/config'), fetch('/api/tasks')]);
                AppConfig = await c.json();
                BonusTasks = Object.values(await t.json() || {});

                let res = await fetch(`/api/user/${userId}?name=${encodeURIComponent(realName)}`);
                if(!res.ok) {
                    await fetch('/api/ensure-user', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId, username: realName }) });
                    res = await fetch(`/api/user/${userId}`);
                }
                currentUser = await res.json();
                currentUser.username = realName;

                document.getElementById('loading-overlay').style.display = 'none';
                document.querySelectorAll('.profile-pic').forEach(el => el.style.backgroundImage = `url('${userPhotoUrl}')`);
                updateUI();
                navTo('home');
            } catch (e) {
                document.getElementById('loading-overlay').style.display = 'none';
                alert("Failed to load app data.");
            }
        });

        function updateUI() {
            if(!currentUser) return;
            const pts = currentUser.points || 0;
            document.getElementById('profileNameDisplay').textContent = currentUser.username;
            document.getElementById('homePointsVal').textContent = pts.toLocaleString();
            document.getElementById('pageHeaderName').textContent = currentUser.username;
            document.getElementById('pageHeaderBalance').innerText = pts.toLocaleString();

            let tier = "Bronze", badgeCls = "badge-bronze";
            if(pts > 50000) { tier = "Platinum"; badgeCls = "badge-platinum"; }
            else if(pts > 20000) { tier = "Gold"; badgeCls = "badge-gold"; }
            else if(pts > 5000) { tier = "Silver"; badgeCls = "badge-silver"; }
            document.getElementById('pageHeaderStatus').className = `badge ${badgeCls}`;
            document.getElementById('pageHeaderStatus').textContent = tier;
        }

        function navTo(page) {
            playSound('clickSound');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.nav-item[onclick="navTo('${page}')"]`).classList.add('active');
            
            const isHome = page === 'home';
            document.getElementById('homeHeader').style.display = isHome ? 'flex' : 'none';
            document.getElementById('profileSection').style.display = isHome ? 'block' : 'none';
            document.getElementById('pageHeader').style.display = isHome ? 'none' : 'flex';

            const c = document.getElementById('mainContent');
            
            if(page === 'home') renderHome(c);
            else if(page === 'tasks') renderTasks(c);
            else if(page === 'games') renderGameHub(c);
            else if(page === 'leaderboard') renderLeaderboard(c);
            else if(page === 'referral') renderReferral(c);
            else if(page === 'withdraw') renderWithdraw(c);
            
            window.scrollTo(0,0);
        }

        // ==========================================
        // HOME RENDERER (Restored 6 Stats)
        // ==========================================
        function renderHome(c) {
            let streakHtml = '';
            for(let i=1; i<=7; i++) {
                let bg = i <= (currentUser.streak||1) ? 'var(--accent-color)' : 'rgba(0,0,0,0.1)';
                let col = i <= (currentUser.streak||1) ? 'white' : '#888';
                streakHtml += `<div style="width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:0.8rem; background:${bg}; color:${col};">${i}</div>`;
            }
            document.getElementById('streakContainer').innerHTML = streakHtml;

            const adsLeft = (AppConfig.adsPerDay || 20) - (currentUser.adsWatchedToday || 0);
            const rank = currentUser.rank ? `#${currentUser.rank}` : '#N/A'; 

            c.innerHTML = `
                <div class="card glass">
                    <div class="home-actions" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <button class="btn btn-primary" onclick="showToast('Story feature coming soon')"><i class="fa-solid fa-camera"></i> Post Story</button>
                        <button class="btn btn-secondary" onclick="navTo('withdraw')"><i class="fa-solid fa-wallet"></i> Withdraw</button>
                    </div>
                </div>
                
                <div class="card glass home-stats" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; text-align:center;">
                    <div style="background:rgba(0,0,0,0.05); padding:10px; border-radius:10px;">
                        <div style="font-size:0.8rem; color:#888;">Referrals</div>
                        <div style="font-weight:bold; color:var(--accent-color);">${currentUser.referredUsers?.length || 0}</div>
                    </div>
                    <div style="background:rgba(0,0,0,0.05); padding:10px; border-radius:10px;">
                        <div style="font-size:0.8rem; color:#888;">Rank</div>
                        <div style="font-weight:bold; color:var(--accent-color);">${rank}</div>
                    </div>
                    <div style="background:rgba(0,0,0,0.05); padding:10px; border-radius:10px;">
                        <div style="font-size:0.8rem; color:#888;">Ads Left</div>
                        <div style="font-weight:bold; color:var(--accent-color);">${adsLeft < 0 ? 0 : adsLeft}</div>
                    </div>
                    <div style="background:rgba(0,0,0,0.05); padding:10px; border-radius:10px;">
                        <div style="font-size:0.8rem; color:#888;">Total Ads</div>
                        <div style="font-weight:bold; color:var(--accent-color);">${currentUser.totalAdsWatchedLifetime || 0}</div>
                    </div>
                    <div style="background:rgba(0,0,0,0.05); padding:10px; border-radius:10px;">
                        <div style="font-size:0.8rem; color:#888;">Tasks</div>
                        <div style="font-weight:bold; color:var(--accent-color);">${currentUser.claimedBonuses?.length || 0}</div>
                    </div>
                    <div style="background:rgba(0,0,0,0.05); padding:10px; border-radius:10px;">
                        <div style="font-size:0.8rem; color:#888;">Withdrawn</div>
                        <div style="font-weight:bold; color:var(--accent-color);">${currentUser.totalWithdrawn || 0}</div>
                    </div>
                </div>`;
        }

        // ==========================================
        // TASKS RENDERER (Ads & Bonus)
        // ==========================================
        function renderTasks(c) {
             const adsLeft = (AppConfig.adsPerDay || 20) - (currentUser.adsWatchedToday || 0);
             const pts = (AppConfig.pointsPerAd || 50);
             
             let html = `
                <div class="card glass">
                    <h3 style="margin-bottom:15px;"><i class="fa-solid fa-bolt" style="color:var(--gold-color);"></i> Daily Earning</h3>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <div style="background:rgba(65, 88, 208, 0.1); border:1px solid #4158D0; padding:15px; border-radius:12px; text-align:center; cursor:pointer;" onclick="${adsLeft > 0 ? 'watchAd()' : 'showToast(\'Limit reached\')'}">
                            <i class="fa-brands fa-youtube" style="font-size:24px; color:#4158D0; margin-bottom:5px;"></i>
                            <div style="font-weight:bold;">Watch Ad</div>
                            <div style="font-size:0.8rem; color:var(--accent-color);">+${pts} Gems</div>
                        </div>
                        <div style="background:rgba(255, 179, 71, 0.1); border:1px solid var(--gold-color); padding:15px; border-radius:12px; text-align:center; cursor:pointer;" onclick="claimAdsgramReward()">
                            <i class="fa-solid fa-fire" style="font-size:24px; color:var(--gold-color); margin-bottom:5px;"></i>
                            <div style="font-weight:bold;">Special Ad</div>
                            <div style="font-size:0.8rem; color:var(--accent-color);">+10 Gems</div>
                        </div>
                    </div>
                </div>
                <div class="card glass">
                    <h3 style="margin-bottom:15px;"><i class="fa-solid fa-star" style="color:var(--accent-color);"></i> Bonus Tasks</h3>`;
             
             html += BonusTasks.map(t => {
                 const done = currentUser.claimedBonuses?.includes(t.id);
                 return `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(0,0,0,0.05);">
                        <div style="display:flex; align-items:center;">
                            <div style="width:40px; height:40px; background:var(--gradient-main); border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; margin-right:10px;">
                                <i class="${t.icon || 'fa-brands fa-telegram'}"></i>
                            </div>
                            <div>
                                <div style="font-weight:bold;">${t.name}</div>
                                <div style="font-size:0.8rem; color:var(--accent-color);">+${t.reward} Gems</div>
                            </div>
                        </div>
                        <button class="btn" style="width:auto; padding:8px 15px; font-size:0.8rem; background:${done?'#e2e8f0':'var(--success-color)'}; color:${done?'#94a3b8':'white'};" onclick="doTask('${t.id}','${t.channelId}',${t.reward},'${t.link}')" ${done?'disabled':''}>${done ? '<i class="fa-solid fa-check"></i>' : 'Start'}</button>
                    </div>`;
             }).join('');
             c.innerHTML = html + '</div>';
        }

        // ==========================================
        // GAME HUB & GAMES (Blank Space Fixed)
        // ==========================================
        function renderGameHub(c) {
            c.innerHTML = `
                <div class="card glass">
                    <h2 style="font-weight: 800; margin-bottom: 15px;"><i class="fa-solid fa-gamepad"></i> Game Hub</h2>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                        
                        <div style="padding:15px; background:rgba(0,0,0,0.05); border-radius:15px; text-align:center; cursor:pointer; border:1px solid var(--glass-border);" onclick="renderAviator()">
                            <i class="fa-solid fa-plane-up" style="font-size:2.5rem; color:#EF4444; margin-bottom:10px;"></i>
                            <h3 style="font-size:1rem;">Aviator</h3>
                            <p style="font-size:0.7rem; color:#888;">Crash & Win</p>
                        </div>
                        
                        <div style="padding:15px; background:rgba(0,0,0,0.05); border-radius:15px; text-align:center; cursor:pointer; border:1px solid var(--glass-border);" onclick="renderOX()">
                            <i class="fa-solid fa-xmarks-lines" style="font-size:2.5rem; color:#3B82F6; margin-bottom:10px;"></i>
                            <h3 style="font-size:1rem;">Multi OX</h3>
                            <p style="font-size:0.7rem; color:#888;">Tic-Tac-Toe</p>
                        </div>

                        <div style="padding:15px; background:rgba(0,0,0,0.05); border-radius:15px; text-align:center; cursor:pointer; border:1px solid var(--glass-border);" onclick="renderCombo()">
                            <i class="fa-solid fa-puzzle-piece" style="font-size:2.5rem; color:#10B981; margin-bottom:10px;"></i>
                            <h3 style="font-size:1rem;">Daily Combo</h3>
                            <p style="font-size:0.7rem; color:#888;">9 Card Puzzle</p>
                        </div>

                        <div style="padding:15px; background:rgba(0,0,0,0.05); border-radius:15px; text-align:center; cursor:pointer; border:1px solid var(--glass-border);" onclick="renderSpin()">
                            <i class="fa-solid fa-dharmachakra" style="font-size:2.5rem; color:var(--gold-color); margin-bottom:10px;"></i>
                            <h3 style="font-size:1rem;">Pro Spin</h3>
                            <p style="font-size:0.7rem; color:#888;">Win Massive Gems</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // ETHIOPIAN DAILY COMBO (9 CARDS)
        function renderCombo() {
            const c = document.getElementById('mainContent');
            
            // 9 Cultural/Holiday SVG Paths
            const svgs = [
                `<svg viewBox="0 0 24 24" fill="#EF4444"><path d="M12 2L10.5 7h3L12 2zM12 22v-8m-4 4h8"/></svg>`, // Meskel Cross
                `<svg viewBox="0 0 24 24" fill="#FFB347"><circle cx="12" cy="12" r="8"/></svg>`, // Sun
                `<svg viewBox="0 0 24 24" fill="#10B981"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>`, // Star
                `<svg viewBox="0 0 24 24" fill="#B026FF"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8z"/></svg>`, // Circle
                `<svg viewBox="0 0 24 24" fill="#3B82F6"><rect x="5" y="5" width="14" height="14"/></svg>`, // Box
                `<svg viewBox="0 0 24 24" fill="#F59E0B"><path d="M21 12.5c0 4.6-3.8 8.5-8.5 8.5S4 17.1 4 12.5 7.8 4 12.5 4v2c-3.6 0-6.5 2.9-6.5 6.5s2.9 6.5 6.5 6.5 6.5-2.9 6.5-6.5h2z"/></svg>`, // Moon (Eid)
                `<svg viewBox="0 0 24 24" fill="#8B5A2B"><path d="M14 2H10v4H8v14h8V6h-2V2z"/></svg>`, // Coffee
                `<svg viewBox="0 0 24 24" fill="#4B5563"><polygon points="12,2 22,22 2,22"/></svg>`, // Triangle
                `<svg viewBox="0 0 24 24" fill="#EC4899"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>` // Heart
            ];

            let cardsHtml = '';
            let slotsHtml = '';
            for(let i=0; i<9; i++) {
                cardsHtml += `<div draggable="true" ondragstart="drag(event)" id="c${i+1}" style="width:50px; height:50px; padding:10px; background:rgba(0,0,0,0.1); border-radius:10px; cursor:grab;">${svgs[i]}</div>`;
                slotsHtml += `<div id="slot${i+1}" ondrop="drop(event)" ondragover="allowDrop(event)" style="width:50px; height:50px; border:2px dashed #B026FF; border-radius:10px; display:flex; align-items:center; justify-content:center;"></div>`;
            }

            c.innerHTML = `
                <div class="card glass" style="text-align:center;">
                    <h2 style="color:#10B981;"><i class="fa-solid fa-puzzle-piece"></i> Daily Combo (9 Cards)</h2>
                    <p style="font-size:0.9rem; color:#888;">Drag the 9 icons to the correct order.</p>
                    
                    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:20px auto; width:170px;" id="comboSource">${cardsHtml}</div>
                    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:20px auto; width:170px;" id="comboTarget">${slotsHtml}</div>
                    
                    <button class="btn btn-primary" onclick="checkCombo()">Check Combo</button>
                    <div id="comboRes" style="margin-top:15px; font-weight:bold;"></div>
                    <button class="btn btn-secondary" onclick="renderGameHub(document.getElementById('mainContent'))" style="margin-top:20px;">Back to Hub</button>
                </div>
            `;
        }

        window.drag = (ev) => ev.dataTransfer.setData("text", ev.target.id);
        window.allowDrop = (ev) => ev.preventDefault();
        window.drop = (ev) => {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            if(ev.target.id.startsWith("slot") && ev.target.childElementCount === 0) ev.target.appendChild(document.getElementById(data));
        };
        window.checkCombo = async () => {
            playSound('clickSound');
            let combo = [];
            for(let i=1; i<=9; i++) {
                const child = document.getElementById(`slot${i}`).firstChild;
                if(!child) return showToast("Fill all 9 slots!");
                combo.push(child.id);
            }
            
            try {
                const res = await fetch('/api/combo', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId, combination: combo})});
                const d = await res.json();
                if(d.isCorrect) {
                    document.getElementById('comboRes').innerHTML = `<span style="color:#10B981;">Correct! +${d.reward} Gems</span>`;
                    currentUser.points += d.reward; updateUI(); confetti();
                } else {
                    document.getElementById('comboRes').innerHTML = '<span style="color:#EF4444;">Incorrect order! Try again.</span>';
                }
            } catch(e) { showToast("Error checking combo."); }
        };

        // --- AVIATOR GAME ---
        function renderAviator() {
            const c = document.getElementById('mainContent');
            c.innerHTML = `
                <div class="card glass" style="text-align:center;">
                    <h2 style="color:#EF4444; margin-bottom:10px;"><i class="fa-solid fa-plane-up"></i> Aviator</h2>
                    <div style="position:relative; width:100%; height:300px; background:#0B0B2A; border-radius:12px; overflow:hidden; border:2px solid #EF4444;">
                        <canvas id="avCanvas" style="width:100%; height:100%;"></canvas>
                        <div id="avMult" style="position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); font-size:3.5rem; font-weight:900; color:white;">1.00x</div>
                        <div id="avStatus" style="position:absolute; top:20%; left:50%; transform:translateX(-50%); color:#EF4444; font-weight:bold; font-size:1.5rem; opacity:0;">FLEW AWAY!</div>
                    </div>
                    <div style="display:flex; gap:10px; margin-top:15px;">
                        <input type="number" id="avBet" value="10" style="flex:1; padding:12px; border-radius:8px; border:1px solid #ccc; font-weight:bold; text-align:center;">
                        <button id="avBtn" class="btn btn-primary" style="flex:1; background:#10B981;" onclick="avAction()">BET</button>
                    </div>
                    <button class="btn btn-secondary" onclick="renderGameHub(document.getElementById('mainContent'))" style="margin-top:20px;">Back to Hub</button>
                </div>
            `;
            initAviatorEngine();
        }

        // ==========================================
        // LEADERBOARD (Restored Load Logic)
        // ==========================================
        async function renderLeaderboard(c) {
            c.innerHTML = `<div style="text-align:center; padding:50px;"><i class="fa-solid fa-spinner fa-spin" style="font-size:2rem; color:var(--accent-color);"></i></div>`;
            try {
                const res = await fetch(`/api/leaderboard/${userId}`);
                if(!res.ok) throw new Error("Failed");
                LeaderboardData = await res.json();
                
                const list = LeaderboardData.byPoints || [];
                if(list.length === 0) { c.innerHTML = '<div class="card glass">No data yet.</div>'; return; }

                let html = `<div class="card glass"><div style="display:flex; justify-content:center; align-items:flex-end; gap:10px; margin-bottom:30px; margin-top:20px;">`;
                
                // PODIUM
                if(list.length >= 3) {
                    const drawPodium = (u, rank, height, color) => `
                        <div style="width:30%; text-align:center;">
                            <img src="/api/avatar/${u.id || u.username}" onerror="this.src='https://ui-avatars.com/api/?name=${u.username}'" style="width:50px; height:50px; border-radius:50%; border:3px solid ${color}; object-fit:cover; margin-bottom:10px;">
                            <div style="font-size:0.8rem; font-weight:bold; overflow:hidden; text-overflow:ellipsis;">${u.username}</div>
                            <div style="font-weight:900; color:${color};">${u.points}</div>
                            <div style="height:${height}px; background:${color}; border-radius:10px 10px 0 0; margin-top:10px; display:flex; align-items:center; justify-content:center; color:black; font-weight:bold;">${rank}</div>
                        </div>`;
                    html += drawPodium(list[1], 2, 40, '#C0C0C0');
                    html += drawPodium(list[0], 1, 60, '#FFD700');
                    html += drawPodium(list[2], 3, 30, '#CD7F32');
                }
                html += `</div>`;

                list.slice(3, 20).forEach((u, i) => {
                    html += `<div style="display:flex; align-items:center; padding:12px; border-bottom:1px solid rgba(0,0,0,0.05);">
                        <div style="width:30px; font-weight:bold; color:#888;">${i+4}</div>
                        <img src="/api/avatar/${u.id || u.username}" onerror="this.src='https://ui-avatars.com/api/?name=${u.username}'" style="width:40px; height:40px; border-radius:50%; margin-right:15px; object-fit:cover;">
                        <div style="flex:1; font-weight:bold;">${u.username}</div>
                        <div style="color:var(--accent-color); font-weight:900;">${u.points} <i class="fa-solid fa-gem"></i></div>
                    </div>`;
                });
                c.innerHTML = html + `</div>`;
            } catch(e) {
                c.innerHTML = '<div class="card glass"><p style="text-align:center; color:#EF4444;"><i class="fa-solid fa-triangle-exclamation"></i> Failed to load leaderboard.</p></div>';
            }
        }

        // ==========================================
        // INVITE PAGE (Restored Referral List)
        // ==========================================
        async function renderReferral(c) {
            let botUser = "myfabirr_robot"; 
            const link = `https://t.me/${botUser}/earn?startapp=${userId}`;
            
            let listHtml = '<p style="text-align:center; color:#888;">No invites yet. Start sharing!</p>';
            if(currentUser.referredUsers && currentUser.referredUsers.length > 0) {
                const reqs = currentUser.referredUsers.map(id => fetch(`/api/referrer/${id}`).then(r=>r.json()).catch(()=>({username:'User'})));
                const users = await Promise.all(reqs);
                listHtml = users.map(u => `
                    <div style="display:flex; align-items:center; padding:10px; border-bottom:1px solid rgba(0,0,0,0.05);">
                        <i class="fa-solid fa-user-check" style="color:var(--success-color); margin-right:10px;"></i>
                        <div style="font-weight:bold;">${u.username}</div>
                    </div>`).join('');
            }

            c.innerHTML = `
                <div class="card glass" style="text-align:center;">
                    <i class="fa-solid fa-users" style="font-size: 3rem; color: var(--accent-color); margin-bottom: 20px;"></i>
                    <h2>Invite & Earn</h2>
                    <p style="color:#888; font-size:0.9rem; margin-bottom:20px;">Earn Gems for every friend.</p>
                    <div style="background:rgba(0,0,0,0.05); padding:10px; border-radius:8px; font-family:monospace; font-size:0.8rem; word-break:break-all; margin-bottom:15px;">${link}</div>
                    <button class="btn btn-primary" onclick="navigator.clipboard.writeText('${link}'); showToast('Copied!')"><i class="fa-regular fa-copy"></i> Copy Link</button>
                </div>
                <div class="card glass">
                    <h3 style="margin-bottom:15px;"><i class="fa-solid fa-users" style="color:var(--accent-color);"></i> My Invites (${currentUser.referredUsers?.length||0})</h3>
                    ${listHtml}
                </div>
            `;
        }

        // ==========================================
        // UTILITIES (Watch Ads)
        // ==========================================
        function watchAd() {
            playSound('clickSound');
            if(typeof show_10024038 === 'function') {
                show_10024038().then(() => {
                    fetch('/api/watch-ad', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId}) });
                    currentUser.points += 50; currentUser.adsWatchedToday++; currentUser.totalAdsWatchedLifetime++;
                    updateUI(); navTo('tasks'); confetti(); showToast(`+50 Gems`);
                }).catch(() => { showToast("Ad loading failed or blocked."); });
            } else {
                showToast("Ad system not ready. Check ad-blocker.");
            }
        }

        // Aviator Engine Setup
        function initAviatorEngine() {
            const canvas = document.getElementById('avCanvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.offsetWidth; canvas.height = canvas.parentElement.offsetHeight;
            
            let state = 'betting', mult = 1.00, crashPoint = 2.00, betActive = false, betAmount = 0, startTime = 0;
            const btn = document.getElementById('avBtn'), multDiv = document.getElementById('avMult'), statusDiv = document.getElementById('avStatus');

            function draw(timestamp) {
                if(!document.getElementById('avCanvas')) { cancelAnimationFrame(window.aviatorRAF); return; } // Stop if tab changed
                ctx.clearRect(0,0,canvas.width, canvas.height);
                ctx.fillStyle = '#0B0B2A'; ctx.fillRect(0,0,canvas.width, canvas.height);

                if(state === 'flying') {
                    const elapsed = (timestamp - startTime)/1000;
                    mult = Math.pow(Math.E, 0.15 * elapsed);
                    if(mult >= crashPoint) {
                        mult = crashPoint; state = 'crashed';
                        statusDiv.style.opacity = '1'; multDiv.style.color = '#EF4444';
                        if(betActive) { betActive = false; btn.innerText = "BET"; btn.style.background = "#10B981"; }
                        setTimeout(() => { state = 'betting'; mult=1.0; multDiv.innerText="1.00x"; statusDiv.style.opacity='0'; multDiv.style.color='white'; }, 2000);
                    }
                    multDiv.innerText = mult.toFixed(2) + "x";

                    const prog = Math.min(1, (mult-1)/2);
                    const cx = 50 + (canvas.width*0.7 - 50)*prog;
                    const cy = (canvas.height-30) - ((canvas.height-30) - canvas.height*0.3)*prog;

                    ctx.beginPath(); ctx.moveTo(50, canvas.height-30); ctx.quadraticCurveTo(cx*0.5, canvas.height-30, cx, cy);
                    ctx.strokeStyle = '#EF4444'; ctx.lineWidth = 4; ctx.stroke();
                }
                window.aviatorRAF = requestAnimationFrame(draw);
            }
            if(window.aviatorRAF) cancelAnimationFrame(window.aviatorRAF);
            window.aviatorRAF = requestAnimationFrame(draw);

            window.avAction = async () => {
                if(state === 'betting') {
                    if(!betActive) {
                        betAmount = parseInt(document.getElementById('avBet').value);
                        if(currentUser.points < betAmount) return showToast("Not enough gems");
                        currentUser.points -= betAmount; updateUI(); betActive = true;
                        btn.innerText = "STARTING..."; btn.style.background = "#FFB347"; btn.disabled = true;
                        
                        try {
                            const res = await fetch('/api/aviator/start', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId, betAmount}) });
                            const d = await res.json(); crashPoint = d.crashPoint;
                            state = 'flying'; startTime = performance.now(); btn.disabled = false; btn.innerText = "CASH OUT";
                        } catch(e) { state = 'flying'; startTime = performance.now(); crashPoint = 1.05; btn.disabled = false; btn.innerText = "CASH OUT"; }
                    }
                } else if(state === 'flying' && betActive) {
                    betActive = false;
                    const win = Math.floor(betAmount * mult);
                    currentUser.points += win; updateUI();
                    btn.innerText = `WON ${win}!`; btn.style.background = "#10B981";
                    confetti(); setTimeout(() => { if(state!=='betting') {btn.innerText="BET"; btn.style.background="#10B981";} }, 2000);
                }
            };
        }
    </script>
