<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Besh Besh Web3</title>
    
    <!-- FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- EXTERNAL CSS -->
    <link rel="stylesheet" href="/index.css">

    <!-- SDKs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <!-- OFFLINE ALERT -->
    <div id="offline-alert" class="toast error" style="display: none; top: 10px; bottom: auto;"><i class="fa-solid fa-wifi"></i> No Internet</div>

    <div class="app-container" id="app-container">
        <!-- GLOBAL THEME TOGGLE -->
        <div class="theme-switch-wrapper" style="position: fixed; top: 15px; right: 15px; z-index: 1000; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 20px; color: white;">
            <i class="fa-solid fa-moon" id="themeToggleIcon" onclick="toggleTheme()" style="cursor: pointer; font-size: 1.2rem;"></i>
        </div>

        <!-- CINEMATIC LOADING SCREEN -->
        <div id="loading-overlay">
            <i class="fa-brands fa-ethereum loading-logo" style="font-size: 4rem; color: #B026FF; animation: pulse 1.5s infinite;"></i>
            <h2 style="color: white; margin-top: 20px; font-weight: 800;">BESH BESH</h2>
            <div style="width: 200px; height: 4px; background: #333; margin-top: 20px; border-radius: 2px; overflow: hidden;">
                <div id="loading-bar" style="width: 0%; height: 100%; background: #B026FF; transition: width 0.2s;"></div>
            </div>
        </div>

        <!-- HEADERS -->
        <div id="homeHeader" class="home-header">
            <h1 style="font-size: 2.5rem; font-weight: 800;">Besh Besh</h1>
            <p style="opacity: 0.8;">Web3 Earning Ecosystem</p>
        </div>

        <div id="pageHeader" class="page-header glass" style="position: sticky; top: 0; z-index: 10; display: none;">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="profile-pic" id="pageHeaderAvatar" style="width:40px; height:40px; position:static; transform:none;"></div>
                <div style="font-weight:700;" id="pageHeaderName">User</div>
            </div>
            <div style="font-weight:800; color:var(--accent-color);"><i class="fa-solid fa-gem"></i> <span id="pageHeaderBalance">0</span></div>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div id="mainContent" class="content-section" style="min-height: 60vh;"></div>

        <!-- FLOATING ACTION BUTTON -->
        <div class="fab" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"><i class="fa-solid fa-arrow-up"></i></div>

        <!-- BOTTOM NAV -->
        <div class="bottom-nav glass">
            <a href="javascript:void(0)" class="nav-item active" onclick="navTo('home')"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="javascript:void(0)" class="nav-item" onclick="navTo('games')"><i class="fa-solid fa-gamepad"></i><span>Games</span></a>
            <a href="javascript:void(0)" class="nav-item" onclick="navTo('exchange')"><i class="fa-solid fa-money-bill-transfer"></i><span>Exchange</span></a>
            <a href="javascript:void(0)" class="nav-item" onclick="navTo('leaderboard')"><i class="fa-solid fa-trophy"></i><span>Top</span></a>
            <a href="javascript:void(0)" class="nav-item" onclick="navTo('referral')"><i class="fa-solid fa-users"></i><span>Invite</span></a>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let currentUser = null;
        let userId = null;
        const tg = window.Telegram.WebApp;

        document.addEventListener('DOMContentLoaded', async () => {
            tg.expand();
            if(localStorage.getItem('theme') === 'light') document.body.classList.add('day-mode');
            
            // Simulate Load
            let w = 0;
            const int = setInterval(() => {
                w += 20; document.getElementById('loading-bar').style.width = w + '%';
                if(w >= 100) clearInterval(int);
            }, 100);

            const tgUser = tg.initDataUnsafe?.user;
            userId = tgUser?.id?.toString() || new URLSearchParams(window.location.search).get('userId') || 'test_user';
            const username = tgUser?.username || 'Player';

            try {
                const res = await fetch(`/api/user/${userId}`);
                if(res.ok) currentUser = await res.json();
                else currentUser = { username: username, points: 0, streak: 1 };
                
                setTimeout(() => {
                    document.getElementById('loading-overlay').style.opacity = '0';
                    setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 300);
                    navTo('home');
                }, 800);
            } catch(e) { alert("Network error"); }
        });

        function toggleTheme() {
            const isDay = document.body.classList.toggle('day-mode');
            localStorage.setItem('theme', isDay ? 'light' : 'dark');
            document.getElementById('themeToggleIcon').className = isDay ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            if(window.Telegram.WebApp.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerHTML = `<i class="fa-solid fa-bell"></i> ${msg}`;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function navTo(page) {
            if(window.Telegram.WebApp.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeBtn = document.querySelector(`.nav-item[onclick="navTo('${page}')"]`);
            if(activeBtn) activeBtn.classList.add('active');

            const isHome = page === 'home';
            document.getElementById('homeHeader').style.display = isHome ? 'flex' : 'none';
            document.getElementById('pageHeader').style.display = isHome ? 'none' : 'flex';
            
            if(!isHome && currentUser) {
                document.getElementById('pageHeaderName').innerText = currentUser.username;
                document.getElementById('pageHeaderBalance').innerText = currentUser.points;
                document.getElementById('pageHeaderAvatar').style.backgroundImage = `url('/api/avatar/${userId}')`;
            }

            const content = document.getElementById('mainContent');
            if(page === 'home') renderHome(content);
            if(page === 'games') renderGameHub(content);
            if(page === 'exchange') renderExchange(content);
            if(page === 'leaderboard') renderLeaderboard(content);
            if(page === 'referral') renderReferral(content);
            window.scrollTo(0,0);
        }

        // ==========================================
        // HOME RENDERER
        // ==========================================
        function renderHome(c) {
            let streakHtml = '';
            for(let i=1; i<=7; i++) {
                let active = i <= (currentUser.streak||1) ? 'background:var(--accent-color);color:white;' : 'background:rgba(0,0,0,0.1);';
                streakHtml += `<div style="width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:0.8rem; ${active}">${i}</div>`;
            }

            c.innerHTML = `
                <div class="card glass" style="margin-top:-40px; text-align:center; position:relative; z-index:2;">
                    <div class="profile-pic" style="background-image:url('/api/avatar/${userId}'); margin: 0 auto 10px;"></div>
                    <h2 style="font-weight:800;">${currentUser.username}</h2>
                    <div style="display:inline-flex; align-items:center; gap:8px; background:rgba(176,38,255,0.1); color:var(--accent-color); padding:8px 20px; border-radius:30px; font-weight:bold; font-size:1.2rem; margin-top:10px;">
                        <i class="fa-solid fa-gem"></i> ${currentUser.points}
                    </div>
                    
                    <div style="margin-top:25px; text-align:left;">
                        <p style="font-size:0.8rem; font-weight:bold; color:#888; margin-bottom:10px;"><i class="fa-solid fa-fire"></i> Daily Login Streak</p>
                        <div style="display:flex; justify-content:space-between;">${streakHtml}</div>
                    </div>
                </div>

                <div class="card glass" style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <h3 style="color:var(--gold-color); margin:0;"><i class="fa-solid fa-pickaxe"></i> Idle Miner</h3>
                        <p style="font-size:0.8rem; color:#888;">Mining offline...</p>
                    </div>
                    <div style="font-size:1.2rem; font-weight:bold; color:var(--success-color);">+ <span id="idleGems">0.00</span></div>
                </div>
            `;
            setInterval(() => {
                const el = document.getElementById('idleGems');
                if(el) el.innerText = (parseFloat(el.innerText) + 0.01).toFixed(2);
            }, 60000);
        }

        // ==========================================
        // EXCHANGE RENDERER
        // ==========================================
        function renderExchange(c) {
            c.innerHTML = `
                <div class="card glass" style="text-align:center;">
                    <i class="fa-solid fa-money-bill-transfer" style="font-size:3rem; color:var(--success-color); margin-bottom:15px;"></i>
                    <h2>Exchange Bureau</h2>
                    <p style="font-size:0.9rem; color:#888; margin-bottom:20px;">Convert Gems to Real Money<br>Rate: 10 Gems = 1 Unit</p>
                    
                    <div style="background:rgba(0,0,0,0.05); padding:20px; border-radius:15px;">
                        <input type="number" id="exAmount" placeholder="Amount of Gems" style="width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; font-weight:bold; font-size:1.1rem; text-align:center; margin-bottom:15px;">
                        <button class="btn btn-primary" onclick="doExchange()"><i class="fa-solid fa-right-left"></i> Convert Now</button>
                    </div>
                    <p style="margin-top:15px; font-weight:bold;">Real Balance: <span style="color:var(--success-color);">${currentUser.realBalance||0} Units</span></p>
                </div>
            `;
        }

        async function doExchange() {
            const amt = parseInt(document.getElementById('exAmount').value);
            if(!amt || amt <= 0) return showToast("Invalid amount");
            const res = await fetch('/api/exchange', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId, gemsToExchange: amt}) });
            const data = await res.json();
            if(data.success) {
                currentUser.points -= amt;
                currentUser.realBalance = (currentUser.realBalance||0) + data.realMoney;
                confetti(); showToast("Exchange Successful!"); navTo('exchange');
            } else showToast(data.error);
        }

        // ==========================================
        // LEADERBOARD RENDERER (WITH REAL AVATARS)
        // ==========================================
        async function renderLeaderboard(c) {
            c.innerHTML = `<div style="text-align:center; padding:50px;"><i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;"></i></div>`;
            const res = await fetch(`/api/leaderboard/${userId}`);
            const data = await res.json();
            const list = data.byPoints;

            let html = `<div class="card glass"><div style="display:flex; justify-content:center; align-items:flex-end; gap:10px; margin-bottom:30px; margin-top:20px;">`;
            
            // PODIUM
            if(list.length >= 3) {
                const drawPodium = (u, rank, height, color) => `
                    <div style="width:30%; text-align:center;">
                        ${rank===1 ? '<i class="fa-solid fa-crown" style="color:#FFD700; font-size:1.5rem; margin-bottom:5px; display:block;"></i>' : ''}
                        <img src="/api/avatar/${u.username}" onerror="this.src='https://ui-avatars.com/api/?name=${u.username}'" style="width:60px; height:60px; border-radius:50%; border:3px solid ${color}; object-fit:cover; margin-bottom:10px;">
                        <div style="font-size:0.8rem; font-weight:bold; overflow:hidden; text-overflow:ellipsis;">${u.username}</div>
                        <div style="font-weight:900; color:${color};">${u.points}</div>
                        <div style="height:${height}px; background:${color}; border-radius:10px 10px 0 0; margin-top:10px; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold;">${rank}</div>
                    </div>`;
                html += drawPodium(list[1], 2, 40, '#C0C0C0');
                html += drawPodium(list[0], 1, 60, '#FFD700');
                html += drawPodium(list[2], 3, 30, '#CD7F32');
            }
            html += `</div>`;

            // LIST
            list.slice(3, 20).forEach((u, i) => {
                html += `<div style="display:flex; align-items:center; padding:12px; border-bottom:1px solid rgba(0,0,0,0.05);">
                    <div style="width:30px; font-weight:bold; color:#888;">${i+4}</div>
                    <img src="/api/avatar/${u.username}" onerror="this.src='https://ui-avatars.com/api/?name=${u.username}'" style="width:40px; height:40px; border-radius:50%; margin-right:15px; object-fit:cover;">
                    <div style="flex:1; font-weight:bold;">${u.username}</div>
                    <div style="color:var(--accent-color); font-weight:900;">${u.points} <i class="fa-solid fa-gem"></i></div>
                </div>`;
            });
            c.innerHTML = html + `</div>`;
        }

        function renderReferral(c) {
            c.innerHTML = `
                <div class="card glass" style="text-align:center;">
                    <i class="fa-solid fa-users" style="font-size:3rem; color:var(--accent-color); margin-bottom:15px;"></i>
                    <h2>Invite Friends</h2>
                    <p style="color:#888; font-size:0.9rem; margin-bottom:20px;">Earn Gems for every valid invite!</p>
                    <div id="qrcode" style="display:flex; justify-content:center; margin-bottom:20px;"></div>
                    <div style="background:rgba(0,0,0,0.05); padding:10px; border-radius:8px; font-family:monospace; font-size:0.8rem; word-break:break-all; margin-bottom:15px;">https://t.me/mybot?startapp=${userId}</div>
                    <button class="btn btn-primary"><i class="fa-solid fa-share"></i> Share Link</button>
                </div>
            `;
            setTimeout(() => new QRCode(document.getElementById("qrcode"), { text: `https://t.me/mybot?startapp=${userId}`, width: 120, height: 120 }), 100);
        }

        // ==========================================
        // GAME HUB & ENGINES
        // ==========================================
        function renderGameHub(c) {
            const card = (id, icon, title, desc, color) => `
                <div class="glass" style="padding:20px; border-radius:15px; text-align:center; cursor:pointer;" onclick="openGame('${id}')">
                    <i class="${icon}" style="font-size:2.5rem; color:${color}; margin-bottom:10px;"></i>
                    <h3 style="font-size:1.1rem; margin-bottom:5px;">${title}</h3>
                    <p style="font-size:0.8rem; color:#888;">${desc}</p>
                </div>`;

            c.innerHTML = `
                <div id="gameList" style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                    ${card('spin', 'fa-solid fa-dharmachakra', 'Pro Spin', 'Win Massive Gems', '#FFB347')}
                    ${card('combo', 'fa-solid fa-puzzle-piece', 'Daily Combo', 'Ethiopian Puzzle', '#10B981')}
                    ${card('aviator', 'fa-solid fa-plane-up', 'Aviator', 'Crash & Win', '#EF4444')}
                    ${card('ox', 'fa-solid fa-xmarks-lines', 'Multi OX', 'Tic-Tac-Toe Bets', '#3B82F6')}
                </div>
                <div id="gameStage" style="display:none; margin-top:-20px;"></div>
            `;
        }

        function openGame(game) {
            document.getElementById('gameList').style.display = 'none';
            const stage = document.getElementById('gameStage');
            stage.style.display = 'block';

            if(game === 'aviator') renderAviator(stage);
            else if(game === 'ox') renderOX(stage);
            else if(game === 'combo') renderCombo(stage);
            else if(game === 'spin') renderSpin(stage);
        }

        function closeGame() { navTo('games'); }

        // --- 1. AVIATOR ENGINE (CANVAS + RIGGED LOGIC) ---
        let aviatorRAF;
        function renderAviator(c) {
            c.innerHTML = `
                <div class="card glass" style="padding:10px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <h2 style="color:#EF4444; margin:0;"><i class="fa-solid fa-plane-up"></i> Aviator</h2>
                        <button onclick="closeGame()" style="background:transparent; border:none; font-size:1.2rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    
                    <div style="position:relative; width:100%; height:300px; background:#0B0B2A; border-radius:12px; overflow:hidden; border:2px solid #EF4444;">
                        <canvas id="avCanvas" style="width:100%; height:100%;"></canvas>
                        <div id="avMult" style="position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); font-size:3.5rem; font-weight:900; color:white; font-family:monospace; text-shadow:0 0 10px black;">1.00x</div>
                        <div id="avStatus" style="position:absolute; top:20%; left:50%; transform:translateX(-50%); color:#EF4444; font-weight:bold; font-size:1.5rem; opacity:0;">FLEW AWAY!</div>
                        
                        <!-- 5 SECOND COUNTDOWN UI -->
                        <div id="avTimerOverlay" style="position:absolute; inset:0; background:rgba(0,0,0,0.7); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10;">
                            <div style="color:white; font-size:1.2rem; font-weight:bold; margin-bottom:10px;">WAITING FOR NEXT ROUND</div>
                            <div style="width:80%; height:8px; background:#333; border-radius:4px; overflow:hidden;">
                                <div id="avTimerBar" style="width:100%; height:100%; background:#EF4444; transition:width 0.1s linear;"></div>
                            </div>
                            <div id="avTimerText" style="color:#EF4444; font-size:2rem; font-weight:900; margin-top:10px;">5.0</div>
                        </div>
                    </div>

                    <div style="display:flex; gap:10px; margin-top:15px;">
                        <input type="number" id="avBet" value="10" style="flex:1; padding:12px; border-radius:8px; border:none; font-weight:bold; text-align:center;">
                        <button id="avBtn" class="btn btn-primary" style="flex:1; background:#10B981;" onclick="avAction()">BET</button>
                    </div>
                </div>
            `;
            initAviatorEngine();
        }

        function initAviatorEngine() {
            const canvas = document.getElementById('avCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            
            let state = 'betting'; // betting, flying, crashed
            let mult = 1.00;
            let crashPoint = 1.00;
            let betActive = false;
            let betAmount = 0;
            let startTime = 0;
            let timerLeft = 5.0;

            const btn = document.getElementById('avBtn');
            const multDiv = document.getElementById('avMult');
            const statusDiv = document.getElementById('avStatus');
            const timerOverlay = document.getElementById('avTimerOverlay');
            const timerBar = document.getElementById('avTimerBar');
            const timerText = document.getElementById('avTimerText');

            // SVG Biplane Path
            const planePath = new Path2D("M30,14 l15,-8 h10 l-15,8 h30 c2,0 5,2 5,5 c0,3 -3,5 -5,5 h-30 l15,8 h-10 l-15,-8 h-15 c-2,0 -5,-2 -5,-5 c0,-3 3,-5 5,-5 z");

            function draw(timestamp) {
                ctx.clearRect(0,0,canvas.width, canvas.height);
                
                // Draw Grid
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.beginPath();
                for(let i=0; i<canvas.width; i+=40) { ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); }
                for(let i=0; i<canvas.height; i+=40) { ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); }
                ctx.stroke();

                if(state === 'betting') {
                    timerLeft -= 0.016; // Approx 60fps
                    if(timerLeft <= 0) {
                        state = 'flying';
                        timerOverlay.style.display = 'none';
                        statusDiv.style.opacity = '0';
                        multDiv.style.color = 'white';
                        startTime = timestamp;
                        
                        // Fake Rigged RNG (85% crash before 2x)
                        const r = window.crypto.getRandomValues(new Uint32Array(1))[0] / 4294967295;
                        crashPoint = r < 0.85 ? (1.01 + r) : (2.00 + r*5);
                        
                        if(betActive) { btn.innerText = "CASH OUT"; btn.style.background = "#FFB347"; }
                    } else {
                        timerBar.style.width = `${(timerLeft/5)*100}%`;
                        timerText.innerText = timerLeft.toFixed(1);
                    }
                }

                if(state === 'flying' || state === 'crashed') {
                    if(state === 'flying') {
                        const elapsed = (timestamp - startTime)/1000;
                        mult = Math.pow(Math.E, 0.15 * elapsed);
                        if(mult >= crashPoint) {
                            mult = crashPoint;
                            state = 'crashed';
                            statusDiv.style.opacity = '1';
                            multDiv.style.color = '#EF4444';
                            if(betActive) { betActive = false; btn.innerText = "BET"; btn.style.background = "#10B981"; }
                            setTimeout(() => { state = 'betting'; timerLeft = 5.0; timerOverlay.style.display = 'flex'; mult=1.0; multDiv.innerText="1.00x"; }, 2000);
                        }
                    }

                    multDiv.innerText = mult.toFixed(2) + "x";

                    // Draw Plane & Curve
                    const prog = Math.min(1, (mult-1)/2);
                    const cx = 50 + (canvas.width*0.7 - 50)*prog;
                    const cy = (canvas.height-30) - ((canvas.height-30) - canvas.height*0.3)*prog + (state==='flying'?Math.sin(timestamp*0.01)*5:0);

                    if(state !== 'crashed') {
                        ctx.beginPath();
                        ctx.moveTo(50, canvas.height-30);
                        ctx.quadraticCurveTo(cx*0.5, canvas.height-30, cx, cy);
                        ctx.strokeStyle = '#EF4444'; ctx.lineWidth = 4; ctx.stroke();
                        
                        ctx.lineTo(cx, canvas.height); ctx.lineTo(50, canvas.height);
                        ctx.fillStyle = 'rgba(239,68,68,0.3)'; ctx.fill();
                    }

                    ctx.save();
                    ctx.translate(state==='crashed'?canvas.width+100:cx, state==='crashed'?-100:cy);
                    ctx.rotate(state==='crashed' ? -Math.PI/4 : (prog<1 ? -Math.PI/8 : 0));
                    ctx.fillStyle = '#EF4444';
                    ctx.fill(planePath);
                    ctx.restore();
                }
                aviatorRAF = requestAnimationFrame(draw);
            }
            aviatorRAF = requestAnimationFrame(draw);

            window.avAction = () => {
                if(state === 'betting') {
                    if(!betActive) {
                        betAmount = parseInt(document.getElementById('avBet').value);
                        if(currentUser.points < betAmount) return showToast("Not enough gems");
                        currentUser.points -= betAmount;
                        betActive = true;
                        btn.innerText = "CANCEL"; btn.style.background = "#EF4444";
                        document.getElementById('pageHeaderBalance').innerText = currentUser.points;
                    } else {
                        betActive = false;
                        currentUser.points += betAmount;
                        btn.innerText = "BET"; btn.style.background = "#10B981";
                        document.getElementById('pageHeaderBalance').innerText = currentUser.points;
                    }
                } else if(state === 'flying' && betActive) {
                    betActive = false;
                    const win = Math.floor(betAmount * mult);
                    currentUser.points += win;
                    document.getElementById('pageHeaderBalance').innerText = currentUser.points;
                    btn.innerText = `WON ${win}!`; btn.style.background = "#10B981";
                    confetti();
                    setTimeout(() => { if(state!=='betting') {btn.innerText = "BET"; btn.style.background = "#10B981";} }, 2000);
                }
            };
        }

        // --- 2. MULTI-PLAYER OX (MINIMAX BOT) ---
        let oxBoard = ['','','','','','','','',''];
        function renderOX(c) {
            c.innerHTML = `
                <div class="card glass" style="text-align:center;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                        <h2 style="color:#3B82F6; margin:0;"><i class="fa-solid fa-xmarks-lines"></i> Multi OX</h2>
                        <button onclick="closeGame()" style="background:transparent; border:none; font-size:1.2rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <select id="oxBet" style="padding:10px; border-radius:8px; width:100%; margin-bottom:15px; font-weight:bold;">
                        <option value="15">Bet 15 Gems</option>
                        <option value="50">Bet 50 Gems</option>
                        <option value="100">Bet 100 Gems</option>
                    </select>
                    <button class="btn btn-primary" onclick="startOXBot()" style="background:#1E293B;"><i class="fa-solid fa-robot"></i> Play Unbeatable Bot</button>
                    
                    <div id="oxGrid" style="display:none; grid-template-columns:repeat(3,1fr); gap:8px; width:250px; margin:20px auto;">
                        ${[0,1,2,3,4,5,6,7,8].map(i => `<div class="glass" style="height:80px; display:flex; align-items:center; justify-content:center; font-size:2.5rem; font-weight:bold; cursor:pointer;" onclick="makeOXMove(${i})" id="ox${i}"></div>`).join('')}
                    </div>
                    <h3 id="oxStatus" style="margin-top:15px;"></h3>
                </div>
            `;
        }

        let oxActive = false;
        let oxAmt = 0;
        function startOXBot() {
            oxAmt = parseInt(document.getElementById('oxBet').value);
            if(currentUser.points < oxAmt) return showToast("Not enough gems");
            currentUser.points -= oxAmt;
            document.getElementById('pageHeaderBalance').innerText = currentUser.points;
            
            oxBoard = ['','','','','','','','',''];
            for(let i=0; i<9; i++) document.getElementById(`ox${i}`).innerText = '';
            document.getElementById('oxGrid').style.display = 'grid';
            document.getElementById('oxStatus').innerText = "Your Turn (X)";
            oxActive = true;
        }

        function checkWin(b) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for(let i=0; i<w.length; i++) {
                const [x,y,z] = w[i];
                if(b[x] && b[x] === b[y] && b[x] === b[z]) return b[x];
            }
            if(!b.includes('')) return 'Tie';
            return null;
        }

        function minimax(b, depth, isMax) {
            const res = checkWin(b);
            if(res === 'O') return 10 - depth;
            if(res === 'X') return depth - 10;
            if(res === 'Tie') return 0;

            if(isMax) {
                let best = -Infinity;
                for(let i=0; i<9; i++) { if(b[i]==='') { b[i]='O'; best = Math.max(best, minimax(b, depth+1, false)); b[i]=''; } }
                return best;
            } else {
                let best = Infinity;
                for(let i=0; i<9; i++) { if(b[i]==='') { b[i]='X'; best = Math.min(best, minimax(b, depth+1, true)); b[i]=''; } }
                return best;
            }
        }

        function makeOXMove(i) {
            if(!oxActive || oxBoard[i] !== '') return;
            oxBoard[i] = 'X';
            document.getElementById(`ox${i}`).innerText = 'X';
            document.getElementById(`ox${i}`).style.color = '#10B981';
            
            let res = checkWin(oxBoard);
            if(res) return endOX(res);

            document.getElementById('oxStatus').innerText = "Bot is thinking...";
            
            setTimeout(() => {
                let bestScore = -Infinity; let move;
                for(let j=0; j<9; j++) {
                    if(oxBoard[j]==='') {
                        oxBoard[j]='O'; let score = minimax(oxBoard, 0, false); oxBoard[j]='';
                        if(score > bestScore) { bestScore = score; move = j; }
                    }
                }
                oxBoard[move] = 'O';
                document.getElementById(`ox${move}`).innerText = 'O';
                document.getElementById(`ox${move}`).style.color = '#EF4444';
                
                res = checkWin(oxBoard);
                if(res) endOX(res);
                else document.getElementById('oxStatus').innerText = "Your Turn (X)";
            }, 500);
        }

        function endOX(res) {
            oxActive = false;
            const stat = document.getElementById('oxStatus');
            if(res === 'X') { stat.innerText = `You won ${oxAmt*2}!`; stat.style.color = '#10B981'; currentUser.points += oxAmt*2; confetti(); }
            else if(res === 'Tie') { stat.innerText = "Draw! Bet returned."; currentUser.points += oxAmt; }
            else { stat.innerText = `Bot Won! You lost ${oxAmt}`; stat.style.color = '#EF4444'; }
            document.getElementById('pageHeaderBalance').innerText = currentUser.points;
        }

        // --- 3. ETHIOPIAN DAILY COMBO (SVG DRAG & DROP) ---
        function renderCombo(c) {
            // Using basic SVG shapes to represent items (No Emojis)
            const svgs = [
                `<svg viewBox="0 0 24 24" fill="#B026FF"><path d="M12 2L2 22h20L12 2z"/></svg>`,
                `<svg viewBox="0 0 24 24" fill="#FFB347"><circle cx="12" cy="12" r="10"/></svg>`,
                `<svg viewBox="0 0 24 24" fill="#10B981"><rect x="4" y="4" width="16" height="16"/></svg>`
            ];
            
            c.innerHTML = `
                <div class="card glass" style="text-align:center;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                        <h2 style="color:#10B981; margin:0;"><i class="fa-solid fa-puzzle-piece"></i> Daily Combo</h2>
                        <button onclick="closeGame()" style="background:transparent; border:none; font-size:1.2rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <p style="font-size:0.9rem; color:#888;">Drag shapes to the correct order.</p>
                    
                    <div style="display:flex; justify-content:center; gap:10px; margin:20px 0;" id="comboSource">
                        <div draggable="true" ondragstart="drag(event)" id="c1" style="width:60px; height:60px; padding:10px; background:rgba(0,0,0,0.1); border-radius:10px;">${svgs[0]}</div>
                        <div draggable="true" ondragstart="drag(event)" id="c2" style="width:60px; height:60px; padding:10px; background:rgba(0,0,0,0.1); border-radius:10px;">${svgs[1]}</div>
                        <div draggable="true" ondragstart="drag(event)" id="c3" style="width:60px; height:60px; padding:10px; background:rgba(0,0,0,0.1); border-radius:10px;">${svgs[2]}</div>
                    </div>

                    <div style="display:flex; justify-content:center; gap:10px; margin-bottom:20px;">
                        <div id="slot1" ondrop="drop(event)" ondragover="allowDrop(event)" style="width:70px; height:70px; border:2px dashed #B026FF; border-radius:10px; display:flex; align-items:center; justify-content:center;"></div>
                        <div id="slot2" ondrop="drop(event)" ondragover="allowDrop(event)" style="width:70px; height:70px; border:2px dashed #B026FF; border-radius:10px; display:flex; align-items:center; justify-content:center;"></div>
                        <div id="slot3" ondrop="drop(event)" ondragover="allowDrop(event)" style="width:70px; height:70px; border:2px dashed #B026FF; border-radius:10px; display:flex; align-items:center; justify-content:center;"></div>
                    </div>
                    
                    <button class="btn btn-primary" onclick="checkCombo()">Check Combo</button>
                    <div id="comboRes" style="margin-top:15px; font-weight:bold;"></div>
                </div>
            `;
        }

        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            if(ev.target.id.startsWith("slot") && ev.target.childElementCount === 0) {
                ev.target.appendChild(document.getElementById(data));
            }
        }

        function checkCombo() {
            const s1 = document.getElementById('slot1').firstChild?.id;
            const s2 = document.getElementById('slot2').firstChild?.id;
            const s3 = document.getElementById('slot3').firstChild?.id;
            if(!s1 || !s2 || !s3) return showToast("Fill all slots!");

            // Mock rigged check (e.g. c2, c3, c1 is correct)
            if(s1==='c2' && s2==='c3' && s3==='c1') {
                document.getElementById('comboRes').innerHTML = '<span style="color:#10B981;">Correct! +500 Gems</span>';
                currentUser.points += 500; document.getElementById('pageHeaderBalance').innerText = currentUser.points;
                confetti();
            } else {
                document.getElementById('comboRes').innerHTML = '<span style="color:#EF4444;">Incorrect order!</span>';
                if(s1!=='c2') document.getElementById('slot1').style.borderColor = '#EF4444';
                if(s2!=='c3') document.getElementById('slot2').style.borderColor = '#EF4444';
                if(s3!=='c1') document.getElementById('slot3').style.borderColor = '#EF4444';
            }
        }
    </script>
</body>
</html>
