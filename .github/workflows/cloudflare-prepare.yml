name: Prepare Cloudflare Worker API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Generate Cloudflare API adapter
        run: node cloudflare-build.cjs

      - name: Commit generated adapter
        run: |
          if git diff --quiet -- api/index-cloudflare.js; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/index-cloudflare.js
          git commit -m "Generate Cloudflare API adapter"
          git push
