name: MYFA campaign and ad hardening
on:
  push:
    paths:
      - '.github/workflows/myfa-campaign-ad-hardening.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply backend hardening
        run: python3 scripts/harden_campaign_ads.py
      - name: Commit backend hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/index.js api/ads.js scripts/harden_campaign_ads.py
          git rm .github/workflows/myfa-campaign-ad-hardening.yml
          git commit -m 'fix: harden campaign dates and real ad rewards'
          git push
