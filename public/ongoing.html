<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020711"><meta name="color-scheme" content="dark"><title>MYFA Ongoing</title>
<link rel="stylesheet" href="/assets/ongoing/ongoing.css?v=20260907b">
</head><body>
<div id="ongoing-app" aria-label="MYFA Ongoing onboarding">
<main class="stage" id="onboarding-stage">
<section class="slide active" data-page="1" aria-hidden="false"><div class="art">
<img class="artwork" src="/assets/ongoing/page1.png" alt="MYFA Ongoing page 1">
<div class="fx sky-sheen"></div><div class="fx flower-light fl1"></div><div class="fx flower-light fl2"></div><div class="fx flower-light fl3"></div>
<div class="fx icon-glow ig1"></div><div class="fx icon-glow ig2"></div><div class="fx icon-glow ig3"></div><div class="fx icon-glow ig4"></div>
<div class="fx text-sheen ts1"></div><div class="fx text-sheen ts2"></div><div class="fx bottom-sheen"></div><div class="fx particle-field"></div>
<button class="hotspot skip" data-skip type="button" aria-label="Skip onboarding"></button><button class="hotspot next" data-next type="button" aria-label="Continue"></button>
</div></section>
<section class="slide" data-page="2" aria-hidden="true"><div class="art">
<img class="artwork" src="/assets/ongoing/page2.png" alt="MYFA Ongoing page 2">
<div class="fx sky-sheen"></div><div class="fx flower-light fl1"></div><div class="fx flower-light fl2"></div><div class="fx flower-light fl3"></div>
<div class="fx card-glow cg1"></div><div class="fx card-glow cg2"></div><div class="fx card-glow cg3"></div><div class="fx card-glow cg4"></div><div class="fx card-glow cg5"></div><div class="fx card-glow cg6"></div>
<div class="fx text-sheen ts1"></div><div class="fx text-sheen ts2"></div><div class="fx bottom-sheen"></div><div class="fx particle-field"></div>
<button class="hotspot skip" data-skip type="button" aria-label="Skip onboarding"></button><button class="hotspot next p2" data-next type="button" aria-label="Continue to page 3"></button>
</div></section>
<section class="slide" data-page="3" aria-hidden="true"><div class="art">
<img class="artwork" src="/assets/ongoing/page3.png" alt="MYFA Ongoing page 3">
<div class="fx sky-sheen"></div><div class="fx flower-light fl1"></div><div class="fx flower-light fl2"></div><div class="fx flower-light fl3"></div>
<div class="fx icon-glow ig1"></div><div class="fx icon-glow ig2"></div><div class="fx icon-glow ig3"></div><div class="fx icon-glow ig4"></div>
<div class="fx text-sheen ts1"></div><div class="fx text-sheen ts2"></div><div class="fx bottom-sheen"></div><div class="fx particle-field"></div>
<button class="hotspot skip" data-skip type="button" aria-label="Skip onboarding"></button><button class="hotspot finish" data-finish type="button" aria-label="Get started"></button>
</div></section>
</main></div>
<script src="/assets/ongoing/ongoing.js?v=20260907b" defer></script></body></html>
