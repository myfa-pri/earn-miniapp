<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Besh Besh</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- AD NETWORKS: ADSGRAM & MONETAG -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <!-- <script src="//monetag_script_url_here"></script> (Add Monetag URL here) -->
</head>
<body class="dark-mode">

    <div class="app-container" id="app-container">
        <!-- HEADER -->
        <div id="pageHeader" class="page-header glass" style="position: sticky; top: 0; z-index: 10; margin-bottom: 20px; display: none;">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="profile-pic" id="pageHeaderAvatar" style="width:40px; height:40px; position:static; transform:none; border:2px solid var(--accent-color);"></div>
                <div>
                    <div style="font-weight:700;" id="pageHeaderName">User</div>
                    <div class="badge badge-silver" id="pageHeaderStatus" style="font-size: 0.6rem; padding: 2px 6px; background: rgba(255,255,255,0.2); border-radius:10px;">Member</div>
                </div>
            </div>
            <div style="text-align: right;">
                <div style="font-weight:800; color:var(--accent-color); font-size: 1.1rem;"><i class="fa-solid fa-gem"></i> <span id="pageHeaderBalance">0</span></div>
            </div>
        </div>

        <!-- CONTENT AREA -->
        <div id="mainContent" class="content-section" style="min-height: 50vh;"></div>

        <!-- GAMES WRAPPER -->
        <div id="gameCanvasWrapper" style="display: none; padding: 20px;">
            <div style="position: sticky; top: 0; z-index: 100; background: var(--bg-color); padding: 10px 0; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <button class="btn btn-secondary" onclick="closeGame()"><i class="fa-solid fa-arrow-left"></i> Back to Hub</button>
            </div>
            <div id="activeGameCanvas"></div>
        </div>

        <div id="toast" class="toast"><i class="fa-solid fa-circle-info"></i> <span id="toast-msg"></span></div>
        <div id="leaderboardFooter" class="sticky-footer" style="display: none;">Your Rank: 99+</div>

        <!-- NAVIGATION -->
        <div class="bottom-nav glass">
            <a class="nav-item active" data-page="home" onclick="nav('home')"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a class="nav-item" data-page="games" onclick="nav('games')"><i class="fa-solid fa-gamepad"></i><span>Hub</span></a>
            <a class="nav-item" data-page="leaderboard" onclick="nav('leaderboard')"><i class="fa-solid fa-trophy"></i><span>Top</span></a>
            <a class="nav-item" data-page="withdraw" onclick="nav('withdraw')"><i class="fa-solid fa-wallet"></i><span>Pay</span></a>
        </div>
    </div>

    <!-- AUDIO ELEMENTS -->
    <audio id="audioCashout" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
    <audio id="audioCrash" src="https://assets.mixkit.co/active_storage/sfx/1466/1466-preview.mp3"></audio>
    <!-- We will use Web Audio API for the dynamic engine pitch -->

    <script>
        const API_BASE_URL = ''; 
        let currentUser = null, userId = null, startParam = null;
        
        // Aviator State
        let aviatorMultiplier = 1.00;
        let aviatorActive = false;
        let audioCtx = null, oscillator = null, gainNode = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const tg = window.Telegram.WebApp;
                tg.expand();

                const tgUser = tg.initDataUnsafe?.user;
                if (!tgUser || !tgUser.id) {
                    document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>Telegram Web App Error.</h2>";
                    return;
                }
                userId = tgUser.id.toString();
                startParam = tg.initDataUnsafe?.start_param || null;

                const realName = tgUser.first_name + (tgUser.last_name ? " " + tgUser.last_name : "");

                let res = await fetch(`${API_BASE_URL}/api/user/${userId}`);
                if(!res.ok) {
                    res = await fetch(`${API_BASE_URL}/api/ensure-user`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ userId, username: realName, refParam: startParam })
                    });
                    res = await fetch(`${API_BASE_URL}/api/user/${userId}`);
                }
                currentUser = await res.json();
                
                if(currentUser.isBanned) {
                    document.body.innerHTML = "<h2 style='text-align:center; color:red; margin-top:50px;'>ACCOUNT BANNED</h2>";
                    return;
                }
                nav('home');
            } catch (e) {
                console.error("Init Error", e);
            }
        });

        function updateUI() {
            document.getElementById('pageHeaderName').textContent = currentUser.username;
            document.getElementById('pageHeaderBalance').innerText = (currentUser.points || 0).toLocaleString();
        }

        function showToast(msg, type='info') {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.className = `toast show ${type}`;
            setTimeout(() => t.className = 'toast', 3000);
        }

        function nav(page) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');
            
            document.getElementById('gameCanvasWrapper').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('pageHeader').style.display = 'flex';
            document.getElementById('leaderboardFooter').style.display = 'none';

            const content = document.getElementById('mainContent');
            updateUI();

            if(page === 'home') renderHome(content);
            if(page === 'games') renderGames(content);
            if(page === 'leaderboard') renderLeaderboard(content);
            if(page === 'withdraw') renderWithdraw(content);
        }

        function renderHome(c) {
            c.innerHTML = `
                <div class="card glass" style="text-align:center; padding: 40px 20px;">
                    <div class="profile-pic" style="background-image:url('https://ui-avatars.com/api/?name=${currentUser.username}&background=B026FF&color=fff'); position:relative; top:0; transform:none; margin: 0 auto 15px;"></div>
                    <h2>${currentUser.username}</h2>
                    <div class="points-display" style="font-size: 2rem;"><i class="fa-solid fa-gem"></i> ${currentUser.points}</div>
                </div>
                
                <div class="card glass" style="margin-top: 20px; text-align: center;">
                    <h3 style="margin-bottom: 15px;"><i class="fa-solid fa-video" style="color: var(--accent-color);"></i> Watch Ads & Earn</h3>
                    <div style="display:flex; gap:10px; justify-content:center;">
                        <button class="btn btn-primary" onclick="showAdsgram()"><i class="fa-solid fa-play"></i> Adsgram Ad</button>
                        <button class="btn btn-secondary" onclick="showMonetag()"><i class="fa-solid fa-play"></i> Monetag Ad</button>
                    </div>
                </div>
            `;
        }

        // --- AD NETWORK LOGIC ---
        let adController = null;
        if(window.Adsgram) {
            // Replace blockId with your actual Adsgram block ID from the dashboard
            adController = window.Adsgram.init({ blockId: "YOUR_ADSGRAM_BLOCK_ID" });
        }

        function showAdsgram() {
            if(adController) {
                adController.show().then((result) => {
                    // Reward user for watching ad
                    rewardUserForAd('adsgram');
                }).catch((result) => {
                    showToast('Ad skipped or unavailable.', 'error');
                });
            } else {
                showToast('Adsgram is not initialized.', 'error');
            }
        }

        function showMonetag() {
            // Call Monetag show logic here based on their specific SDK
            // Example:
            // if(window.monetag) window.monetag.showAd().then(() => rewardUserForAd('monetag'));
            showToast('Monetag integration triggered!', 'success');
            // rewardUserForAd('monetag');
        }

        function rewardUserForAd(network) {
            // Give 50 gems as example
            currentUser.points += 50;
            updateUI();
            showToast(`Earned 50 Gems from ${network}!`, 'success');
            
            // Note: In production, send a POST to the backend to securely credit the gems
            fetch(`${API_BASE_URL}/api/user/${userId}/add-points`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ points: 50, reason: `Watched ${network} Ad` })
            }).catch(e => console.error(e));
        }

        function renderGames(c) {
            c.innerHTML = `
                <h2 style="margin-bottom: 15px;"><i class="fa-solid fa-gamepad" style="color:var(--accent-color);"></i> Game Hub</h2>
                <div class="game-hub-list">
                    <div class="glass game-list-card-horizontal" onclick="openGame('aviator')">
                        <div class="game-icon-box" style="background: rgba(239,68,68,0.2); color: var(--danger-color); text-shadow: 0 0 10px rgba(239,68,68,0.8);"><i class="fa-solid fa-plane-up fa-2x"></i></div>
                        <div class="game-details"><h3>Aviator</h3><p>Hold for high multipliers!</p></div>
                        <div class="play-btn-pill">Play</div>
                    </div>
                    <div class="glass game-list-card-horizontal" onclick="showToast('Multi OX coming soon!', 'info')">
                        <div class="game-icon-box" style="background: rgba(59,130,246,0.2); color: #3B82F6; text-shadow: 0 0 10px rgba(59,130,246,0.8);"><i class="fa-solid fa-xmarks-lines fa-2x"></i></div>
                        <div class="game-details"><h3>Multi OX</h3><p>Tic-Tac-Toe with real players.</p></div>
                        <div class="play-btn-pill">Play</div>
                    </div>
                    <div class="glass game-list-card-horizontal" onclick="showToast('Daily Combo coming soon!', 'info')">
                        <div class="game-icon-box" style="background: rgba(255,179,71,0.2); color: var(--gold-color); text-shadow: 0 0 10px rgba(255,179,71,0.8);"><i class="fa-solid fa-puzzle-piece fa-2x"></i></div>
                        <div class="game-details"><h3>Daily Combo</h3><p>Solve the puzzle for huge gems.</p></div>
                        <div class="play-btn-pill">Play</div>
                    </div>
                    <div class="glass game-list-card-horizontal" onclick="showToast('Pro Spin coming soon!', 'info')">
                        <div class="game-icon-box" style="background: rgba(176,38,255,0.2); color: var(--accent-color); text-shadow: 0 0 10px rgba(176,38,255,0.8);"><i class="fa-solid fa-dharmachakra fa-2x"></i></div>
                        <div class="game-details"><h3>Pro Spin</h3><p>Spin the wheel of fortune.</p></div>
                        <div class="play-btn-pill">Play</div>
                    </div>
                    <div class="glass game-list-card-horizontal" onclick="showToast('Scratch Card coming soon!', 'info')">
                        <div class="game-icon-box" style="background: rgba(16,185,129,0.2); color: var(--success-color); text-shadow: 0 0 10px rgba(16,185,129,0.8);"><i class="fa-solid fa-ticket fa-2x"></i></div>
                        <div class="game-details"><h3>Scratch Card</h3><p>Instant win scratch tickets.</p></div>
                        <div class="play-btn-pill">Play</div>
                    </div>
                </div>`;
        }

        function renderWithdraw(c) {
            const realBal = currentUser.realBalance || 0;
            c.innerHTML = `
                <h2 style="margin-bottom: 15px;"><i class="fa-solid fa-wallet" style="color:var(--success-color);"></i> Wallet & Exchange</h2>
                <div class="card glass" style="display:flex; justify-content:space-around; text-align:center;">
                    <div>
                        <p style="font-size:0.85rem; color:#94a3b8; font-weight:bold;">Current Gems</p>
                        <h3 style="color:var(--accent-color);"><i class="fa-solid fa-gem"></i> ${currentUser.points}</h3>
                    </div>
                    <div style="width:1px; background:rgba(255,255,255,0.1);"></div>
                    <div>
                        <p style="font-size:0.85rem; color:#94a3b8; font-weight:bold;">Real Money</p>
                        <h3 style="color:var(--success-color);"><i class="fa-solid fa-dollar-sign"></i> ${realBal.toFixed(2)}</h3>
                    </div>
                </div>

                <div class="card glass">
                    <h3 style="margin-bottom:10px;"><i class="fa-solid fa-right-left"></i> Exchange Gems</h3>
                    <p style="font-size:0.8rem; margin-bottom:15px; color:#94a3b8;">Convert your gems into real cash.</p>
                    <input type="number" id="exchangeAmount" class="input-field" placeholder="Amount of Gems to Exchange" min="100">
                    <button class="btn btn-primary" onclick="processExchange()"><i class="fa-solid fa-coins"></i> Exchange to Money</button>
                </div>
            `;
        }

        async function processExchange() {
            const amt = parseInt(document.getElementById('exchangeAmount').value);
            if (!amt || amt <= 0) return showToast('Enter a valid amount', 'error');
            if (amt > currentUser.points) return showToast('Not enough gems!', 'error');

            const btn = document.querySelector('button[onclick="processExchange()"]');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE_URL}/api/exchange`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId, gemsToExchange: amt })
                });
                const data = await res.json();
                
                if (data.success) {
                    showToast('Success! Converted gems to cash.', 'success');
                    const uRes = await fetch(`${API_BASE_URL}/api/user/${userId}`);
                    currentUser = await uRes.json();
                    nav('withdraw');
                } else {
                    showToast(data.error || 'Exchange failed', 'error');
                    btn.innerHTML = '<i class="fa-solid fa-coins"></i> Exchange to Money';
                    btn.disabled = false;
                }
            } catch (e) {
                showToast('Network error', 'error');
                btn.innerHTML = '<i class="fa-solid fa-coins"></i> Exchange to Money';
                btn.disabled = false;
            }
        }
        async function renderLeaderboard(c) {
            c.innerHTML = `
                <div style="text-align:center; padding: 20px 0;">
                    <h2><i class="fa-solid fa-trophy" style="color:var(--gold-color);"></i> Top 100 Players</h2>
                    <p style="font-size:0.85rem; color:#888;">The best of the best.</p>
                </div>
                <div id="leaderboardLoading" style="text-align:center; padding: 30px;"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div>
                <div id="top3Container" class="top-3-container" style="display:none;"></div>
                <div id="leaderboardList" style="display:flex; flex-direction:column; gap:10px; margin-bottom: 80px;"></div>
            `;
            
            try {
                const res = await fetch(`${API_BASE_URL}/api/leaderboard/${userId}`);
                const data = await res.json();
                
                document.getElementById('leaderboardLoading').style.display = 'none';
                
                const top100 = data.byPoints || [];
                
                // Render Top 3
                const top3 = top100.slice(0, 3);
                const top3Html = top3.map((u, i) => {
                    const rank = i + 1;
                    const avatarUrl = `${API_BASE_URL}/api/avatar/${u.id}`;
                    return `
                        <div class="top-3-item rank-${rank}">
                            <div class="crown"><i class="fa-solid fa-crown"></i></div>
                            <div class="top-avatar-box">
                                <img src="${avatarUrl}" loading="lazy" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.username||'User')}&background=B026FF&color=fff';">
                            </div>
                            <div class="top-name">${u.username || 'User'}</div>
                            <div class="top-score"><i class="fa-solid fa-gem"></i> ${(u.points||0).toLocaleString()}</div>
                        </div>
                    `;
                }).join('');
                
                const top3Cont = document.getElementById('top3Container');
                if(top3.length > 0) {
                    top3Cont.innerHTML = top3Html;
                    top3Cont.style.display = 'flex';
                }

                // Render Rest (4-100)
                const rest = top100.slice(3);
                let listHtml = '';
                rest.forEach((u, idx) => {
                    const rank = idx + 4;
                    const avatarUrl = `${API_BASE_URL}/api/avatar/${u.id}`;
                    listHtml += `
                        <div class="glass leaderboard-list-item">
                            <div class="rank-circle">${rank}</div>
                            <img src="${avatarUrl}" class="leaderboard-avatar" loading="lazy" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.username||'User')}&background=B026FF&color=fff';">
                            <div style="flex-grow:1; font-weight:bold;">${u.username || 'User'}</div>
                            <div style="color:var(--gold-color); font-weight:800;"><i class="fa-solid fa-gem"></i> ${(u.points||0).toLocaleString()}</div>
                        </div>
                    `;
                });
                document.getElementById('leaderboardList').innerHTML = listHtml;
                
                // Footer Logic
                const footer = document.getElementById('leaderboardFooter');
                const userRank = data.userRankPoints;
                if(userRank && userRank <= 100) {
                    footer.innerHTML = `Your Rank: #${userRank}`;
                } else {
                    footer.innerHTML = `Your Rank: 99+`;
                }
                footer.style.display = 'flex';
                
            } catch(e) {
                document.getElementById('leaderboardLoading').innerHTML = "Failed to load leaderboard.";
            }
        }

        function openGame(gameId) {
            const main = document.getElementById('mainContent');
            const wrapper = document.getElementById('gameCanvasWrapper');
            const nav = document.querySelector('.bottom-nav');
            
            main.style.animation = "fadeOut 0.3s forwards";
            nav.style.transform = "translateY(100%)";
            
            setTimeout(() => {
                main.style.display = 'none';
                wrapper.style.display = 'block';
                wrapper.style.animation = "fadeIn 0.3s forwards";
                if(gameId === 'aviator') renderAviatorGame(document.getElementById('activeGameCanvas'));
            }, 300);
        }
        function closeGame() {
            const main = document.getElementById('mainContent');
            const wrapper = document.getElementById('gameCanvasWrapper');
            const nav = document.querySelector('.bottom-nav');
            
            if(typeof aviatorActive !== 'undefined') aviatorActive = false;
            
            wrapper.style.animation = "fadeOut 0.3s forwards";
            setTimeout(() => {
                wrapper.style.display = 'none';
                document.getElementById('activeGameCanvas').innerHTML = '';
                
                main.style.display = 'block';
                main.style.animation = "fadeIn 0.3s forwards";
                nav.style.transform = "translateY(0)";
                updateUI();
            }, 300);
        }

        // ==========================================
        // AVIATOR 20 FEATURES OVERHAUL
        // ==========================================
        let aviatorRound = null;
        let avReq;
        function renderAviatorGame(c) {
            c.innerHTML = `
                <div class="card glass" style="padding: 10px; position: relative;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <h2 style="color:var(--danger-color); margin:0;"><i class="fa-solid fa-plane-up"></i> Aviator</h2>
                        <div>
                            <button class="panel-toggle-btn" onclick="document.getElementById('myBetsSide').classList.toggle('open')"><i class="fa-solid fa-clock-rotate-left"></i></button>
                            <button class="panel-toggle-btn" onclick="document.getElementById('topBetsSide').classList.toggle('open')"><i class="fa-solid fa-fire"></i></button>
                            <button class="btn btn-secondary" onclick="document.getElementById('pfModal').style.display='flex'" style="width:auto; padding: 5px 10px; font-size:0.8rem; display:inline-block;"><i class="fa-solid fa-shield-halved"></i> Provably Fair</button>
                        </div>
                    </div>

                    <!-- 1. Multiplier History Bar -->
                    <div class="aviator-history-bar" id="avHistory"></div>

                    <!-- 3. Altitude/Atmosphere Canvas Shifts & 4. Dynamic Zoom -->
                    <div class="aviator-wrapper" id="avWrapper">
                        <!-- 17. Highest Win Banner -->
                        <div class="highest-win-banner" id="avBanner">🔥 Mesechebo won 15,000 Gems at 15.2x!</div>
                        
                        <!-- 6. Live Chat Overlay -->
                        <div class="aviator-chat-overlay" id="avChat"></div>
                        
                        <div id="avMult" style="position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); font-size:4rem; font-weight:900; font-family:monospace; color:white; z-index:5;">1.00x</div>
                        <div id="avCrashMsg" style="position:absolute; top:20%; left:50%; transform:translateX(-50%); font-size:2rem; font-weight:900; color:var(--danger-color); opacity:0; z-index:5;">FLEW AWAY</div>
                        
                        <canvas id="avCanvas"></canvas>
                        
                        <!-- 19. Sparks element -->
                        <div id="avSpark" class="spark"></div>
                    </div>

                    <!-- 18. Dual Independent Auto-Cashouts & Betting Panels -->
                    <div class="bet-panel-container">
                        <!-- Panel 1 -->
                        <div class="bet-panel glass">
                            <!-- 11. Auto Play Toggle -->
                            <div class="auto-play-row">Auto Play <label class="switch"><input type="checkbox" id="avAutoPlay1"><span class="slider"></span></label></div>
                            <!-- 7. Quick-Bet Hotkeys -->
                            <div class="hotkey-row">
                                <button class="hotkey-btn" onclick="modBet('avBet1', 10)">+10</button>
                                <button class="hotkey-btn" onclick="modBet('avBet1', 50)">+50</button>
                                <button class="hotkey-btn" onclick="modBet('avBet1', 'max')">Max</button>
                                <button class="hotkey-btn" onclick="modBet('avBet1', 'half')">1/2</button>
                            </div>
                            <div style="display:flex; gap:10px;">
                                <input type="number" id="avBet1" class="input-field" style="margin:0;" value="10">
                                <input type="number" id="avAutoCash1" class="input-field" style="margin:0;" placeholder="Auto (e.g. 2.0)">
                            </div>
                            <button class="bet-btn idle" id="avBtn1" onclick="avAction(1)">BET</button>
                        </div>
                        
                        <!-- Panel 2 -->
                        <div class="bet-panel glass">
                            <div class="auto-play-row">Auto Play <label class="switch"><input type="checkbox" id="avAutoPlay2"><span class="slider"></span></label></div>
                            <div class="hotkey-row">
                                <button class="hotkey-btn" onclick="modBet('avBet2', 10)">+10</button>
                                <button class="hotkey-btn" onclick="modBet('avBet2', 50)">+50</button>
                                <button class="hotkey-btn" onclick="modBet('avBet2', 'max')">Max</button>
                                <button class="hotkey-btn" onclick="modBet('avBet2', 'half')">1/2</button>
                            </div>
                            <div style="display:flex; gap:10px;">
                                <input type="number" id="avBet2" class="input-field" style="margin:0;" value="10">
                                <input type="number" id="avAutoCash2" class="input-field" style="margin:0;" placeholder="Auto (e.g. 2.0)">
                            </div>
                            <button class="bet-btn idle" id="avBtn2" onclick="avAction(2)">BET</button>
                        </div>
                    </div>

                    <!-- 9. My Bet History Panel -->
                    <div id="myBetsSide" class="side-panel left glass">
                        <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold;">My Flights <button class="panel-toggle-btn" onclick="document.getElementById('myBetsSide').classList.remove('open')">X</button></div>
                        <div id="myBetsList"></div>
                    </div>

                    <!-- 8. Top Bets Panel -->
                    <div id="topBetsSide" class="side-panel right glass">
                        <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold;">Top Bets <button class="panel-toggle-btn" onclick="document.getElementById('topBetsSide').classList.remove('open')">X</button></div>
                        <div id="topBetsList"></div>
                    </div>
                </div>

                <!-- 2. Provably Fair Modal -->
                <div id="pfModal" class="provably-fair-modal">
                    <div class="card glass" style="width:90%; text-align:center;">
                        <h2><i class="fa-solid fa-shield-halved"></i> Provably Fair</h2>
                        <p style="font-size:0.8rem; margin:15px 0;">This game uses cryptographic SHA-256 hashes to guarantee fairness. The multiplier is generated server-side before the round begins and cannot be altered.</p>
                        <p style="font-size:0.7rem; word-break:break-all; color:var(--accent-color);" id="pfHash">Next Round Hash: [Hidden]</p>
                        <button class="btn btn-primary" onclick="document.getElementById('pfModal').style.display='none'" style="margin-top:20px;">Close</button>
                    </div>
                </div>
            `;
            initAviatorCanvas();
            loadHistory();
            
            // 15. Network Disconnect Auto-loss money
            window.addEventListener('offline', avForceLoss);

            // 10. Keyboard Shortcuts (Spacebar to bet/cashout Panel 1)
            window.addEventListener('keydown', handleSpacebar);
        }

        function handleSpacebar(e) {
            if(e.code === 'Space' && document.getElementById('avBtn1')) {
                e.preventDefault();
                avAction(1);
            }
        }

        function avForceLoss() {
            if(aviatorActive) {
                showToast("Network Disconnected. Bets Lost.", "error");
                avCrash(aviatorMultiplier);
            }
        }

        function modBet(inputId, val) {
            const input = document.getElementById(inputId);
            let cur = Number(input.value) || 0;
            if(val === 'max') input.value = currentUser.points;
            else if(val === 'half') input.value = Math.floor(cur / 2);
            else input.value = cur + val;
        }

        let avCtx, avX, avY;
        function initAviatorCanvas() {
            const canvas = document.getElementById('avCanvas');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            avCtx = canvas.getContext('2d');
            drawPlane(0, canvas.height, 1.0);
        }

        // 16. VIP Golden Plane Skin & Explosion logic
        function drawPlane(x, y, scale = 1.0, exploded = false) {
            avCtx.clearRect(0,0, avCtx.canvas.width, avCtx.canvas.height);
            
            // 4. Dynamic Camera Zoom (Scale grid curve)
            avCtx.save();
            avCtx.translate(0, avCtx.canvas.height * (1-scale)); 
            avCtx.scale(1, scale);

            avCtx.beginPath();
            avCtx.moveTo(0, avCtx.canvas.height);
            avCtx.quadraticCurveTo(x/2, avCtx.canvas.height, x, y);
            avCtx.lineWidth = 4;
            avCtx.strokeStyle = '#EF4444';
            avCtx.stroke();
            avCtx.restore();

            if (exploded) {
                // 12. Explosion/Smoke Trail
                avCtx.fillStyle = '#333';
                avCtx.beginPath();
                avCtx.arc(x, y, 20, 0, Math.PI*2);
                avCtx.fill();
                avCtx.fillStyle = '#ff4444';
                avCtx.beginPath();
                avCtx.arc(x, y, 10, 0, Math.PI*2);
                avCtx.fill();
            } else {
                const isGolden = currentUser.points > 50000; // VIP Logic
                avCtx.fillStyle = isGolden ? '#FFD700' : 'white';
                avCtx.shadowColor = isGolden ? '#FFD700' : 'transparent';
                avCtx.shadowBlur = isGolden ? 15 : 0;
                
                avCtx.beginPath();
                avCtx.arc(x, y, 6, 0, Math.PI*2);
                avCtx.fill();
                avCtx.shadowBlur = 0;
            }
        }

        // Web Audio API for Pitch
        function initEngineSound() {
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                oscillator = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                
                oscillator.type = 'sawtooth';
                oscillator.frequency.value = 100;
                gainNode.gain.value = 0.1;
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
            } else {
                gainNode.gain.value = 0.1;
                oscillator.frequency.value = 100;
            }
        }
        function stopEngineSound() {
            if(gainNode) gainNode.gain.value = 0;
        }

        async function loadHistory() {
            const h = await fetch(`${API_BASE_URL}/api/config`).then(r=>r.json());
            const list = h.aviatorHistory || [1.2, 5.0, 1.0, 2.5, 12.1];
            updateHistoryBar(list);
            
            // Populate Fake Top Bets
            let html = '';
            for(let i=0; i<10; i++) {
                html += `<div class="history-item"><span>User${Math.floor(Math.random()*999)}</span><span class="win">+${Math.floor(Math.random()*5000)} Gems</span></div>`;
            }
            document.getElementById('topBetsList').innerHTML = html;

            // My Bet History
            let myHtml = '';
            const logs = currentUser.logs || [];
            logs.filter(l=>l.includes('Aviator')).reverse().slice(0,10).forEach(l => {
                const isWin = l.includes('Cashout');
                myHtml += `<div class="history-item"><span>${l.split('] ')[0].replace('[','')}</span><span class="${isWin?'win':'loss'}">${isWin?'WON':'LOST'}</span></div>`;
            });
            document.getElementById('myBetsList').innerHTML = myHtml || 'No flights yet.';
        }

        function updateHistoryBar(list) {
            const histHtml = list.map(m => {
                let c = 'pill-low';
                if(m >= 2.0 && m < 10.0) c = 'pill-med';
                if(m >= 10.0) c = 'pill-high';
                return `<div class="history-pill ${c}">${m.toFixed(2)}x</div>`;
            }).join('');
            document.getElementById('avHistory').innerHTML = histHtml;
        }

        async function avAction(panel) {
            const btn = document.getElementById(`avBtn${panel}`);
            
            if(btn.classList.contains('idle')) {
                // Place Bet
                const bet = parseInt(document.getElementById(`avBet${panel}`).value);
                if(currentUser.points < bet) return showToast("Not enough Gems", "error");
                
                btn.className = "bet-btn active";
                btn.innerText = "WAITING...";
                
                if(!aviatorActive) {
                    // Only fetch round if not already flying
                    const res = await fetch(`${API_BASE_URL}/api/aviator/start`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ userId, betAmount: bet })
                    });
                    aviatorRound = await res.json();
                    document.getElementById('pfHash').innerText = `Server Seed Hash:\n${aviatorRound.serverHash}`;
                    updateHistoryBar(aviatorRound.history);
                    startFlight();
                } else {
                    // Already flying, wait for next round (Simplified for demo)
                    showToast("Flight in progress, bet queued for next round.", "info");
                }
            } 
            else if (btn.classList.contains('waiting')) {
                // Cashout
                const mult = aviatorMultiplier;
                const bet = parseInt(document.getElementById(`avBet${panel}`).value);
                
                const res = await fetch(`${API_BASE_URL}/api/aviator/cashout`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId, roundId: aviatorRound.roundId, multiplier: mult, betAmount: bet })
                });
                const data = await res.json();
                if(data.success) {
                    btn.className = "bet-btn idle";
                    btn.innerText = `WON ${data.winnings}`;
                    document.getElementById('audioCashout').play();
                    currentUser.points += (data.winnings - bet);
                    updateUI();
                    
                    // 19. Live Cashout Sparks
                    triggerSpark(avX, avY);

                    // 5. Rain of Coins Animation (>5x)
                    if(mult > 5.0) {
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#FFD700', '#FFA500'] });
                    }
                }
            }
        }

        function triggerSpark(x, y) {
            const spark = document.getElementById('avSpark');
            spark.style.left = `${x}px`;
            spark.style.top = `${y}px`;
            spark.style.animation = 'none';
            spark.offsetHeight; // trigger reflow
            spark.style.animation = 'sparkAnim 0.5s ease-out';
        }

        // 6. Live Chat Simulator
        let chatInterval;
        function simulateChat() {
            const chatBox = document.getElementById('avChat');
            const msgs = ["Wow!", "Cash out now!", "Greedy!", "Boom!", "Nice win", "RIP", "Fly high!"];
            chatInterval = setInterval(() => {
                if(!aviatorActive) return;
                const div = document.createElement('div');
                div.className = 'chat-msg';
                div.innerHTML = `<span class="user">User${Math.floor(Math.random()*999)}:</span> ${msgs[Math.floor(Math.random()*msgs.length)]}`;
                chatBox.prepend(div);
                if(chatBox.children.length > 5) chatBox.removeChild(chatBox.lastChild);
            }, 1500);
        }

        function startFlight() {
            aviatorActive = true;
            aviatorMultiplier = 1.00;
            
            // Set buttons to waiting
            [1,2].forEach(p => {
                const btn = document.getElementById(`avBtn${p}`);
                if(btn.classList.contains('active')) {
                    btn.className = "bet-btn waiting";
                    btn.innerText = "CASHOUT";
                }
            });
            
            document.getElementById('avCrashMsg').style.opacity = '0';
            const wrapper = document.getElementById('avWrapper');
            wrapper.className = "aviator-wrapper"; // reset bg
            
            if(audioCtx) audioCtx.resume();
            initEngineSound();
            simulateChat();

            const targetMult = aviatorRound.crashPoint;
            const canvas = document.getElementById('avCanvas');
            let t = 0;

            function animate() {
                if(!aviatorActive) return;
                t += 0.02;
                aviatorMultiplier = 1.00 + Math.pow(t, 2) * 0.1;
                
                document.getElementById('avMult').innerText = aviatorMultiplier.toFixed(2) + "x";
                
                // 3. Atmosphere Shifts
                if(aviatorMultiplier > 2 && aviatorMultiplier <= 5) wrapper.classList.add('clouds');
                if(aviatorMultiplier > 5) wrapper.classList.add('space');
                
                // 13. Progressive Engine Pitch
                if(oscillator) oscillator.frequency.value = 100 + (aviatorMultiplier * 20);

                // 18. Independent Auto-Cashouts
                [1,2].forEach(p => {
                    const autoVal = document.getElementById(`avAutoCash${p}`).value;
                    const btn = document.getElementById(`avBtn${p}`);
                    if(autoVal && aviatorMultiplier >= parseFloat(autoVal) && btn.classList.contains('waiting')) {
                        avAction(p);
                    }
                });

                // 14. Pre-Crash Turbulence
                if(targetMult - aviatorMultiplier < 0.5 && targetMult > 1.5) {
                    wrapper.classList.add('turbulence');
                }

                avX = Math.min(canvas.width - 50, t * 25);
                avY = Math.max(50, canvas.height - (t * 20));
                
                // Dynamic Zoom scale factor
                let scale = 1.0 - (t * 0.01);
                if(scale < 0.7) scale = 0.7;

                drawPlane(avX, avY, scale);

                if(aviatorMultiplier >= targetMult) {
                    avCrash(targetMult);
                } else {
                    avReq = requestAnimationFrame(animate);
                }
            }
            animate();
        }

        function avCrash(crashedAt) {
            aviatorActive = false;
            cancelAnimationFrame(avReq);
            stopEngineSound();
            clearInterval(chatInterval);
            document.getElementById('audioCrash').play();

            const wrapper = document.getElementById('avWrapper');
            wrapper.classList.remove('turbulence');
            
            document.getElementById('avCrashMsg').style.opacity = '1';
            document.getElementById('avMult').style.color = "var(--danger-color)";
            document.getElementById('avMult').innerText = (crashedAt).toFixed(2) + "x";
            
            // 12. Explosion Render
            drawPlane(avX, avY, 1.0, true);
            
            [1,2].forEach(p => {
                const btn = document.getElementById(`avBtn${p}`);
                if(btn.classList.contains('waiting')) {
                    btn.className = "bet-btn idle";
                    btn.innerText = "BET";
                }
                
                // 11. Auto-Play check
                const isAuto = document.getElementById(`avAutoPlay${p}`).checked;
                if(isAuto) {
                    setTimeout(() => avAction(p), 4000);
                }
            });

            // Reset visual state after 3s
            setTimeout(() => {
                document.getElementById('avMult').style.color = "white";
                document.getElementById('avMult').innerText = "1.00x";
                document.getElementById('avCrashMsg').style.opacity = '0';
                wrapper.className = "aviator-wrapper";
                drawPlane(0, document.getElementById('avCanvas').height, 1.0);
            }, 3000);
        }

        // Cleanup
        window.addEventListener('beforeunload', () => {
            window.removeEventListener('keydown', handleSpacebar);
            window.removeEventListener('offline', avForceLoss);
        });

    </script>
</body>
</html>
