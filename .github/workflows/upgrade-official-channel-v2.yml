name: Reliable Official Channel Repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair official channels and gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # Restore the richer legacy admin panel and upgrade its Official Channel page.
          legacy = (root / 'public/admin-live.html').read_text(encoding='utf-8')
          section = '''<section id="channel" class="section">
          <div class="card">
            <h2>Official Channel Posts</h2>
            <p class="muted">Publish and manage the official posts shown inside MYFA BIRR.</p>
            <div class="field"><label>Post</label><textarea id="channelText" placeholder="Write your official post..."></textarea></div>
            <div class="row" style="margin-top:12px"><button class="btn ok" onclick="postChannel()">Publish Post</button><button class="btn gray" onclick="reloadAll()">Refresh Posts</button></div>
            <div id="postList" style="margin-top:12px"></div>
          </div>
          <div class="card">
            <h2>Official Channels</h2>
            <p class="muted">Every listed channel is checked through Telegram before a user can continue when Mandatory Membership is enabled.</p>
            <label class="check" style="margin-bottom:14px"><span><b>Mandatory Membership</b><br><small class="muted">Block the Mini App until the user belongs to every official channel.</small></span><input id="officialGateEnabled" type="checkbox" onchange="syncOfficialGate()"></label>
            <div class="grid2">
              <div class="field"><label>Channel Name</label><input id="offName" placeholder="MYFA BIRR Official"></div>
              <div class="field"><label>Channel Link</label><input id="offLink" placeholder="https://t.me/yourchannel"></div>
              <div class="field"><label>Verification Channel ID</label><input id="offId" placeholder="-1001234567890"></div>
              <div class="field"><label>Icon</label><input id="offIcon" value="fa-telegram"></div>
            </div>
            <div class="row" style="margin-top:12px">
              <button class="btn ok" id="channelSaveEditBtn" onclick="saveOrUpdateOfficialChannel()">Add Channel</button>
              <button class="btn gray" onclick="cancelOfficialChannelEdit()">Cancel Edit</button>
              <button class="btn" onclick="saveConfig()">Save Channels & Membership</button>
            </div>
            <div id="channelList" style="margin-top:12px"></div>
          </div>
        </section>'''
          legacy = re.sub(r'<section id="channel" class="section">.*?</section>', section, legacy, count=1, flags=re.S)

          extra_js = r'''
          // ===== Official Channel / Post repair =====
          let __officialChannelEditing = -1;

          function syncOfficialGate(){
            const source = document.getElementById('officialGateEnabled');
            const target = document.getElementById('gateEnabled');
            if (source && target) target.checked = !!source.checked;
          }

          function renderChannels(){
            const gate = document.getElementById('officialGateEnabled');
            if (gate) gate.checked = !!DATA.config?.gateEnabled;
            const list = document.getElementById('channelList');
            if (!list) return;
            if (!Array.isArray(channels) || !channels.length){ list.innerHTML='<div class="muted">No official channels configured.</div>'; return; }
            list.innerHTML = channels.map((c,i)=>{
              const safe = v => String(v ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
              return `<div class="item"><b><i class="fa-brands ${safe(c.icon||'fa-telegram')}"></i> ${safe(c.name||'Official Channel')}</b><div class="muted">${safe(c.link||'')}</div><div class="pill">Verification ID: ${safe(c.id||'Missing')}</div><div class="actions" style="margin-top:8px"><button class="btn gray" onclick="editOfficialChannel(${i})">Edit</button><button class="btn" onclick="verifyOfficialChannel(${i})">Verify Bot</button><button class="btn danger" onclick="removeOfficialChannel(${i})">Remove</button></div></div>`;
            }).join('');
          }

          function editOfficialChannel(i){
            const c=channels[i]; if(!c) return;
            __officialChannelEditing=i;
            document.getElementById('offName').value=c.name||'';
            document.getElementById('offLink').value=c.link||'';
            document.getElementById('offId').value=c.id||'';
            document.getElementById('offIcon').value=c.icon||'fa-telegram';
            document.getElementById('channelSaveEditBtn').textContent='Update Channel';
          }

          function cancelOfficialChannelEdit(){
            __officialChannelEditing=-1;
            ['offName','offLink','offId'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
            const i=document.getElementById('offIcon');if(i)i.value='fa-telegram';
            document.getElementById('channelSaveEditBtn').textContent='Add Channel';
          }

          function saveOrUpdateOfficialChannel(){
            const c={name:String(document.getElementById('offName')?.value||'').trim(),link:String(document.getElementById('offLink')?.value||'').trim(),id:String(document.getElementById('offId')?.value||'').trim(),icon:String(document.getElementById('offIcon')?.value||'fa-telegram').trim()||'fa-telegram'};
            if(!c.name||!c.link||!c.id) return alert('Channel name, link and verification channel ID are required.');
            if(__officialChannelEditing>=0) channels[__officialChannelEditing]=c; else channels.push(c);
            cancelOfficialChannelEdit(); renderChannels();
          }

          function removeOfficialChannel(i){
            if(!channels[i]) return;
            if(!confirm('Remove this official channel?')) return;
            channels.splice(i,1); cancelOfficialChannelEdit(); renderChannels();
          }

          async function verifyOfficialChannel(i){
            const c=channels[i]; if(!c?.id) return alert('Verification channel ID is missing.');
            try { const r=await api('test-channel',{channelId:c.id}); alert('Telegram verification: '+(r.status||'OK')); } catch(e){ alert(e.message); }
          }

          function renderPosts(){
            const list=document.getElementById('postList'); if(!list) return;
            const posts=Array.isArray(DATA.channelPosts)?DATA.channelPosts:Object.values(DATA.channelPosts||{});
            const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
            list.innerHTML=posts.slice().reverse().map(p=>`<div class="item"><div style="white-space:pre-wrap">${esc(p.text||'')}</div><div class="row" style="justify-content:space-between;align-items:center;margin-top:8px"><small class="muted">${new Date(Number(p.date||Date.now())).toLocaleString()}</small><button class="btn danger" onclick="deleteOfficialPost('${esc(p.id||'')}')">Delete</button></div></div>`).join('')||'<div class="muted">No posts yet.</div>';
          }

          async function deleteOfficialPost(id){
            if(!id||!confirm('Delete this official post?')) return;
            try { await api('channel/post',{action:'delete',id}); await reloadAll(); } catch(e){ alert(e.message); }
          }

          document.addEventListener('DOMContentLoaded',()=>{ const g=document.getElementById('officialGateEnabled'); if(g) g.checked=!!DATA?.config?.gateEnabled; });
          '''
          h, t = legacy.rsplit('</script>', 1)
          legacy = h + extra_js + '\n</script>' + t
          (root/'public/admin-live.html').write_text(legacy, encoding='utf-8')
          (root/'public/myfa.html').write_text(legacy, encoding='utf-8')

          # Return channelPosts to the admin dashboard data payload.
          gateway = (root/'api/admin-gateway.js').read_text(encoding='utf-8')
          gateway = gateway.replace("adminLogs: data.adminLogs || [], stats: data.stats || {}", "adminLogs: data.adminLogs || [], stats: data.stats || {}, channelPosts: data.channelPosts || []", 1)
          marker = "  if (cfg.monetagZoneId !== undefined) cfg.monetagZoneId = String(cfg.monetagZoneId || '').trim();"
          if marker in gateway and "cfg.officialChannels = list.map" not in gateway:
              gateway = gateway.replace(marker, marker + "\n  if (cfg.officialChannels !== undefined) {\n    const list = Array.isArray(cfg.officialChannels) ? cfg.officialChannels : [];\n    cfg.officialChannels = list.map(ch => ({ name: String(ch?.name || '').trim(), link: String(ch?.link || '').trim(), id: String(ch?.id || '').trim(), icon: String(ch?.icon || 'fa-telegram').trim() || 'fa-telegram' })).filter(ch => ch.name && ch.link && ch.id);\n  }", 1)
          (root/'api/admin-gateway.js').write_text(gateway, encoding='utf-8')

          # Add a fresh cache-free membership endpoint to both API copies.
          gate = r'''

async function getOfficialGateStatus(userId) {
    const config = await dbGet('config') || {};
    const channels = Array.isArray(config.officialChannels) ? config.officialChannels.filter(ch => ch && ch.id && ch.link) : [];
    if (!config.gateEnabled || channels.length === 0) return { required:false, passed:true, channels:[] };
    const checks = await Promise.all(channels.map(async ch => {
        const result = await fetchMultiAPI(ch.id, String(userId), BOT_TOKEN);
        const status = result?.status || 'unknown';
        const isMember = !!result?.success && ['creator','administrator','member','restricted'].includes(status);
        return { name:ch.name, link:ch.link, id:ch.id, icon:ch.icon||'fa-telegram', status, isMember, error:result?.error||null };
    }));
    return { required:true, passed:checks.every(c => c.isMember), channels:checks };
}
app.get('/api/gate-status', async (req,res) => {
    res.set('Cache-Control','no-store, no-cache, must-revalidate, proxy-revalidate');
    try {
        const userId=String(req.query.userId||'').trim();
        if(!userId) return res.status(400).json({required:false,passed:false,error:'Telegram user ID is required'});
        return res.json(await getOfficialGateStatus(userId));
    } catch(e) { return res.status(500).json({required:true,passed:false,error:e.message||'Membership verification failed'}); }
});
'''
          for name in ['api/index.js','api/index-cloudflare.js']:
              p=root/name; code=p.read_text(encoding='utf-8')
              if "app.get('/api/gate-status'" not in code:
                  code=code.replace("app.get('/api/user/:id'", gate+"\napp.get('/api/user/:id'", 1)
                  p.write_text(code, encoding='utf-8')

          # Live background membership enforcement in the Mini App.
          front=(root/'public/index.html').read_text(encoding='utf-8')
          runtime=r'''
<script>
(() => {
  const uid=()=>String(window.Telegram?.WebApp?.initDataUnsafe?.user?.id||new URLSearchParams(location.search).get('userId')||'');
  let busy=false;
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const link=ch=>{let x=String(ch?.link||'').trim();if(x.startsWith('@'))return'https://t.me/'+x.slice(1);if(/^https?:\/\//i.test(x))return x;if(x.startsWith('t.me/'))return'https://'+x;return'https://t.me/'+x.replace(/^\/+/, '')};
  function openGate(d){const g=document.getElementById('gate-overlay');if(!g)return;const list=document.getElementById('gateChannelList');if(list)list.innerHTML=(d.channels||[]).map(c=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.04)"><div><b>${esc(c.name||'Official Channel')}</b><br><small style="color:${c.isMember?'#6ee7b7':'#ff9a9a'}">${c.isMember?'Member':'Join required'}</small></div><button class="btn quantum-btn" onclick="window.open('${link(c)}','_blank')">${c.isMember?'Open':'Join Channel'}</button></div>`).join('');g.style.display='flex';g.style.zIndex='100000';g.style.pointerEvents='auto';}
  function closeGate(){const g=document.getElementById('gate-overlay');if(g)g.style.display='none';}
  window.checkOfficialMembership=async()=>{const id=uid();if(!id||busy)return;busy=true;try{const r=await fetch('/api/gate-status?userId='+encodeURIComponent(id)+'&t='+Date.now(),{cache:'no-store'});const d=await r.json();if(d.required&&!d.passed)openGate(d);else if(d.passed)closeGate();}catch(e){console.warn('Official membership check failed',e);}finally{busy=false;}};
  document.addEventListener('DOMContentLoaded',()=>{window.checkOfficialMembership();setInterval(()=>{if(!document.hidden)window.checkOfficialMembership();},30000);});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)window.checkOfficialMembership();});
  window.addEventListener('focus',()=>window.checkOfficialMembership());
})();
</script>
'''
          if 'checkOfficialMembership' not in front:
              front=front.replace('</body>',runtime+'</body>',1)
              (root/'public/index.html').write_text(front,encoding='utf-8')

          (root/'OFFICIAL_CHANNEL_UPGRADE.md').write_text('Official channel posts and editable mandatory-membership channels restored.\n',encoding='utf-8')
          PY

      - name: Commit repair and remove helper workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/myfa.html public/admin-live.html public/index.html api/index.js api/index-cloudflare.js api/admin-gateway.js OFFICIAL_CHANNEL_UPGRADE.md .github/workflows/upgrade-official-channel-v2.yml .github/workflows/upgrade-official-channel.yml
          git rm -f .github/workflows/upgrade-official-channel-v2.yml .github/workflows/upgrade-official-channel.yml 2>/dev/null || true
          git commit -m "Restore official channel posts and membership gate" || true
          git push
