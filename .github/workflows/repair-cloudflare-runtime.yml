name: Repair Cloudflare Runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair runtime
        run: node repair_cloudflare_runtime.cjs

      - name: Commit repairs and clean helper files
        run: |
          rm -f repair_cloudflare_runtime.cjs .github/workflows/repair-cloudflare-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Restore admin panel and disable startup ads"
          git push
