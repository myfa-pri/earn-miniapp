<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>MYFA Drop — MYFA BIRR</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#070b17;--panel:#111827;--cyan:#00f2fe;--pink:#ff007a;--gold:#f5d76e;--muted:#94a3b8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(8,12,24,.96);border-bottom:1px solid rgba(255,255,255,.08);position:relative;z-index:10}.back-btn,.play-btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;border-radius:13px;padding:9px 12px;font-weight:800}.play-btn{background:linear-gradient(135deg,var(--cyan),#5d7cff);color:#061018;border:0;box-shadow:0 8px 24px rgba(0,242,254,.2)}button:disabled{opacity:.55}.score,.time{font-weight:900}.score{color:var(--gold)}.time{color:var(--pink)}#gameArea{position:relative;height:calc(100% - 64px);overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 5%,rgba(0,242,254,.08),transparent 35%),linear-gradient(180deg,#0b1022,#10162c)}.catcher{position:absolute;bottom:18px;left:50%;width:76px;height:58px;transform:translateX(-50%);border:2px solid var(--cyan);border-radius:16px 16px 30px 30px;background:rgba(0,242,254,.13);display:grid;place-items:center;font-size:28px;z-index:4;box-shadow:0 0 18px rgba(0,242,254,.22)}.item{position:absolute;width:44px;height:44px;display:grid;place-items:center;font-size:30px;z-index:3;user-select:none}.flower{color:#ffd43b;filter:drop-shadow(0 4px 10px rgba(255,211,50,.4))}.item[data-type="bomb"]{color:#ff4d6d}.item[data-type="freeze"]{color:#9be7ff}.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,6,14,.82);backdrop-filter:blur(7px)}.card{width:min(430px,100%);padding:24px 18px;border:1px solid rgba(255,255,255,.11);border-radius:24px;background:rgba(17,24,39,.96);text-align:center;box-shadow:0 18px 55px rgba(0,0,0,.35)}.card h1{margin:0 0 8px;color:var(--cyan);font-size:1.55rem}.card p{color:var(--muted);line-height:1.55}.chances{color:var(--gold)!important;font-weight:900}.primary{margin-top:10px;border:0;border-radius:15px;padding:13px 22px;background:linear-gradient(135deg,var(--cyan),#7b61ff);font-weight:900;color:#071019;cursor:pointer}.error{color:#fbbf24!important;font-size:.88rem}.hint{font-size:.8rem;color:#64748b!important;margin-top:12px}.freeze{position:absolute;inset:0;z-index:5;background:rgba(0,242,254,.1);pointer-events:none;display:none}.shake{animation:shake .18s linear 1}@keyframes shake{25%{transform:translate(5px,2px)}50%{transform:translate(-5px,-2px)}75%{transform:translate(3px,-1px)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.01ms!important}}
</style></head><body><header class="header"><button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Back to MYFA BIRR</button><div class="score"><i class="fa-solid fa-gem"></i> <span id="score">0</span></div><div class="time"><i class="fa-solid fa-clock"></i> <span id="time">15</span>s</div></header><main id="gameArea"><div id="freeze" class="freeze"></div><div id="catcher" class="catcher" aria-label="Catcher"><i class="fa-solid fa-basket-shopping"></i></div><section id="startOverlay" class="overlay"><div class="card"><h1>MYFA DROP</h1><p>Catch flowers to earn Gems. Avoid bombs. Catch snowflakes to slow the action.</p><p class="chances">Chances remaining: <span id="chances">Checking…</span></p><button id="startBtn" class="primary" disabled>Play Now</button><p id="error" class="error" hidden></p><p class="hint">Your play is authorized by the MYFA server before a chance is consumed.</p></div></section><section id="endOverlay" class="overlay" hidden><div class="card"><h1 style="color:var(--gold)">Time’s Up</h1><p>You caught <strong id="finalScore">0</strong> Gems.</p><button id="claimBtn" class="primary">Claim Reward</button><p id="claimError" class="error" hidden></p></div></section></main><script>
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch(e){}const params=new URLSearchParams(location.search);const userId=String(tg?.initDataUnsafe?.user?.id||params.get('userId')||'');const initData=tg?.initData||'';const apiBase='';let chances=0,sessionId=null,score=0,timeLeft=15,playing=false,startBusy=false,claimBusy=false,timer=0,spawnTimer=0,freezeUntil=0;const $=id=>document.getElementById(id);const area=$('gameArea'),catcher=$('catcher');
function showError(msg){$('error').hidden=false;$('error').textContent=msg}async function loadState(){if(!userId){showError('Telegram user session not found.');return}try{const q=initData?'?initData='+encodeURIComponent(initData):'';const r=await fetch(apiBase+'/api/dropgame/state/'+encodeURIComponent(userId)+q,{cache:'no-store'});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Unable to load chances');chances=Number(d.chances||0);$('chances').textContent=String(chances);if(chances>0){$('startBtn').disabled=false}else showError('No Drop chances remaining today.')}catch(e){console.error(e);$('chances').textContent='Unavailable';showError('Unable to load your chances. Check your connection and try again.')}}
function move(x){const r=area.getBoundingClientRect(),half=catcher.offsetWidth/2;const px=Math.max(half,Math.min(r.width-half,x-r.left));catcher.style.left=px+'px'}area.addEventListener('pointermove',e=>{if(playing)move(e.clientX)},{passive:true});area.addEventListener('touchmove',e=>{if(!playing)return;e.preventDefault();if(e.touches[0])move(e.touches[0].clientX)},{passive:false});
async function start(){if(startBusy||playing||chances<=0)return;startBusy=true;$('startBtn').disabled=true;try{const r=await fetch(apiBase+'/api/dropgame/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,initData})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Unable to start game');sessionId=d.sessionId;chances=Number(d.chancesRemaining||0);$('chances').textContent=String(chances);$('startOverlay').hidden=true;score=0;timeLeft=15;playing=true;freezeUntil=0;$('score').textContent='0';$('time').textContent='15';$('freeze').style.display='none';document.querySelectorAll('.item').forEach(x=>x.remove());timer=setInterval(()=>{if(Date.now()<freezeUntil)return;timeLeft--;$('time').textContent=timeLeft;if(timeLeft<=0)end()},1000);spawn()}catch(e){showError(e.message);$('startBtn').disabled=false}finally{startBusy=false}}
function spawn(){if(!playing)return;const el=document.createElement('div');el.className='item';const roll=Math.random();const type=roll<.2?'bomb':roll<.3?'freeze':'flower';el.dataset.type=type;el.innerHTML=type==='bomb'?'<i class="fa-solid fa-bomb"></i>':type==='freeze'?'<i class="fa-solid fa-snowflake"></i>':'<i class="fa-solid fa-fan"></i>';if(type==='flower')el.classList.add('flower');el.style.left=Math.random()*Math.max(1,area.clientWidth-44)+'px';el.style.top='-46px';area.appendChild(el);let y=-46,speed=2+Math.random()*2.5,last=performance.now();function frame(now){if(!playing){el.remove();return}const dt=Math.min(32,now-last);last=now;const slow=Date.now()<freezeUntil?.3:1;y+=speed*slow*(dt/16.67);el.style.top=y+'px';const a=el.getBoundingClientRect(),b=catcher.getBoundingClientRect();if(a.bottom>=b.top&&a.top<=b.bottom&&a.right>=b.left&&a.left<=b.right){catchItem(el,type);return}if(y>area.clientHeight){el.remove();return}requestAnimationFrame(frame)}requestAnimationFrame(frame);spawnTimer=setTimeout(spawn,450)}
function catchItem(el,type){el.remove();if(type==='flower'){score=Math.min(100,score+5)}else if(type==='bomb'){score=Math.max(0,score-10);area.classList.remove('shake');void area.offsetWidth;area.classList.add('shake')}else{freezeUntil=Date.now()+3000;$('freeze').style.display='block';setTimeout(()=>{if(Date.now()>=freezeUntil)$('freeze').style.display='none'},3100)}$('score').textContent=score}
function end(){if(!playing)return;playing=false;clearInterval(timer);clearTimeout(spawnTimer);document.querySelectorAll('.item').forEach(x=>x.remove());$('finalScore').textContent=score;$('endOverlay').hidden=false}
async function claim(){if(claimBusy||!sessionId)return;claimBusy=true;$('claimBtn').disabled=true;try{const r=await fetch(apiBase+'/api/dropgame/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,initData,sessionId,score})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Unable to claim reward');location.replace('/index.html?userId='+encodeURIComponent(userId))}catch(e){console.error(e);$('claimError').hidden=false;$('claimError').textContent=e.message;$('claimBtn').disabled=false;claimBusy=false}}
$('startBtn').onclick=start;$('claimBtn').onclick=claim;$('backBtn').onclick=()=>location.replace('/index.html'+(userId?'?userId='+encodeURIComponent(userId):''));loadState();
</script></body></html>
