<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>How it works — MYFA BIRR</title><link rel="stylesheet" href="index.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
body{min-height:100vh;padding-bottom:32px}.how{width:min(760px,100%);margin:auto;padding:14px}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.top button{border:1px solid var(--glass-border);background:var(--glass-bg);color:inherit;border-radius:13px;padding:10px 13px}.title{flex:1;text-align:center;font-weight:900}.langs{display:flex;gap:5px}.langs button.active{border-color:var(--color-cyan)}.hero,.sec{border:1px solid var(--glass-border);background:var(--glass-bg);border-radius:20px}.hero{padding:20px;margin-bottom:12px}.hero h1{margin:0 0 6px}.muted{color:#94a3b8;line-height:1.55}.sec{margin:10px 0;overflow:hidden}.sec>button{width:100%;border:0;background:transparent;color:inherit;display:flex;gap:12px;align-items:center;padding:16px;text-align:left}.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(0,242,254,.1);color:var(--color-cyan)}.sec h2{font-size:.98rem;flex:1;margin:0}.body{display:none;padding:0 16px 17px 68px;color:#94a3b8;line-height:1.65}.sec.open .body{display:block}.chev{transition:transform .18s}.sec.open .chev{transform:rotate(180deg)}ol,ul{padding-left:20px}.body li{margin:6px 0}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main class="how"><div class="top"><button id="back" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button><div class="title">MYFA BIRR</div><div class="langs"><button data-l="en" class="active">EN</button><button data-l="am">አማ</button></div></div><section class="hero"><h1 data-en="How it works" data-am="እንዴት እንደሚሰራ">How it works</h1><p class="muted" data-en="A practical guide to earning, games, ads, referrals, withdrawals and your account." data-am="የገቢ፣ ጨዋታ፣ ማስታወቂያ፣ ሪፈራል፣ ማውጣት እና መለያዎን ለመጠቀም አጭር መመሪያ።">A practical guide to earning, games, ads, referrals, withdrawals and your account.</p></section><div id="list"></div></main><script>
const data=[['gem','Earn','ገቢ ማግኘት','Use available ads, tasks, referrals and games. Rewards are credited only after the MYFA backend verifies the required action.','በሚገኙ ማስታወቂያዎች፣ ተግባራት፣ ሪፈራሎች እና ጨዋታዎች ገቢ ያግኙ። ሽልማት የሚጨመረው የMYFA backend እርምጃውን ካረጋገጠ በኋላ ብቻ ነው።'],['play-circle','Watch Ads','ማስታወቂያ ይመልከቱ','Open Ads, choose an available ad, start it, complete the required viewing time and wait for verification. Limits are controlled by the current configuration.','Ads ይክፈቱ፣ የሚገኝ ማስታወቂያ ይምረጡ፣ ይጀምሩ፣ የሚያስፈልገውን ጊዜ ይጨርሱ እና ማረጋገጫ ይጠብቁ። ገደቦች በአሁኑ የመተግበሪያ ቅንብር ይወሰናሉ።'],['list-check','Tasks','ተግባራት','Open Tasks, read the requirement, complete it, then submit or verify it. Some tasks require review before reward.','Tasks ይክፈቱ፣ መስፈርቱን ያንብቡ፣ ያጠናቅቁ እና ያስገቡ/ያረጋግጡ። አንዳንድ ተግባራት ሽልማት ከመሰጠቱ በፊት ግምገማ ይፈልጋሉ።'],['rectangle-ad','Create Ads','ማስታወቂያ ይፍጠሩ','Open Ad Studio from Settings. Choose the available campaign type, add your campaign details and supported media, review, then submit. Delivery follows backend status and budget rules.','ከSettings Ad Studio ይክፈቱ። የሚገኘውን የካምፔይን አይነት ይምረጡ፣ የካምፔይን መረጃና የሚደገፍ ሚዲያ ያክሉ፣ ይመልከቱ እና ያስገቡ። ማስታወቂያ ስርጭት በbackend ሁኔታና በበጀት ህጎች ይመራል።'],['money-bill-transfer','Withdraw','ገንዘብ ያውጡ','Open Withdraw, check the currently shown minimum and payment method, enter the required details and submit. Track the request status in the app.','Withdraw ይክፈቱ፣ በዚያ የሚታየውን ዝቅተኛ መጠንና የክፍያ መንገድ ያረጋግጡ፣ የሚፈለገውን መረጃ ያስገቡ እና ያስገቡ። የጥያቄውን ሁኔታ በመተግበሪያው ይከታተሉ።'],['user-group','Referrals','ሪፈራል','Open Invite/Referrals and share the MYFA referral link. A referral is counted only when the new user enters through the supported Telegram flow and meets the app eligibility rules.','Invite/Referrals ይክፈቱ እና የMYFA ሪፈራል ሊንክ ያጋሩ። አዲሱ ተጠቃሚ በተፈቀደው Telegram መንገድ ገብቶ የመተግበሪያውን የብቁነት ህግ ሲያሟላ ሪፈራሉ ይቆጠራል።'],['gamepad','Games','ጨዋታዎች','Multi Ox and Daily Combo use their own rules and limits. MYFA Drop: move the catcher, catch flowers, avoid bombs and catch snowflakes to slow the action. A Drop chance is consumed only after the server authorizes a game.','Multi Ox እና Daily Combo የራሳቸው ህግና ገደብ አላቸው። MYFA Drop፦ catcher ያንቀሳቅሱ፣ አበቦችን ይያዙ፣ ቦምቦችን ያስወግዱ እና snowflake በመያዝ ጨዋታውን ያዘግዩ። የDrop እድል የሚቀነሰው server ጨዋታውን ካፀደቀ በኋላ ነው።'],['chart-line','Account & Statistics','መለያ እና ስታቲስቲክስ','Home/Profile show backend-backed balance, ad, task, referral and account information available to your user. After an earning action, refresh to see the latest server state.','Home/Profile ለእርስዎ የሚገኘውን ከbackend የሚመጣ ቀሪ ሂሳብና የማስታወቂያ፣ ተግባር፣ ሪፈራል እና መለያ መረጃ ያሳያሉ። ገቢ ከማግኘት በኋላ አዲሱን የserver ሁኔታ ለማየት refresh ያድርጉ።']];let lang=localStorage.getItem('appLang')==='AM'?'am':'en';function render(){document.getElementById('list').innerHTML=data.map((x,i)=>`<section class="sec"><button aria-expanded="false"><span class="icon"><i class="fa-solid fa-${x[0]}"></i></span><h2>${lang==='am'?x[2]:x[1]}</h2><i class="fa-solid fa-chevron-down chev"></i></button><div class="body">${lang==='am'?x[4]:x[3]}</div></section>`).join('');document.querySelectorAll('.sec>button').forEach(b=>b.onclick=()=>{const s=b.parentElement;s.classList.toggle('open');b.setAttribute('aria-expanded',s.classList.contains('open'))});document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('active',b.dataset.l===lang))}document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;localStorage.setItem('appLang',lang==='am'?'AM':'EN');document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang]);render()});document.getElementById('back').onclick=()=>{const id=new URLSearchParams(location.search).get('userId')||tg?.initDataUnsafe?.user?.id;location.replace('/index.html'+(id?'?userId='+encodeURIComponent(id):''))};try{tg?.ready();tg?.expand()}catch(e){}render();</script></body></html>
