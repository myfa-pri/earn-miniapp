          function dashboard(){const m=state.campaigns.reduce((x,c)=>{x.active+=c.status==='active'?1:0;x.i+=Number(c.impressions||0);x.c+=Number(c.clicks||0);x.v+=Number(c.conversions||0);x.s+=Number(c.spend||0);x.r+=Number(c.budgetState?.remaining||0);return x},{active:0,i:0,c:0,v:0,s:0,r:0});return `<section class="asp-hero"><div><span class="asp-eyebrow"><i class="fa-solid fa-bolt"></i> REAL CAMPAIGN CONTROL</span><h1>Your ads.<br><em>Your tasks.</em></h1><p class="asp-copy">Every action below writes real campaign state to Firebase, validates ownership, and updates the reserved Gem balance.</p></div><button class="asp-primary" data-create="advertisement"><i class="fa-solid fa-plus"></i> Create Campaign</button></section><div class="asp-stats"><div class="asp-stat"><i class="fa-solid fa-play"></i><strong>${m.active}</strong><span>Active</span></div><div class="asp-stat"><i class="fa-solid fa-eye"></i><strong>${num(m.i)}</strong><span>Impressions</span></div><div class="asp-stat"><i class="fa-solid fa-bullseye"></i><strong>${num(m.v)}</strong><span>Conversions</span></div><div class="asp-stat"><i class="fa-solid fa-gem"></i><strong>${num(m.r)}</strong><span>Reserved</span></div></div><div class="asp-launch"><button data-create="advertisement"><i class="fa-solid fa-rectangle-ad"></i><b>Advertisement</b><small>Image/video campaign with real delivery budget.</small></button><button data-create="task"><i class="fa-solid fa-list-check"></i><b>Sponsored Task</b><small>Reward users after Telegram task verification.</small></button><button data-create="hybrid"><i class="fa-solid fa-bullseye"></i><b>Ad + Task</b><small>Combine delivery and user action.</small></button></div><section class="asp-section"><div class="asp-section-head"><div><small>Owned inventory</small><h2>Recent campaigns</h2></div><button class="asp-secondary" data-view="campaigns">View all</button></div>${state.campaigns.slice(0,4).map(card).join('')||'<div class="asp-empty"><b>No campaigns yet</b><span>Create your first real campaign.</span><button class="asp-primary" data-create="advertisement">Create campaign</button></div>'}</section>`}
          function create(mode='advertisement'){const ad=mode!=='task',task=mode!=='advertisement';return `<section class="asp-title"><span>CAMPAIGN BUILDER</span><h1>Create a real campaign.</h1><p class="asp-copy">The backend reserves Gems before the campaign becomes active. No fake success state.</p></section><div class="asp-card"><div class="asp-choice"><button class="${mode==='advertisement'?'active':''}" data-mode="advertisement"><i class="fa-solid fa-rectangle-ad"></i><b>Advertisement</b><small>Paid reach</small></button><button class="${mode==='task'?'active':''}" data-mode="task"><i class="fa-solid fa-list-check"></i><b>Sponsored Task</b><small>Reward action</small></button><button class="${mode==='hybrid'?'active':''}" data-mode="hybrid"><i class="fa-solid fa-bullseye"></i><b>Ad + Task</b><small>Reach + action</small></button></div><form id="createForm"><div class="asp-form-grid"><label class="asp-field">Campaign name<input name="name" required maxlength="80"></label><label class="asp-field">Destination URL<input name="link" type="url" ${ad?'required':''} placeholder="https://example.com"></label></div>${ad?`<div class="asp-form-grid"><label class="asp-field">Creative A image URL<input name="imageUrl" type="url"></label><label class="asp-field">Creative B image URL<input name="imageUrlB" type="url"></label><label class="asp-field">Video URL<input name="videoUrl" type="url"></label><label class="asp-field">CTA<input name="cta" maxlength="32" value="Visit Now"></label></div><div class="asp-form-grid"><label class="asp-field">Headline<input name="headline" maxlength="100"></label><label class="asp-field">Description<textarea name="description" rows="3" maxlength="240"></textarea></label><label class="asp-field">Impression budget<input name="impressionBudget" type="number" min="1" value="1000"></label><label class="asp-field">Daily budget<input name="dailyBudget" type="number" min="0" value="0"></label></div>`:''}${task?`<div class="asp-form-grid"><label class="asp-field">Target users<input name="maxUsers" type="number" min="1" value="100"></label><label class="asp-field">Reward per user<input name="reward" type="number" min="1" value="50"></label><label class="asp-field">Verification<select name="taskType"><option value="auto">Automatic Telegram</option><option value="manual">Manual proof</option></select></label><label class="asp-field">Telegram channel ID<input name="channelId" placeholder="-100... or @channel"></label></div><label class="asp-field">Task instructions<textarea name="taskDesc" rows="3" maxlength="500"></textarea></label>`:''}<div class="asp-form-grid"><label class="asp-field">Countries (comma separated)<input name="countries" placeholder="ET,US"></label><label class="asp-field">Devices<select name="devices"><option value="all">All</option><option value="android">Android</option><option value="ios">iOS</option><option value="web">Web</option></select></label><label class="asp-field">Frequency cap / day<input name="frequencyCap" type="number" min="0" value="0"></label><label class="asp-field">Start date<input name="startDate" type="datetime-local"></label><label class="asp-field">End date<input name="endDate" type="datetime-local"></label><label class="asp-field">Auto-pause at remaining %<input name="autoPauseThreshold" type="number" min="0" max="100" value="0"></label></div><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0;"><label><input type="checkbox" name="fraudProtection" checked> Fraud protection</label><label><input type="checkbox" name="autoScale"> Auto-scale delivery cap</label><label><input type="checkbox" name="abEnabled" checked> A/B creative rotation</label></div><button class="asp-primary" type="submit"><i class="fa-solid fa-lock"></i> Reserve Gems & Launch</button></form></div>`}
          function campaignsView(){return `<section class="asp-title"><span>CAMPAIGN INVENTORY</span><h1>Manage your campaigns.</h1></section><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;"><input id="campaignSearch" placeholder="Search campaigns..." value="${esc(state.query)}" style="flex:1;min-width:180px;background:rgba(0,0,0,.25);color:white;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:11px"><select id="campaignFilter" style="background:rgba(0,0,0,.25);color:white;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:11px"><option value="all">All</option><option value="active">Active</option><option value="paused">Paused</option><option value="ads">Ads</option><option value="tasks">Tasks</option></select></div>${activeList().map(card).join('')||'<div class="asp-empty"><b>No matching campaigns</b><span>Change the search/filter or create a new campaign.</span></div>'}`}
          function manage(c){const remain=Number(c.budgetState?.remaining||0),taskLike=c.mode!=='advertisement';const tracking=`${location.origin}/api/campaign-manager/campaigns/${encodeURIComponent(c.id)}/track`;return `<div><button class="asp-modal-close" data-close><i class="fa-solid fa-xmark"></i></button><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;"><div><span class="asp-eyebrow">${esc(c.mode.toUpperCase())} • ${esc(c.status.toUpperCase())}</span><h2>${esc(c.name)}</h2><p class="asp-copy">30 real management features are grouped below. Changes persist to Firebase.</p></div><button class="asp-secondary" data-action="toggle" data-id="${esc(c.id)}">${c.status==='paused'?'Resume':'Pause'}</button></div><div class="asp-stats"><div class="asp-stat"><strong>${num(c.impressions)}</strong><span>Impressions</span></div><div class="asp-stat"><strong>${num(c.clicks)}</strong><span>Clicks</span></div><div class="asp-stat"><strong>${num(c.conversions)}</strong><span>Conversions</span></div><div class="asp-stat"><strong>${num(remain)}</strong><span>Reserved</span></div></div><div style="display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px;">${feature(1,'Campaign name',`<input data-sfield="name" value="${esc(c.name)}"><button data-save="name">Save</button>`)}${feature(2,'Destination URL',`<input data-sfield="link" value="${esc(c.link||'')}"><button data-save="link">Save</button>`)}${feature(3,'Creative A',`<input data-sfield="imageUrl" value="${esc(c.imageUrl||'')}" placeholder="https://..."><button data-save="imageUrl">Save</button>`)}${feature(4,'Creative B / A-B variant',`<input data-sfield="imageUrlB" value="${esc(c.imageUrlB||'')}" placeholder="https://..."><button data-save="imageUrlB">Save</button>`)}${feature(5,'Headline + CTA',`<div class="asp-form-grid"><input data-sfield="headline" value="${esc(c.headline||'')}" placeholder="Headline"><input data-sfield="cta" value="${esc(c.cta||'Visit Now')}"></div><button data-save="headlineCta">Save</button>`)}${feature(6,'Description / task instructions',`<textarea data-sfield="description" rows="3">${esc(c.desc||'')}</textarea><button data-save="description">Save</button>`)}${feature(7,'Pause / resume',`<button data-action="toggle" data-id="${esc(c.id)}">${c.status==='paused'?'Resume campaign':'Pause campaign'}</button>`)}${feature(8,'Duplicate campaign',`<button data-action="duplicate" data-id="${esc(c.id)}">Duplicate + reserve same budget</button>`)}${feature(9,'Refund & archive',`<button class="asp-danger" data-action="refund" data-id="${esc(c.id)}">Refund ${num(remain)} Gems & archive</button>`)}${feature(10,'Add / refund budget',`<div class="asp-form-grid"><select id="budgetBucket"><option value="ad">Ad budget</option><option value="task">Task budget</option></select><input id="budgetAmount" type="number" step="1" placeholder="+100 / -100"></div><button data-budget="${esc(c.id)}">Apply budget change</button>`)}${feature(11,'Schedule / flight dates',`<div class="asp-form-grid"><input type="datetime-local" id="startDate" value="${c.startDate?new Date(c.startDate).toISOString().slice(0,16):''}"><input type="datetime-local" id="endDate" value="${c.endDate?new Date(c.endDate).toISOString().slice(0,16):''}></div><button data-save="schedule">Save schedule</button>`)}${feature(12,'Daily delivery cap',`<input data-sfield="dailyBudget" type="number" value="${Number(c.dailyBudget||0)}"><button data-save="dailyBudget">Save</button>`)}${feature(13,'Impression budget',`<span>${num(c.adBudgetRemaining||0)} Gems remain for ad delivery</span>`)}${feature(14,'Geo targeting',`<input data-sfield="countries" value="${esc((c.countries||[]).join(', '))}" placeholder="ET, US, KE"><button data-save="countries">Save</button>`)}${feature(15,'Device targeting',`<select data-sfield="devices"><option value="all" ${(c.devices||[]).includes('all')?'selected':''}>All</option><option value="android" ${(c.devices||[]).includes('android')?'selected':''}>Android</option><option value="ios" ${(c.devices||[]).includes('ios')?'selected':''}>iOS</option><option value="web" ${(c.devices||[]).includes('web')?'selected':''}>Web</option></select><button data-save="devices">Save</button>`)}${feature(16,'Frequency cap',`<input data-sfield="frequencyCap" type="number" value="${Number(c.frequencyCap||0)}"><button data-save="frequencyCap">Save</button>`)}${feature(17,'Task reward',taskLike?`<input data-sfield="reward" type="number" value="${Number(c.reward||0)}"><button data-save="reward">Recalculate & save</button>`:'<span>Not applicable to an ad-only campaign</span>')}${feature(18,'Task max users',taskLike?`<input data-sfield="maxUsers" type="number" value="${Number(c.maxUsers||0)}"><button data-save="maxUsers">Recalculate & save</button>`:'<span>Not applicable to an ad-only campaign</span>')}${feature(19,'Verification type',taskLike?`<select data-sfield="taskType"><option value="auto" ${c.task?.type==='auto'?'selected':''}>Automatic Telegram</option><option value="manual" ${c.task?.type==='manual'?'selected':''}>Manual proof</option></select><button data-save="taskType">Save</button>`:'<span>Not applicable</span>')}${feature(20,'Telegram channel ID',taskLike?`<input data-sfield="channelId" value="${esc(c.channelId||c.task?.channelId||'')}"><button data-save="channelId">Save</button>`:'<span>Not applicable</span>')}${feature(21,'Auto-scale delivery cap',`<label><input type="checkbox" data-sfield="autoScale" ${c.autoScale?'checked':''}> enabled</label><button data-save="autoScale">Save</button>`)}${feature(22,'Auto-pause threshold',`<input data-sfield="autoPauseThreshold" type="number" min="0" max="100" value="${Number(c.autoPauseThreshold||0)}"><button data-save="autoPauseThreshold">Save</button>`)}${feature(23,'Fraud protection',`<label><input type="checkbox" data-sfield="fraudProtection" ${c.fraudProtection!==false?'checked':''}> enabled</label><button data-save="fraudProtection">Save</button>`)}${feature(24,'A/B testing rotation',`<label><input type="checkbox" data-sfield="abEnabled" ${c.abEnabled!==false?'checked':''}> enabled</label><button data-save="abEnabled">Save</button>`)}${feature(25,'Conversion tracking',`<code style="display:block;overflow:auto;white-space:nowrap;">${esc(tracking)}</code><button data-copy="${esc(tracking)}">Copy endpoint</button>`)}${feature(26,'Test delivery',`<button data-test="${esc(c.id)}">Preview through real delivery rules</button>`)}${feature(27,'Destination validation',`<button data-validate="${esc(c.id)}">Validate URL</button>`)}${feature(28,'Performance snapshot',`<span>CTR: <b>${Number(c.ctr||0).toFixed(2)}%</b> • CPA: <b>${Number(c.cpa||0).toFixed(2)}</b> • Spend: <b>${num(c.spend)}</b></span>`)}${feature(29,'Audit log',`<button data-audit="${esc(c.id)}">Load audit history</button><pre id="audit-${esc(c.id)}" style="white-space:pre-wrap;max-height:180px;overflow:auto;"></pre>`)}${feature(30,'Export report',`<button data-export="${esc(c.id)}">Export JSON report</button>`)}</div></div>`}
          function feature(n,title,body){return `<div class="asp-card" style="padding:12px 14px;"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px;"><b>${n}. ${title}</b><span class="asp-tag">REAL</span></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">${body}</div></div>`}
          function render(){const c=$('#aspContent');if(state.view==='dashboard')c.innerHTML=dashboard();if(state.view==='create')c.innerHTML=create(state.createMode||'advertisement');if(state.view==='campaigns')c.innerHTML=campaignsView();$$('.asp-nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));bind()}
          async function refresh(){state.id=uid();if(!state.id)throw new Error('Telegram user session not found');const d=await api(`/api/campaign-manager/dashboard/${encodeURIComponent(state.id)}`);state.user=d.user;state.campaigns=d.campaigns||[];$('#aspBalance').textContent=num(state.user.points);render()}
          function openModal(c){const m=$('#aspModal');m.innerHTML=manage(c);m.classList.add('open');m.setAttribute('aria-hidden','false')}
          async function saveSettings(fields){const body={userId:state.id};for(const k of fields){const el=document.querySelector(`[data-sfield="${k}"]`);if(!el)continue;body[k]=(el.type==='checkbox')?el.checked:el.value}if(fields.includes('countries'))body.countries=String(body.countries||'').split(',').map(x=>x.trim()).filter(Boolean);if(fields.includes('devices'))body.devices=[body.devices||'all'];if(fields.includes('schedule')){body.startDate=$('#startDate')?.value||null;body.endDate=$('#endDate')?.value||null}if(fields.includes('headlineCta')){body.headline=document.querySelector('[data-sfield="headline"]')?.value||'';body.cta=document.querySelector('[data-sfield="cta"]')?.value||'Visit Now'}if(fields.includes('description'))body.desc=document.querySelector('[data-sfield="description"]')?.value||'';if(['reward','maxUsers'].some(k=>fields.includes(k))){body.reward=document.querySelector('[data-sfield="reward"]')?.value;body.maxUsers=document.querySelector('[data-sfield="maxUsers"]')?.value}const id=$('#aspModal').querySelector('[data-action]')?.dataset.id || document.querySelector('#aspModal [data-budget]')?.dataset.budget;const modalId=id||state.activeId;const r=await api(`/api/campaign-manager/campaigns/${encodeURIComponent(modalId)}/settings`,{method:'POST',body:JSON.stringify(body)});const i=state.campaigns.findIndex(x=>x.id===modalId);if(i>=0)state.campaigns[i]=r.campaign;state.user=r.user;$('#aspBalance').textContent=num(state.user.points);toast('Saved to Firebase');openModal(r.campaign)}
          async function action(action,id){const r=await api(`/api/campaign-manager/campaigns/${encodeURIComponent(id)}/action`,{method:'POST',body:JSON.stringify({userId:state.id,action})});if(r.user){state.user=r.user;$('#aspBalance').textContent=num(state.user.points)}if(r.campaign){const i=state.campaigns.findIndex(x=>x.id===id);if(i>=0)state.campaigns[i]=r.campaign}if(r.campaigns)state.campaigns=r.campaigns;toast(action==='refund'?`Refunded ${num(r.refunded)} Gems.`:'Campaign updated');$('#aspModal').classList.remove('open');render()}
          function bind(){
              $$('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});
              $$('[data-create]').forEach(b=>b.onclick=()=>{state.createMode=b.dataset.create;state.view='create';render()});
              $$('[data-mode]').forEach(b=>b.onclick=()=>{state.createMode=b.dataset.mode;render()});
              $$('[data-manage]').forEach(b=>b.onclick=()=>{state.activeId=b.dataset.manage;openModal(state.campaigns.find(c=>c.id===state.activeId))});
              $$('[data-close]').forEach(b=>b.onclick=()=>$('#aspModal').classList.remove('open'));
              $$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));
              $$('[data-budget]').forEach(b=>b.onclick=async()=>{const a=Number($('#budgetAmount')?.value||0),bucket=$('#budgetBucket')?.value||'ad';if(!a)return;const r=await api(`/api/campaign-manager/campaigns/${b.dataset.budget}/budget`,{method:'POST',body:JSON.stringify({userId:state.id,amount:a,bucket})});const i=state.campaigns.findIndex(x=>x.id===b.dataset.budget);if(i>=0)state.campaigns[i]=r.campaign;state.user=r.user;$('#aspBalance').textContent=num(state.user.points);toast('Budget updated');openModal(r.campaign)});
              $$('[data-save]').forEach(b=>b.onclick=()=>{state.activeId=state.activeId||b.closest('#aspModal')?.querySelector('[data-action]')?.dataset.id;const f=b.dataset.save;saveSettings(f==='headlineCta'?['headlineCta']:(f==='description'?['description']:[f])) .catch(e=>toast(e.message))});
              $$('[data-copy]').forEach(b=>b.onclick=async()=>{await navigator.clipboard?.writeText(b.dataset.copy);toast('Tracking endpoint copied')});
              $$('[data-test]').forEach(b=>b.onclick=async()=>{const r=await api(`/api/campaign-manager/serve/${encodeURIComponent(state.id)}?test=1`);toast(r.ad?`Test served: ${r.ad.name}`:'No eligible ad for current rules');if(r.ad)window.open(r.ad.link,'_blank')});
              $$('[data-validate]').forEach(b=>b.onclick=async()=>{const r=await api(`/api/campaign-manager/campaigns/${encodeURIComponent(b.dataset.validate)}/validate`,{method:'POST',body:JSON.stringify({userId:state.id})});toast(r.valid?`Destination OK (${r.status||'reachable'})`:(r.error||'Destination invalid'))});
              $$('[data-audit]').forEach(b=>b.onclick=async()=>{const r=await api(`/api/campaign-manager/audit/${encodeURIComponent(b.dataset.audit)}?userId=${encodeURIComponent(state.id)}`);const p=$(`#audit-${b.dataset.audit}`);if(p)p.textContent=(r.audit||[]).map(x=>`${new Date(x.timestamp).toLocaleString()} • ${x.action}`).join('\n')});
              $$('[data-export]').forEach(b=>b.onclick=()=>window.open(`/api/campaign-manager/export/${encodeURIComponent(b.dataset.export)}?userId=${encodeURIComponent(state.id)}`,'_blank'));
              const form=$('#createForm');if(form)form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));const r=await api('/api/campaign-manager/campaigns',{method:'POST',body:JSON.stringify({userId:state.id,mode:state.createMode||'advertisement',name:d.name,link:d.link,imageUrl:d.imageUrl,imageUrlB:d.imageUrlB,videoUrl:d.videoUrl,headline:d.headline,cta:d.cta,description:d.description,impressionBudget:Number(d.impressionBudget||0),dailyBudget:Number(d.dailyBudget||0),maxUsers:Number(d.maxUsers||0),reward:Number(d.reward||0),taskType:d.taskType,channelId:d.channelId,taskDesc:d.taskDesc,countries:d.countries,devices:d.devices,frequencyCap:Number(d.frequencyCap||0),startDate:d.startDate?new Date(d.startDate).toISOString():null,endDate:d.endDate?new Date(d.endDate).toISOString():null,autoPauseThreshold:Number(d.autoPauseThreshold||0),fraudProtection:d.fraudProtection==='on',autoScale:d.autoScale==='on',abEnabled:d.abEnabled==='on'})});state.user=r.user;state.campaigns=r.campaigns||state.campaigns;$('#aspBalance').textContent=num(state.user.points);state.view='campaigns';toast('Campaign launched and budget reserved');render()};
              const search=$('#campaignSearch');if(search){search.oninput=()=>{state.query=search.value;state.view='campaigns';render()};}
              const filter=$('#campaignFilter');if(filter){filter.value=state.filter;filter.onchange=()=>{state.filter=filter.value;render()};}
          }
          document.addEventListener('DOMContentLoaded',()=>{$('#adStudioApp').addEventListener('click',e=>{if(e.target.closest('[data-back]'))history.back()});refresh().catch(e=>{$('#aspContent').innerHTML=`<div class="asp-empty"><i class="fa-solid fa-circle-exclamation"></i><b>Campaign manager could not load</b><span>${esc(e.message)}</span><button class="asp-primary" onclick="location.reload()">Retry</button></div>`})});
          })();
          ''')

          studio = Path('public/ad-studio-pro.html')
          a = studio.read_text()
          if 'telegram-web-app.js' not in a:
              a = a.replace('</head>', '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">\n<script src="https://telegram.org/js/telegram-web-app.js"></script>\n</head>')
          a = a.replace('<script src="/ad-studio-pro.js" defer></script>', '<script src="/campaign-manager.js" defer></script>')
          studio.write_text(a)

          # Keep the old source copy aligned enough that future generated copies use the same avatar fallback.
          script1 = Path('script1.js')
          if script1.exists():
              ss = script1.read_text()
              ss = ss.replace("const avatarUrl = u.id ? `${API_BASE_URL}/api/avatar/${u.id}` : fbUrl;", "const avatarUrl = u.avatarUrl || (u.id ? `${API_BASE_URL}/api/avatar/${u.id}` : fbUrl);")
              script1.write_text(ss)
          PY

      - name: Validate JavaScript
        run: |
          node --check api/index.js
          node --check public/campaign-manager.js

      - name: Commit production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/index.js public/drop.html public/index.html public/ad-studio-pro.html public/campaign-manager.js public/myfa-runtime-fixes.js script1.js
          git diff --cached --quiet && { echo "No production changes to commit"; exit 0; }
          git commit -m "fix: real profiles streaks drop difficulty and campaign management"
          git push
