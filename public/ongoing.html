<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MYFA Ongoing</title>
<link rel="stylesheet" href="/assets/ongoing/ongoing.css?v=power6">
</head>
<body>
<div id="ongoing-app" class="preview-ready" aria-label="MYFA Ongoing onboarding">
  <main class="stage" id="stage">
    <section class="slide active" data-page="1" aria-hidden="false">
      <div class="art"><img class="artwork" src="/assets/ongoing/page1.png" alt="">
        <div class="live-elements" aria-hidden="true">
          <div class="type-mask p1-welcome" data-type="Welcome to"></div>
          <div class="type-mask p1-brand" data-type="MYFA"></div>
          <div class="type-mask p1-tagline" data-type="A WORLD OF REWARDS|FOR REAL PLAYERS"></div>
          <div class="icon-live p1-play" data-motion="play"></div><div class="icon-live p1-gift" data-motion="gift"></div><div class="icon-live p1-people" data-motion="people"></div><div class="icon-live p1-rocket" data-motion="rocket"></div>
          <div class="type-mask p1-quote" data-type="“Small Steps Today|Big Rewards Tomorrow”"></div>
          <div class="real-button p1-cta"><span>CONTINUE</span><b>→</b></div>
          <div class="bottom-live p1-bottom">PROUDLY<br>ETHIOPIAN <em>♥</em></div>
          <div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div>
        </div>
        <button class="hotspot skip" data-skip aria-label="Skip"></button><button class="hotspot next" data-next aria-label="Continue"></button>
      </div>
    </section>
    <section class="slide" data-page="2" aria-hidden="true">
      <div class="art"><img class="artwork" src="/assets/ongoing/page2.png" alt="">
        <div class="live-elements" aria-hidden="true">
          <div class="type-mask p2-heading" data-type="DISCOVER|WHAT MAKES|MYFA SPECIAL"></div>
          <div class="type-mask p2-sub" data-type="PLAY • COMPLETE • EARN • ENJOY"></div>
          <div class="card-live c1" data-motion="drop"></div><div class="card-live c2" data-motion="tasks"></div><div class="card-live c3" data-motion="spin"></div><div class="card-live c4" data-motion="scratch"></div><div class="card-live c5" data-motion="streak"></div><div class="card-live c6" data-motion="gems"></div>
          <div class="type-mask p2-quote" data-type="“More Than a Game|A Community, A Family”"></div>
          <div class="dots-live"><i></i><i></i><i></i></div>
          <div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div>
        </div>
        <button class="hotspot skip" data-skip aria-label="Skip"></button><button class="hotspot next p2" data-next aria-label="Next"></button>
      </div>
    </section>
    <section class="slide" data-page="3" aria-hidden="true">
      <div class="art"><img class="artwork" src="/assets/ongoing/page3.png" alt="">
        <div class="live-elements" aria-hidden="true">
          <div class="type-mask p3-title" data-type="Ready to Start|Your Journey?"></div>
          <div class="crown-live">♛</div><div class="type-mask p3-brand" data-type="MYFA"></div><div class="type-mask p3-tag" data-type="PLAY • EARN • GROW|TOGETHER ♥"></div>
          <div class="benefit b1" data-motion="real"></div><div class="benefit b2" data-motion="community"></div><div class="benefit b3" data-motion="safe"></div><div class="benefit b4" data-motion="love"></div>
          <div class="note-live"></div><div class="real-button p3-cta"><span>GET STARTED</span><b>→</b></div>
          <div class="bottom-live p3-bottom">Enkutatash<br><small>A Brighter Tomorrow</small> <em>♥</em></div>
          <div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div>
        </div>
        <button class="hotspot skip" data-skip aria-label="Skip"></button><button class="hotspot finish" data-finish aria-label="Get started"></button>
      </div>
    </section>
  </main>
</div>
<script src="/assets/ongoing/ongoing.js?v=power6" defer></script>
</body></html>
