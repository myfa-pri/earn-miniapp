name: MYFA streak and profile fix

on:
  push:
    paths:
      - '.github/workflows/myfa-live-fix2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch streak, avatar, leaderboard and speed
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Backend daily claim: locate the route by its unique existing guard/reward code.
          p = Path('api/index.js')
          s = p.read_text()
          s = s.replace("res.json({ success: true, newBal: newBal, reward: reward, streakCount: streakCount, claimDate: today });",
                        "res.json({ success: true, newBal: newBal, reward: reward });", 1)
          old = '''    const today = new Date().toISOString().split('T')[0];\n    const lastLoginStr = user.lastLoginDate ? new Date(user.lastLoginDate).toISOString().split('T')[0] : null;\n    \n    if (lastLoginStr === today) {\n        return res.json({ success: false, error: 'Streak already claimed today' });\n    }\n    \n    const streakCount = user.streakCount || 1;\n    const reward = streakCount * 50;\n    const newPoints = (user.points || 0) + reward;'''
          new = '''    const today = new Date().toISOString().split('T')[0];\n    const claimDate = user.streakClaimDate || null;\n    \n    if (claimDate === today) {\n        return res.json({ success: false, error: 'Streak already claimed today', alreadyClaimed: true, streakCount: Math.max(1, Number(user.streakCount || user.streak || 1)) });\n    }\n    \n    const streakCount = Math.min(7, Math.max(1, Number(user.streakCount || user.streak || 1)));\n    const reward = streakCount * 50;\n    const newPoints = (user.points || 0) + reward;'''
          if old not in s:
              raise SystemExit('daily claim route block not found')
          s = s.replace(old, new, 1)
          # Insert/update the claim write only within the daily-claim route by matching its existing success response context.
          claim_write_old = '''    await dbUpdate(`users/${userId}`, { \n        points: newPoints, \n        lastLoginDate: Date.now()\n    });\n    \n    res.json({ success: true, reward, newPoints });'''
          if claim_write_old in s:
              claim_write_new = '''    await dbUpdate(`users/${userId}`, { \n        points: newPoints,\n        streakCount: streakCount,\n        streak: streakCount,\n        streakClaimDate: today\n    });\n    \n    res.json({ success: true, reward, newPoints, streakCount, claimDate: today });'''
              s = s.replace(claim_write_old, claim_write_new, 1)
          else:
              # Existing current route may not include lastLoginDate in the write; patch the first matching response after the claim guard.
              anchor = "const newPoints = (user.points || 0) + reward;"
              pos = s.find(anchor)
              if pos < 0:
                  raise SystemExit('daily claim write anchor not found')
              tail = s.find("res.json({ success: true", pos)
              if tail < 0:
                  raise SystemExit('daily claim response not found')
              before = s[:tail]
              if "streakClaimDate: today" not in before[-700:]:
                  marker = "    await dbUpdate(`users/${userId}`, {"
                  m = before.rfind(marker, pos, tail)
                  if m >= 0:
                      close = s.find("});", m, tail)
                      if close >= 0:
                          block = s[m:close]
                          if "streakClaimDate" not in block:
                              block2 = block.replace("points: newPoints,", "points: newPoints,\n        streakCount: streakCount,\n        streak: streakCount,\n        streakClaimDate: today,")
                              s = s[:m] + block2 + s[close:]
          p.write_text(s)

          # UI duplicates exist in the main HTML and standalone script; patch both where present.
          for name in ('public/index.html', 'script1.js'):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text()
              # Use real Telegram/backend avatar instead of blank currentUser.avatarUrl.
              old_avatar = "const avatarUrl = window.Telegram.WebApp.initDataUnsafe?.user?.photo_url || currentUser.avatarUrl || `https://ui-avatars.com/api/?name=${currentUser.username}&background=00F2FE&color=fff`;"
              new_avatar = "const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;\n    const avatarUrl = tgUser?.photo_url || currentUser.avatarUrl || `${window.location.origin}/api/avatar/${encodeURIComponent(userId)}`;"
              s = s.replace(old_avatar, new_avatar)
              old_header_avatar = "const avatarUrl = window.Telegram.WebApp.initDataUnsafe?.user?.photo_url || (currentUser ? currentUser.avatarUrl : '') || `https://ui-avatars.com/api/?name=${currentUser ? currentUser.username : 'User'}&background=00F2FE&color=fff`;"
              new_header_avatar = "const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;\n            const avatarUrl = tgUser?.photo_url || (currentUser && currentUser.avatarUrl) || `${window.location.origin}/api/avatar/${encodeURIComponent(typeof userId !== 'undefined' ? userId : '')}`;"
              s = s.replace(old_header_avatar, new_header_avatar)
              # Show canonical streak field (fallback supports old users).
              s = s.replace("let currentStreak = currentUser.streakCount || 0;", "let currentStreak = Math.max(Number(currentUser.streakCount || 0), Number(currentUser.streak || 0), 0);")
              # Remove the exact requested legacy leaderboard heading block wherever duplicated.
              exact = '''<div style="text-align:center; padding: 20px 0;">\n                    <h2><i class="fa-solid fa-trophy" style="color:#F5A623; font-size: 2rem; margin-bottom: 10px; display:inline-block; filter: drop-shadow(0 0 10px rgba(245, 166, 35, 0.5));"></i><br>Top 100 Players</h2>\n                    <div class="lb-tabs">\n                        <div class="lb-tab active">All Time</div>\n                    </div>\n                </div>'''
              s = s.replace(exact, '')
              # Remove forced reflow/opacity transition in cached page navigation.
              s = s.replace("                activePage.style.display = 'block';\n                void activePage.offsetWidth; // Force reflow\n                activePage.style.opacity = '1';",
                            "                activePage.style.display = 'block';\n                activePage.style.opacity = '1';")
              # Make home render immediately use the already-canonical streak value.
              p.write_text(s)

          # Public HTML: remove artificial 2.5s startup wait when present.
          p = Path('public/index.html')
          s = p.read_text()
          s = s.replace("setTimeout(() => {", "setTimeout(() => {", 1)
          # Narrowly replace common forced loader delay values.
          s = s.replace("}, 2500);", "}, 50);")
          s = s.replace("}, 3000);", "}, 1000);")
          p.write_text(s)
          PY
      - name: Syntax check
        run: node --check api/index.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/index.js public/index.html script1.js
          git commit -m "fix: align daily streak claim and Telegram profile" || exit 0
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/myfa-live-fix2.yml
          git commit -m "chore: remove streak fix workflow"
          git push
