name: Speed Up MYFA Mini App

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Optimize startup and disable automatic ads
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('public/index.html')
          if index.exists():
              html = index.read_text(encoding='utf-8')

              # Never load the legacy Monetag 41731 SDK during the initial page load.
              html = re.sub(
                  r'\s*<script\b[^>]*src=["\'](?:https?:)?//libtl\.com/sdk\.js["\'][^>]*data-zone=["\']41731["\'][^>]*>\s*</script>\s*',
                  '\n', html, flags=re.I)

              # Adsgram can remain available for an explicit user action, but must not block first paint.
              html = re.sub(
                  r'<script\s+src=["\']https://sad\.adsgram\.ai/js/sad\.min\.js["\']\s*></script>',
                  '<script src="https://sad.adsgram.ai/js/sad.min.js" defer></script>',
                  html, flags=re.I)

              # QR code is only needed after app UI is visible.
              html = re.sub(
                  r'<script\s+src=["\']https://cdnjs\.cloudflare\.com/ajax/libs/qrcodejs/1\.0\.0/qrcode\.min\.js["\']\s*></script>',
                  '<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>',
                  html, flags=re.I)

              # Avoid a long fixed loading curtain. Allow the app to continue initializing in the background.
              exact = re.compile(r"setTimeout\(\(\) => \{\s*const l = document\.getElementById\('loading-overlay'\);\s*if \(l\) \{ l\.style\.opacity = '0'; l\.style\.pointerEvents = 'none'; setTimeout\(\(\)=> \{ l\.style\.display = 'none'; \}, 500\); \}\s*\}, 2500\);", re.S)
              html, n = exact.subn("setTimeout(() => {\n    const l = document.getElementById('loading-overlay');\n    if (l) { l.style.opacity = '0'; l.style.pointerEvents = 'none'; setTimeout(()=> { l.style.display = 'none'; }, 180); }\n}, 1100);", html)
              if n == 0:
                  html = re.sub(r'},\s*2500\);', '}, 1100);', html, count=3)

              index.write_text(html, encoding='utf-8')

          # Keep the standalone extracted boot script from holding the screen for 2.5 seconds.
          for p in [Path('script1.js')]:
              if p.exists():
                  js = p.read_text(encoding='utf-8')
                  js = re.sub(r'},\s*2500\);', '}, 1100);', js, count=3)
                  p.write_text(js, encoding='utf-8')

      - name: Commit optimization and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html script1.js .github/workflows/speed-up-miniapp.yml
          git rm -f .github/workflows/speed-up-miniapp.yml
          git commit -m "Speed up Mini App startup and disable startup ads" || exit 0
          git push
