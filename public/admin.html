<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Besh Super Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Chart.js for Real-Time Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --color-midnight: #0B0B2A;
            --color-neon-purple: #B026FF;
            --color-sunset-gold: #FFB347;
            --grad: linear-gradient(135deg, var(--color-midnight), var(--color-neon-purple));
            --bg: #F1F5F9;
            --card-bg: #ffffff;
            --text-dark: #1E293B;
            --border-color: #e2e8f0;
        }

        body.dark-mode {
            --bg: #0F172A;
            --card-bg: #1E293B;
            --text-dark: #F8FAFC;
            --border-color: #334155;
            --grad: linear-gradient(135deg, #020617, #1e1b4b);
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-dark); margin: 0; display: flex; height: 100vh; overflow: hidden; transition: background 0.3s, color 0.3s; }
        .sidebar { width: 250px; background: var(--grad); color: white; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        .sidebar h2 { margin-bottom: 30px; text-align: center; font-weight: 800; letter-spacing: 1px; }
        .nav-link { padding: 12px; margin-bottom: 5px; cursor: pointer; border-radius: 8px; transition: 0.2s; display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.2); }
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border-color); }
        h3 { border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 20px; color: var(--color-neon-purple); }
        label { display: block; margin-top: 10px; font-size: 0.9rem; font-weight: 600; color: inherit; opacity: 0.8; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-family: 'Plus Jakarta Sans'; background: transparent; color: inherit; }
        button { padding: 12px 20px; background: var(--color-neon-purple); color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: 600; font-family: 'Plus Jakarta Sans'; transition: transform 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        .btn-red { background: #EF4444; } .btn-green { background: #10B981; } .btn-warn { background: #F59E0B; color: white; }

        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: var(--bg); padding: 20px; border-radius: 12px; text-align: center; border: 1px solid var(--border-color); }
        .stat-num { font-size: 2rem; font-weight: 800; color: var(--color-neon-purple); }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { font-weight: 700; color: var(--color-neon-purple); }

        .hidden { display: none; }

        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--color-neon-purple); }
        input:checked + .slider:before { transform: translateX(26px); }

        /* Draggable List */
        .drag-list { list-style: none; padding: 0; }
        .drag-item { padding: 12px; margin-bottom: 8px; background: var(--bg); border: 1px solid var(--border-color); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: grab; }
        .drag-item:active { cursor: grabbing; }

        .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 12px 24px; border-radius: 8px; transform: translateY(100px); opacity: 0; transition: 0.3s; z-index: 1000; }
        .toast.show { transform: translateY(0); opacity: 1; }
    </script>
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <div class="nav-link active" onclick="nav('dashboard')"><i class="fa-solid fa-chart-line"></i> Dashboard</div>
        <div class="nav-link" onclick="nav('config')"><i class="fa-solid fa-sliders"></i> System Config</div>
        <div class="nav-link" onclick="nav('users')"><i class="fa-solid fa-users"></i> Users & Logs</div>
        <div class="nav-link" onclick="nav('tasks')"><i class="fa-solid fa-list-check"></i> Bonus Tasks</div>
        <div class="nav-link" onclick="nav('withdrawals')"><i class="fa-solid fa-money-bill-transfer"></i> Withdrawals</div>
        <div class="nav-link" onclick="nav('promo')"><i class="fa-solid fa-ticket"></i> Promo Codes</div>
        <div class="nav-link" onclick="nav('games')"><i class="fa-solid fa-gamepad"></i> Game Management</div>
        <div class="nav-link" onclick="nav('tools')"><i class="fa-solid fa-wrench"></i> Advanced Tools</div>

        <div style="margin-top: auto;">
            <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                <span style="font-size:0.9rem;">Dark Mode</span>
                <label class="switch"><input type="checkbox" id="themeToggle" onchange="toggleAdminTheme()"><span class="slider"></span></label>
            </label>
        </div>
    </div>

    <div class="main">
        <div class="card" style="background: rgba(176, 38, 255, 0.1); border-color: var(--color-neon-purple);">
            <label style="margin:0; color:var(--color-neon-purple);">🔑 Admin Password</label>
            <input type="password" id="adminSecret" placeholder="Enter password to authenticate actions...">
        </div>

        <!-- DASHBOARD (Chart.js & Analytics) -->
        <div id="dashboard" class="page">
            <div class="card">
                <h2>Real-Time Overview</h2>
                <div class="stat-grid">
                    <div class="stat-card"><div class="stat-num" id="statUsers">-</div><div>Total Users</div></div>
                    <div class="stat-card"><div class="stat-num" id="statOnline">-</div><div>Online (5m)</div></div>
                    <div class="stat-card"><div class="stat-num" id="statWith">-</div><div>Pending Payouts</div></div>
                    <div class="stat-card"><div class="stat-num" id="statPoints">-</div><div>Points Issued</div></div>
                </div>

                <!-- Chart.js Canvas -->
                <div style="height: 300px; width: 100%; margin-top: 20px;">
                    <canvas id="growthChart"></canvas>
                </div>

                <div style="margin-top:20px; display:flex; gap:10px;">
                    <button onclick="loadStats()"><i class="fa-solid fa-rotate-right"></i> Refresh Stats</button>
                    <button class="btn-warn" onclick="calculateRevenue()"><i class="fa-solid fa-calculator"></i> Est. Revenue</button>
                </div>
                <div id="revEstimate" style="margin-top:10px; font-weight:bold; color:var(--success-color); display:none;"></div>
            </div>

            <div class="card">
                <h3>Top Referrers</h3>
                <div class="table-wrap">
                    <table id="topRefsTable">
                        <thead><tr><th>Rank</th><th>Username</th><th>Invites</th><th>Action</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- CONFIGURATION -->
        <div id="config" class="page hidden">
            <div class="card">
                <h2>System Configuration</h2>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:15px;">
                    <div style="padding:15px; background:var(--bg); border-radius:8px;">
                        <label style="display:flex; justify-content:space-between; align-items:center;">
                            Maintenance Mode <label class="switch"><input type="checkbox" id="cfgMaint"><span class="slider"></span></label>
                        </label>
                    </div>
                    <div style="padding:15px; background:rgba(245, 158, 11, 0.1); border-radius:8px;">
                        <label style="display:flex; justify-content:space-between; align-items:center; color:#F59E0B;">
                            2X Global Multiplier <label class="switch"><input type="checkbox" id="cfgMult"><span class="slider"></span></label>
                        </label>
                    </div>
                </div>

                <h3>Economy & Rewards</h3>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                    <div><label>Currency Name</label><input type="text" id="cfgCurr"></div>
                    <div><label>Auto-Approve Withdrawals Under</label><input type="number" id="cfgAutoApprove" placeholder="0 = Disabled"></div>
                    <div><label>Ads Per Day</label><input type="number" id="cfgAds"></div>
                    <div><label>Reward per Ad</label><input type="number" id="cfgPts"></div>
                    <div><label>Referrer Bonus (Inviter)</label><input type="number" id="cfgRef1"></div>
                    <div><label>Referee Bonus (New User)</label><input type="number" id="cfgRef2"></div>
                    <div><label>Exchange Rate (Gems = 1 Unit)</label><input type="number" id="cfgExchangeRate"></div>
                </div>

                <h3>Withdrawal Requirements</h3>
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:15px;">
                    <div><label>Min Amount</label><input type="number" id="cfgMin"></div>
                    <div><label>Req Referrals</label><input type="number" id="cfgReqRef"></div>
                    <div><label>Req Ads</label><input type="number" id="cfgReqAds"></div>
                </div>

                <h3>Bot & App Links</h3>
                <label>Admin Chat ID (For Notifications)</label><input type="text" id="cfgChatId">
                <label>Bot Link (t.me/your_bot)</label><input type="text" id="cfgBot">

                <button onclick="saveFullConfig()" class="btn-green" style="width:100%;"><i class="fa-solid fa-save"></i> Save All Settings</button>
            </div>
        </div>

        <!-- USERS & LOGS -->
        <div id="users" class="page hidden">
            <div class="card">
                <h2>User Management</h2>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="findId" placeholder="Search by ID, Username, Phone, or Wallet...">
                    <button onclick="findUser()"><i class="fa-solid fa-search"></i> Search</button>
                    <button class="btn-warn" onclick="exportCSV('users')"><i class="fa-solid fa-file-csv"></i> Export Users</button>
                </div>

                <div id="userResult" style="margin-top:20px; padding:20px; background:var(--bg); border-radius:8px; display:none; border:1px solid var(--border-color);">
                    <div style="display:flex; justify-content:space-between;">
                        <h3 id="uName" style="margin-top:0;"></h3>
                        <span id="uStatus" class="badge"></span>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px; font-size:0.9rem;">
                        <div><b>ID:</b> <span id="uIdDisp"></span></div>
                        <div><b>Points:</b> <span id="uPoints"></span></div>
                        <div><b>Joined:</b> <span id="uJoined"></span></div>
                        <div><b>Invites:</b> <span id="uRefs"></span></div>
                    </div>

                    <h4>Activity Log (Last 5 actions)</h4>
                    <ul id="uLogs" style="font-size:0.8rem; color:#666;"></ul>

                    <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">
                        <input type="number" id="newBal" placeholder="New Balance" style="width:120px;">
                        <button class="btn-green" onclick="act('update-balance')">Update Balance</button>
                        <button class="btn-warn" onclick="act('reset-ads')">Reset Daily Ads</button>
                        <button class="btn-red" onclick="act('toggle-ban')" id="banBtnTxt">Ban User</button>
                        <button style="background:#2AABEE;" onclick="sendTelegramInvoice()"><i class="fa-brands fa-telegram"></i> Send Invoice</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Bulk Actions</h3>
                <p style="font-size:0.9rem; color:#666;">Select multiple user IDs to ban them simultaneously.</p>
                <textarea id="bulkIds" rows="3" placeholder="Paste User IDs separated by commas..."></textarea>
                <button class="btn-red" onclick="bulkBan()"><i class="fa-solid fa-gavel"></i> Bulk Ban</button>
            </div>
        </div>

        <!-- TASKS -->
        <div id="tasks" class="page hidden">
            <div class="card">
                <h2>Manage Bonus Tasks</h2>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <input type="hidden" id="taskId">
                    <input type="text" id="tName" placeholder="Task Name">
                    <input type="number" id="tRew" placeholder="Reward Amount">
                    <input type="text" id="tChan" placeholder="Channel ID (-100...)">
                    <input type="text" id="tLink" placeholder="Invite Link">
                    <input type="text" id="tIcon" placeholder="Icon Class (e.g., fa-brands fa-telegram)">
                </div>
                <div style="display:flex; gap:10px;">
                    <button onclick="addTask()" id="addBtn" class="btn-green">Add Task</button>
                    <button onclick="cancelEdit()" class="btn-warn" style="display:none;" id="cancelBtn">Cancel</button>
                </div>
            </div>
             <div class="card">
                <h3>Active Tasks (Drag to reorder)</h3>
                <ul id="taskList" class="drag-list"></ul>
                <button onclick="saveTaskOrder()" style="display:none;" id="saveOrderBtn">Save Order</button>
             </div>
        </div>

        <!-- WITHDRAWALS -->
        <div id="withdrawals" class="page hidden">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2>Pending Withdrawals</h2>
                    <div>
                        <button onclick="loadWithdrawals()"><i class="fa-solid fa-rotate"></i> Load</button>
                        <button class="btn-warn" onclick="exportCSV('withdrawals')"><i class="fa-solid fa-file-csv"></i> Export</button>
                    </div>
                </div>
                <div class="table-wrap">
                    <table id="withTable">
                        <thead><tr><th>Date</th><th>User</th><th>Amount</th><th>Method</th><th>Account</th><th>Action</th></tr></thead>
                        <tbody id="withList"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- PROMO CODES -->
        <div id="promo" class="page hidden">
            <div class="card">
                <h2>Generate Promo Code</h2>
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
                    <div><label>Code</label><input type="text" id="pCode" placeholder="e.g. WELCOME100"></div>
                    <div><label>Reward</label><input type="number" id="pRew" placeholder="Amount"></div>
                    <div><label>Usage Limit</label><input type="number" id="pLimit" placeholder="Max uses (0=unlimited)"></div>
                </div>
                <button onclick="createPromo()" class="btn-green">Create Code</button>
            </div>
            <div class="card">
                <h3>Active Promos</h3>
                <div class="table-wrap">
                    <table id="promoTable">
                        <thead><tr><th>Code</th><th>Reward</th><th>Uses</th><th>Limit</th><th>Action</th></tr></thead>
                        <tbody id="promoList"></tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- ADVANCED TOOLS -->
        <div id="games" class="page hidden">
            <div class="card">
                <h3><i class="fa-solid fa-gear"></i> Game Economy & Rigging Controls</h3>
                
                <div style="margin-top:20px;">
                    <label>Aviator Max Crash Threshold (e.g., 85% fail before this value)</label>
                    <input type="number" id="adminAviatorCrash" placeholder="e.g. 2.00">
                </div>

                <div style="margin-top:20px;">
                    <label>Pro Spin Wheel (75% Fixed Reward)</label>
                    <input type="text" id="adminSpinReward" placeholder="e.g. 10 Gems">
                </div>

                <button onclick="saveGameOdds()">Save Game Odds</button>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-puzzle-piece"></i> Daily Combo Setter</h3>
                <label>Set today's correct SVG IDs (comma separated, e.g. c1,c2,c3)</label>
                <input type="text" id="adminComboOrder" placeholder="c1,c2,c3">
                
                <label>Combo Reward (Gems)</label>
                <input type="number" id="adminComboReward" placeholder="50">

                <button onclick="saveCombo()">Set Daily Combo</button>
            </div>
        </div>

        <div id="tools" class="page hidden">
            <div class="card">
                <h2>📢 Global Broadcast</h2>
                <label>Target</label><select id="bcType" onchange="toggleBcTarget()"><option value="all">All Users</option><option value="single">Specific User/Group</option></select>
                <div id="bcTargetDiv" style="display:none;"><label>Target ID</label><input type="text" id="bcTargetId"></div>

                <label>Broadcast Type</label><select id="bcStyle"><option value="bot">Bot Message</option><option value="toast">In-App Toast Notification</option></select>

                <label>Message / HTML</label><textarea id="bcMsg" rows="4"></textarea>
                <div id="bcExtras">
                    <label>Image URL (Optional for Bot)</label><input type="text" id="bcImg">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"><div><label>Btn Text</label><input type="text" id="bcBtnTxt"></div><div><label>Btn Link</label><input type="text" id="bcBtnUrl"></div></div>
                </div>
                <button onclick="act('broadcast')" class="btn-green"><i class="fa-solid fa-paper-plane"></i> Send Broadcast</button>
            </div>

            <div class="card">
                <h2><i class="fa-solid fa-code"></i> Live CSS Injector</h2>
                <p style="font-size:0.9rem; color:#666;">Write CSS here to instantly change the live app's appearance without redeploying.</p>
                <textarea id="customCss" rows="6" placeholder=".home-header { background: red !important; }"></textarea>
                <button onclick="saveCustomCss()" class="btn-warn">Inject CSS</button>
            </div>

            <div class="card">
                <h2><i class="fa-solid fa-database"></i> Database Backup</h2>
                <button onclick="backupDB()"><i class="fa-solid fa-download"></i> Download Full Database JSON</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API = '';
        let editingTaskId = null;
        let chartInstance = null;

        // --- THEME ---
        function toggleAdminTheme() {
            const toggle = document.getElementById('themeToggle');
            if(!toggle) return;
            const isDark = toggle.checked;
            if(isDark) document.body.classList.add('dark-mode');
            else document.body.classList.remove('dark-mode');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            nav('dashboard');
            try {
                const res = await fetch(`${API}/api/config`);
                fillConfigInputs(await res.json());
            } catch {}
        });

        function nav(p) {
            document.querySelectorAll('.page').forEach(x => x.classList.add('hidden'));
            document.getElementById(p).classList.remove('hidden');
            document.querySelectorAll('.nav-link').forEach(x => x.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if(p==='dashboard') loadStats();
            if(p==='tasks') loadTasks();
            if(p==='withdrawals') loadWithdrawals();
            if(p==='promo') loadPromos();
        }

        async function post(endpoint, data) {
            data.secret = document.getElementById('adminSecret').value;
            if(!data.secret) { showToast("Please enter Admin Password!"); return {error:"No auth"}; }
            try {
                const res = await fetch(`${API}/api/admin/${endpoint}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
                return await res.json();
            } catch(e) { return {error: e.message}; }
        }

        // --- DASHBOARD & CHART ---
        async function loadStats() {
            const data = await post('stats', {});
            if(data.error) return;

            document.getElementById('statUsers').innerText = data.users;
            document.getElementById('statWith').innerText = data.withdrawals;
            document.getElementById('statPoints').innerText = data.points;
            document.getElementById('statOnline').innerText = data.online || 0;

            if(data.config) fillConfigInputs(data.config);

            // Render Chart
            renderChart(data.chartData || {labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], data:[0,0,0,0,0,0,0]});

            // Top Refs
            const tbody = document.querySelector('#topRefsTable tbody');
            tbody.innerHTML = (data.topRefs || []).map((u,i) => `<tr><td>#${i+1}</td><td>${u.username}</td><td>${u.refs}</td><td><button style="padding:4px 8px; margin:0;" onclick="inspectUser('${u.id}')">View</button></td></tr>`).join('') || '<tr><td colspan="4">No data</td></tr>';
        }

        function renderChart(chartData) {
            const ctx = document.getElementById('growthChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: [{
                        label: 'New Users',
                        data: chartData.data,
                        borderColor: '#B026FF',
                        backgroundColor: 'rgba(176, 38, 255, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function calculateRevenue() {
            const pts = +document.getElementById('statPoints').innerText;
            const ptsPerAd = +document.getElementById('cfgPts').value || 50;
            const adsWatched = pts / ptsPerAd;
            const cpm = 0.5; // Example $0.50 per 1000 impressions
            const est = (adsWatched / 1000) * cpm;
            const el = document.getElementById('revEstimate');
            el.innerText = `Estimated Ad Revenue: $${est.toFixed(2)}`;
            el.style.display = 'block';
        }

        // --- CONFIGURATION ---
        function fillConfigInputs(c) {
            document.getElementById('cfgCurr').value = c.currencyName || 'Points';
            document.getElementById('cfgAds').value = c.adsPerDay||0;
            document.getElementById('cfgPts').value = c.pointsPerAd||0;
            document.getElementById('cfgMin').value = c.minWithdraw||0;
            document.getElementById('cfgRef1').value = c.referralBonusReferrer||0;
            document.getElementById('cfgRef2').value = c.referralBonusReferee||0;
            document.getElementById('cfgReqRef').value = c.requiredReferrals||0;
            document.getElementById('cfgReqAds').value = c.requiredAds||0;
            document.getElementById('cfgChatId').value = c.telegramChatId||'';
            document.getElementById('cfgBot').value = c.botLink||'';
            document.getElementById('cfgAutoApprove').value = c.autoApproveLimit||0;
            document.getElementById('cfgExchangeRate').value = c.exchangeRate || 100;

            document.getElementById('cfgMaint').checked = !!c.maintenanceMode;
            document.getElementById('cfgMult').checked = (c.globalMultiplier === 2);

            if(c.customCss) document.getElementById('customCss').value = c.customCss;
        }

        async function saveFullConfig() {
            const newConfig = {
                currencyName: document.getElementById('cfgCurr').value,
                adsPerDay: +document.getElementById('cfgAds').value,
                pointsPerAd: +document.getElementById('cfgPts').value,
                minWithdraw: +document.getElementById('cfgMin').value,
                referralBonusReferrer: +document.getElementById('cfgRef1').value,
                referralBonusReferee: +document.getElementById('cfgRef2').value,
                requiredReferrals: +document.getElementById('cfgReqRef').value,
                requiredAds: +document.getElementById('cfgReqAds').value,
                telegramChatId: document.getElementById('cfgChatId').value,
                botLink: document.getElementById('cfgBot').value,
                autoApproveLimit: +document.getElementById('cfgAutoApprove').value,
                exchangeRate: +document.getElementById('cfgExchangeRate').value,
                maintenanceMode: document.getElementById('cfgMaint').checked,
                globalMultiplier: document.getElementById('cfgMult').checked ? 2 : 1
            };
            const res = await post('config-update', { fullConfig: newConfig });
            showToast(res.success ? "Settings Saved!" : "Error Saving");
        }

        // --- USERS & ACTIONS ---
        function inspectUser(id) { document.getElementById('findId').value = id; nav('users'); findUser(); }

        async function findUser() {
            const res = await post('find-user', {query: document.getElementById('findId').value});
            if(res && !res.error) {
                document.getElementById('userResult').style.display='block';
                document.getElementById('uName').innerText = res.username;
                document.getElementById('uIdDisp').innerText = res.id;
                document.getElementById('uPoints').innerText = res.points;
                document.getElementById('newBal').value = res.points;
                document.getElementById('uRefs').innerText = res.referredUsers?.length || 0;
                document.getElementById('uJoined').innerText = new Date(res.createdAt).toLocaleDateString();

                const s = document.getElementById('uStatus');
                if(res.isBanned) { s.innerText = "BANNED"; s.className = "badge btn-red"; document.getElementById('banBtnTxt').innerText = "Unban User"; }
                else { s.innerText = "ACTIVE"; s.className = "badge btn-green"; document.getElementById('banBtnTxt').innerText = "Ban User"; }

                document.getElementById('uLogs').innerHTML = (res.logs||[]).slice(-5).map(l => `<li>${l}</li>`).join('') || "<li>No recent activity</li>";
            } else showToast("User not found");
        }

        async function act(action) {
            let body = { query: document.getElementById('findId').value, action };
            if(action === 'update-balance') body.newBalance = document.getElementById('newBal').value;

            if(action === 'broadcast') {
                body.targetType = document.getElementById('bcType').value;
                body.targetId = document.getElementById('bcTargetId').value;
                body.style = document.getElementById('bcStyle').value; // 'bot' or 'toast'
                body.message = document.getElementById('bcMsg').value;
                body.photoUrl = document.getElementById('bcImg').value;
                body.btnText = document.getElementById('bcBtnTxt').value;
                body.btnUrl = document.getElementById('bcBtnUrl').value;
            }
            const res = await post('action', body);
            showToast(res.success ? "Action Successful" : "Failed");
            if(action==='toggle-ban' || action==='update-balance') findUser();
        }

        async function bulkBan() {
            const ids = document.getElementById('bulkIds').value.split(',').map(i=>i.trim()).filter(i=>i);
            if(ids.length===0) return;
            const res = await post('bulk-ban', {ids});
            showToast(res.success ? `Banned ${res.count} users` : "Error");
            document.getElementById('bulkIds').value = '';
        }

        function sendTelegramInvoice() {
            showToast("Invoice feature requires Telegram Stars integration logic setup.");
        }

        function toggleBcTarget() { document.getElementById('bcTargetDiv').style.display = document.getElementById('bcType').value === 'single' ? 'block' : 'none'; }

        document.getElementById('bcStyle').addEventListener('change', function() {
            document.getElementById('bcExtras').style.display = this.value === 'bot' ? 'block' : 'none';
        });

        // --- TASKS (Drag & Drop Reorder) ---
        let tasksArray = [];
        async function addTask() {
            const task = {
                id: editingTaskId,
                name: document.getElementById('tName').value,
                reward: +document.getElementById('tRew').value,
                channelId: document.getElementById('tChan').value,
                link: document.getElementById('tLink').value,
                icon: document.getElementById('tIcon').value
            };
            await post('tasks', { task }); 
            showToast(editingTaskId ? "Task Updated" : "Task Added");
            cancelEdit(); loadTasks();
        }

        function startEdit(id, name, rew, chan, link, icon) {
            editingTaskId = id;
            document.getElementById('tName').value = name;
            document.getElementById('tRew').value = rew;
            document.getElementById('tChan').value = chan;
            document.getElementById('tLink').value = link;
            document.getElementById('tIcon').value = icon;
            document.getElementById('addBtn').innerHTML = "<i class='fa-solid fa-save'></i> Update Task";
            document.getElementById('cancelBtn').style.display = "inline-block";
        }

        function cancelEdit() {
            editingTaskId = null;
            ['tName','tRew','tChan','tLink','tIcon'].forEach(i => document.getElementById(i).value = '');
            document.getElementById('addBtn').innerHTML = "Add Task";
            document.getElementById('cancelBtn').style.display = "none";
        }

        async function loadTasks() {
            const res = await post('get-tasks', {});
            if(res.error) return;
            tasksArray = Object.values(res).sort((a,b)=>(a.order||0)-(b.order||0));

            const list = document.getElementById('taskList');
            list.innerHTML = tasksArray.map((t, index) => `
                <li class="drag-item" draggable="true" data-index="${index}" data-id="${t.id}">
                    <div><i class="fa-solid fa-grip-vertical" style="color:#ccc; margin-right:10px; cursor:grab;"></i> <b>${t.name}</b> (${t.reward})</div>
                    <div>
                        <button style="padding:4px 8px; margin:0;" class="btn-warn" onclick="startEdit('${t.id}','${t.name}',${t.reward},'${t.channelId}','${t.link}','${t.icon}')"><i class="fa-solid fa-pen"></i></button>
                        <button style="padding:4px 8px; margin:0;" class="btn-red" onclick="delTask('${t.id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </li>`).join('');

            setupDragAndDrop();
        }
        async function delTask(id) { await post('tasks/delete', { taskId: id }); loadTasks(); }

        let draggedItem = null;
        function setupDragAndDrop() {
            const items = document.querySelectorAll('.drag-item');
            items.forEach(item => {
                item.addEventListener('dragstart', function() { draggedItem = this; setTimeout(() => this.style.display = 'none', 0); });
                item.addEventListener('dragend', function() { draggedItem = null; this.style.display = 'flex'; document.getElementById('saveOrderBtn').style.display = 'block'; });
                item.addEventListener('dragover', e => e.preventDefault());
                item.addEventListener('dragenter', function(e) { e.preventDefault(); this.style.transform = 'scale(1.02)'; });
                item.addEventListener('dragleave', function() { this.style.transform = 'scale(1)'; });
                item.addEventListener('drop', function() {
                    this.style.transform = 'scale(1)';
                    if(this !== draggedItem) {
                        let list = document.getElementById('taskList');
                        let all = [...list.querySelectorAll('.drag-item')];
                        let draggedIdx = all.indexOf(draggedItem);
                        let droppedIdx = all.indexOf(this);
                        if(draggedIdx < droppedIdx) this.parentNode.insertBefore(draggedItem, this.nextSibling);
                        else this.parentNode.insertBefore(draggedItem, this);
                    }
                });
            });
        }

        async function saveTaskOrder() {
            const orderedIds = [...document.querySelectorAll('.drag-item')].map(el => el.getAttribute('data-id'));
            const res = await post('tasks/reorder', { orderedIds });
            showToast(res.success ? "Order saved!" : "Error saving order");
            document.getElementById('saveOrderBtn').style.display = 'none';
        }

        // --- WITHDRAWALS & EXPORT ---
        async function loadWithdrawals() {
            const list = await post('get-withdrawals', {});
            if(list.error) return;
            document.getElementById('withList').innerHTML = list.map(w => `
                <tr>
                    <td>${new Date(w.date).toLocaleDateString()}</td>
                    <td><a href="#" onclick="inspectUser('${w.userId}')">${w.userId}</a></td>
                    <td><b>${w.amount}</b></td>
                    <td>${w.method}</td>
                    <td>${w.accountName}<br><small>${w.account}</small></td>
                    <td>
                        <button class="btn-green" style="padding:4px 8px; margin:0;" onclick="wAction('${w.id}', 'approve')"><i class="fa-solid fa-check"></i></button>
                        <button class="btn-red" style="padding:4px 8px; margin:0;" onclick="wAction('${w.id}', 'reject')"><i class="fa-solid fa-xmark"></i></button>
                    </td>
                </tr>`).join('') || '<tr><td colspan="6">No pending requests.</td></tr>';
        }
        async function wAction(wid, type) { await post('withdraw-action', { id: wid, type }); loadWithdrawals(); }

        async function exportCSV(type) {
            const res = await post('export-csv', { type });
            if(res.error) return showToast(res.error);

            // Trigger download
            const blob = new Blob([res.csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `${type}_export_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // --- PROMO CODES ---
        async function createPromo() {
            const p = {
                code: document.getElementById('pCode').value,
                reward: +document.getElementById('pRew').value,
                limit: +document.getElementById('pLimit').value
            };
            await post('promo/create', p);
            loadPromos();
        }

        async function loadPromos() {
            const res = await post('promo/list', {});
            if(res.error) return;
            document.getElementById('promoList').innerHTML = res.map(p => `
                <tr>
                    <td><b>${p.code}</b></td><td>${p.reward}</td><td>${p.uses||0}</td><td>${p.limit===0?'∞':p.limit}</td>
                    <td><button class="btn-red" style="padding:4px 8px; margin:0;" onclick="delPromo('${p.code}')"><i class="fa-solid fa-trash"></i></button></td>
                </tr>`).join('');
        }
        async function delPromo(code) { await post('promo/delete', { code }); loadPromos(); }

        // --- ADVANCED ---
        async function saveCustomCss() {
            const css = document.getElementById('customCss').value;
            const res = await post('config-update', { partial: { customCss: css }});
            showToast(res.success ? "CSS Injected Successfully" : "Error");
        }

        async function backupDB() {
            const res = await post('backup-db', {});
            if(res.error) return showToast(res.error);

            const blob = new Blob([JSON.stringify(res.db, null, 2)], { type: 'application/json' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_${Date.now()}.json`;
            a.click();
        }
    </script>
</body>
</html><script>
    async function saveGameOdds() {
        const aviatorCrash = parseFloat(document.getElementById('adminAviatorCrash').value);
        const spinReward = document.getElementById('adminSpinReward').value;
        if(!aviatorCrash || !spinReward) return alert("Fill all fields");
        
        await fetch('/api/admin/odds', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ secret: getSecret(), aviatorCrash, spinReward })
        });
        alert('Game odds updated');
    }

    async function saveCombo() {
        const comboStr = document.getElementById('adminComboOrder').value;
        const reward = parseInt(document.getElementById('adminComboReward').value);
        if(!comboStr || !reward) return alert("Fill all fields");
        
        const combination = comboStr.split(',').map(s => s.trim());
        await fetch('/api/admin/combo-set', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ secret: getSecret(), combination, reward })
        });
        alert('Daily Combo updated');
    }
</script>
