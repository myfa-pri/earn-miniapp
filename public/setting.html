<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>MYFA BIRR Campaign Manager</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>html,body{margin:0;height:100%;background:#06111f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:grid;place-items:center}.loader{text-align:center;opacity:.85}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#00f2fe;margin:0 3px;animation:b 1s infinite}.dot:nth-child(2){animation-delay:.12s}.dot:nth-child(3){animation-delay:.24s}@keyframes b{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-7px);opacity:1}}</style>
</head>
<body>
  <div class="loader"><div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><p>Opening MYFA Campaign Manager…</p></div>
  <script>
    (() => {
      const q = new URLSearchParams(location.search);
      const tg = window.Telegram?.WebApp;
      const id = tg?.initDataUnsafe?.user?.id || q.get('userId') || '';
      const target = '/ad-studio-pro.html' + (id ? '?userId=' + encodeURIComponent(id) : '');
      location.replace(target);
    })();
  </script>
</body>
</html>
