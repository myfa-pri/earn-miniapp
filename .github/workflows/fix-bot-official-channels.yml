name: Fix Bot Webhook and Official Channel Posts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          # 1) Make the bot token runtime-configurable. Never keep the token in source.
          for name in ('api/index.js', 'api/index-cloudflare.js'):
              p = root / name
              code = p.read_text(encoding='utf-8')
              code = re.sub(
                  r"const BOT_TOKEN = ['\"][^'\"]*['\"];",
                  "const BOT_TOKEN = process.env.TELEGRAM_BOT_TOKEN || process.env.BOT_TOKEN || '';\nconst BOT_TOKEN_CONFIGURED = Boolean(BOT_TOKEN);",
                  code,
                  count=1,
              )
              code = code.replace(
                  "const bot = new TelegramBot(BOT_TOKEN, { polling: false });",
                  "const bot = new TelegramBot(BOT_TOKEN || '000000000:INVALID', { polling: false });",
                  1,
              )

              # Cloudflare/Express must parse Telegram's JSON webhook body.
              if "app.use(express.json({ limit: '2mb' }));" not in code:
                  code = code.replace(
                      "const app = express();",
                      "const app = express();\napp.use(express.json({ limit: '2mb' }));",
                      1,
                  )

              # Use the actual deployed app origin when /api/setup is called.
              old_setup = "        const host = req.headers.host;\n        const webhookUrl = `https://${host}/api/webhook`;\n        const telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/setWebhook?url=${encodeURIComponent(webhookUrl)}`;"
              new_setup = "        if (!BOT_TOKEN_CONFIGURED) return res.status(500).json({ success: false, error: 'TELEGRAM_BOT_TOKEN is not configured on this Worker.' });\n        const host = req.headers.host;\n        const configuredBase = (process.env.PUBLIC_APP_URL || `https://${host}`).replace(/\\/+$/, '');\n        const webhookUrl = `${configuredBase}/api/webhook`;\n        const telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/setWebhook?url=${encodeURIComponent(webhookUrl)}`;"
              if old_setup in code:
                  code = code.replace(old_setup, new_setup, 1)

              # Add a safe Telegram diagnostic endpoint without exposing the token.
              if "app.get('/api/bot-status'" not in code:
                  marker = "app.post('/api/webhook', async (req, res) => {"
                  diagnostic = r'''app.get('/api/bot-status', async (req, res) => {
+    res.set('Cache-Control', 'no-store, no-cache, must-revalidate, proxy-revalidate');
+    if (!BOT_TOKEN_CONFIGURED) return res.status(500).json({ configured:false, error:'TELEGRAM_BOT_TOKEN is not configured on this Worker.' });
+    try {
+        const [meResponse, webhookResponse] = await Promise.all([
+            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getMe`),
+            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo`)
+        ]);
+        const me = await meResponse.json();
+        const webhook = await webhookResponse.json();
+        return res.json({
+            configured: true,
+            bot: me.ok ? { id: me.result.id, username: me.result.username, first_name: me.result.first_name } : { error: me.description || 'getMe failed' },
+            webhook: webhook.ok ? {
+                url: webhook.result.url,
+                pending_update_count: webhook.result.pending_update_count,
+                last_error_date: webhook.result.last_error_date || null,
+                last_error_message: webhook.result.last_error_message || null
+            } : { error: webhook.description || 'getWebhookInfo failed' }
+        });
+    } catch (e) {
+        return res.status(500).json({ configured:true, error:e.message || 'Telegram diagnostics failed' });
+    }
+});
+
+'''
+                  code = code.replace(marker, diagnostic + marker, 1)
+
+              p.write_text(code, encoding='utf-8')
+
+          # 2) /myfa.html must also receive the Official Channel Posts + Channels admin script.
+          worker = root / 'worker.js'
+          w = worker.read_text(encoding='utf-8')
+          w = w.replace(
+              'if (pathname === "/myfa") {',
+              'if (pathname === "/myfa" || pathname === "/myfa.html") {',
+              1,
+          )
+          worker.write_text(w, encoding='utf-8')
+
+          # 3) Explicitly enable populated process.env for Worker secrets.
+          wr = root / 'wrangler.jsonc'
+          text = wr.read_text(encoding='utf-8')
+          if 'nodejs_compat_populate_process_env' not in text:
+              text = text.replace(
+                  '"compatibility_flags": ["nodejs_compat"]',
+                  '"compatibility_flags": ["nodejs_compat", "nodejs_compat_populate_process_env"]',
+                  1,
+              )
+          wr.write_text(text, encoding='utf-8')
+
+          # 4) Make the current source adapter mirror the same runtime-token behavior immediately;
+          # the normal Cloudflare prepare workflow will regenerate it again from api/index.js.
+          source = (root / 'api/index.js').read_text(encoding='utf-8')
+          target = (root / 'api/index-cloudflare.js').read_text(encoding='utf-8')
+          if source != target:
+              # Preserve Cloudflare's export at the end and JSON middleware.
+              export_match = re.search(r'export default app;\\s*$', target)
+              generated = source
+              if "app.use(express.json({ limit: '2mb' }));" not in generated:
+                  generated = generated.replace("const app = express();", "const app = express();\\napp.use(express.json({ limit: '2mb' }));", 1)
+              if not generated.rstrip().endswith('export default app;'):
+                  generated = generated.rstrip() + '\\n\\nexport default app;\\n'
+              (root / 'api/index-cloudflare.js').write_text(generated, encoding='utf-8')
+
+      - name: Commit fixes and remove this helper workflow
+        shell: bash
+        run: |
+          git config user.name "github-actions[bot]"
+          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
+          git add api/index.js api/index-cloudflare.js worker.js wrangler.jsonc .github/workflows/fix-bot-official-channels.yml
+          git rm -f .github/workflows/fix-bot-official-channels.yml
+          git commit -m "Fix Telegram bot webhook and official channel posts"
+          git push
