name: Restore MYFA Admin Panel

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore full legacy admin and ensure posts panel loads
        shell: bash
        run: |
          cp public/admin-live.html public/myfa.html
          python - <<'PY'
          from pathlib import Path
          p = Path('public/myfa.html')
          html = p.read_text(encoding='utf-8')
          tag = '<script src="/official-channel-admin-upgrade.js?v=20260909"></script>'
          html = html.replace(tag, '')
          html = html.replace('</body>', tag + '</body>')
          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit restored admin page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/myfa.html
          git commit -m "Restore full MYFA admin with official posts" || exit 0
          git push
