name: Ledger accounting fix
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch script
        run: python3 -m py_compile scripts/ledger_final_patch.py
      - name: Apply final ledger, ad, task and manager fixes
        run: python3 scripts/ledger_final_patch.py
      - name: Validate production JavaScript
        run: node --check api/index.js && node --check api/ads.js && node --check public/campaign-manager-app.js
      - name: Validate production wiring
        run: |
          grep -q 'campaign-manager-app.js?v=20260909-10' public/ad-studio-pro.html
          grep -q 'data-action="${c.status=='"'"'paused'"'"'?"'"'resume'"'"':"'"'pause'"'"'}"' public/campaign-manager-app.js
          ! grep -q "feature(25,'Conversion tracking'" public/campaign-manager-app.js
      - name: Commit production changes and remove one-time workflow
        run: |
          git config user.name "MYFA BIRR Bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/index.js api/ads.js public/campaign-manager-app.js public/ad-studio-pro.html
          git commit -m "fix: settle campaign escrow and repair manager controls"
          git rm .github/workflows/ledger-accounting-fix.yml
          git commit -m "chore: remove one-time ledger workflow"
          git push
