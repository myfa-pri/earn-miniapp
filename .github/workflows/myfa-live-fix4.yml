name: MYFA cleanup repair

on:
  push:
    paths:
      - '.github/workflows/myfa-live-fix4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe targeted fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Repair the accidental promo response regression from the first patch.
          p = Path('api/index.js')
          s = p.read_text()
          s = s.replace("res.json({ success: true, newBal: newBal, reward: reward, streakCount: streakCount, claimDate: today });",
                        "res.json({ success: true, newBal: newBal, reward: reward });")

          # Find the daily streak claim code by its distinctive guard, regardless of indentation.
          marker = "const lastLoginStr = user.lastLoginDate ? new Date(user.lastLoginDate).toISOString().split('T')[0] : null;"
          pos = s.find(marker)
          if pos >= 0:
              guard_end = pos + len(marker)
              # Replace the guard through the streak/reward declarations.
              tail_match = re.search(r"\n\s*if \(lastLoginStr === today\) \{[\s\S]*?\n\s*const reward = streakCount \* 50;", s[guard_end:])
              if not tail_match:
                  raise SystemExit('daily claim guard shape not found')
              start = guard_end + tail_match.start()
              end = guard_end + tail_match.end()
              replacement = """\n    const claimDate = user.streakClaimDate || null;\n    \n    if (claimDate === today) {\n        return res.json({ success: false, error: 'Streak already claimed today', alreadyClaimed: true, streakCount: Math.max(1, Number(user.streakCount || user.streak || 1)) });\n    }\n    \n    const streakCount = Math.min(7, Math.max(1, Number(user.streakCount || user.streak || 1)));\n    const reward = streakCount * 50;"""
              s = s[:start] + replacement + s[end:]

              # Patch the user update immediately following this claim's reward calculation.
              claim_end = s.find("});", end)
              update_start = s.find("await dbUpdate(`users/${userId}`, {", end, claim_end if claim_end >= 0 else len(s))
              if update_start >= 0:
                  update_end = s.find("});", update_start)
                  block = s[update_start:update_end]
                  block = re.sub(r"\n\s*lastLoginDate:\s*Date\.now\(\),?", "", block)
                  if "streakClaimDate" not in block:
                      if "points: newPoints," in block:
                          block = block.replace("points: newPoints,", "points: newPoints,\n        streakCount: streakCount,\n        streak: streakCount,\n        streakClaimDate: today,")
                      else:
                          block += "\n        streakCount: streakCount,\n        streak: streakCount,\n        streakClaimDate: today,"
                  s = s[:update_start] + block + s[update_end:]
                  response_pos = s.find("res.json({ success: true", update_end)
                  if response_pos >= 0:
                      response_end = s.find("});", response_pos)
                      if response_end >= 0 and "claimDate" not in s[response_pos:response_end]:
                          s = s[:response_pos] + s[response_pos:response_end].replace(
                              "res.json({ success: true, reward, newPoints });",
                              "res.json({ success: true, reward, newPoints, streakCount, claimDate: today });") + s[response_end:]

          # Fast gate cache on the hot profile endpoint.
          old_gate = "    // TASK 1: ALWAYS ON GATE CHECK\n    if (config.gateEnabled && config.officialChannels && config.officialChannels.length > 0) {"
          new_gate = "    // TASK 1: GATE CHECK (short TTL cache for fast page navigation)\n    if (config.gateEnabled && config.officialChannels && config.officialChannels.length > 0 && (!u.gateCheckedAt || now - Number(u.gateCheckedAt) > 60000)) {"
          if old_gate in s:
              s = s.replace(old_gate, new_gate, 1)
              s = s.replace("            u.isOfficialMember = true;\n        }\n    }", "            u.isOfficialMember = true;\n        }\n        u.gateCheckedAt = now;\n    }", 1)
              s = s.replace("            points: u.points, escrowYield: u.escrowYield, logs: u.logs", "            points: u.points, escrowYield: u.escrowYield, logs: u.logs, gateCheckedAt: u.gateCheckedAt", 1)
          p.write_text(s)

          # Client UI: real Telegram avatar first, server avatar fallback second.
          for name in ('public/index.html', 'script1.js'):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text()
              s = s.replace("const avatarUrl = window.Telegram.WebApp.initDataUnsafe?.user?.photo_url || currentUser.avatarUrl || `https://ui-avatars.com/api/?name=${currentUser.username}&background=00F2FE&color=fff`;",
                            "const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;\n            const avatarUrl = tgUser?.photo_url || currentUser.avatarUrl || `${window.location.origin}/api/avatar/${encodeURIComponent(userId)}`;")
              s = s.replace("const avatarUrl = window.Telegram.WebApp.initDataUnsafe?.user?.photo_url || (currentUser ? currentUser.avatarUrl : '') || `https://ui-avatars.com/api/?name=${currentUser ? currentUser.username : 'User'}&background=00F2FE&color=fff`;",
                            "const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;\n            const avatarUrl = tgUser?.photo_url || (currentUser && currentUser.avatarUrl) || `${window.location.origin}/api/avatar/${encodeURIComponent(typeof userId !== 'undefined' ? userId : '')}`;")
              # Remove the requested legacy leaderboard heading block, exact markup.
              s = re.sub(r'\s*<div style="text-align:center; padding: 20px 0;">\s*<h2><i class="fa-solid fa-trophy"[\s\S]*?</div>\s*</div>', '', s, count=1)
              s = s.replace("                void activePage.offsetWidth; // Force reflow\n", '')
              s = s.replace("let currentStreak = currentUser.streakCount || 0;", "let currentStreak = Math.max(Number(currentUser.streakCount || 0), Number(currentUser.streak || 0), 0);")
              # Avoid an artificial first-load delay if the exact 2500ms timeout exists.
              s = s.replace("}, 2500);", "}, 50);")
              p.write_text(s)
          PY
      - name: Validate
        run: node --check api/index.js
      - name: Commit and clean helper workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/myfa-live-fix2.yml .github/workflows/myfa-live-fix3.yml
          git add api/index.js public/index.html script1.js .github/workflows/myfa-live-fix2.yml .github/workflows/myfa-live-fix3.yml
          git commit -m "fix: finalize streak avatar leaderboard and speed fixes"
          git push
      - name: Remove this helper
        if: success()
        run: |
          git rm .github/workflows/myfa-live-fix4.yml
          git commit -m "chore: remove cleanup workflow"
          git push
