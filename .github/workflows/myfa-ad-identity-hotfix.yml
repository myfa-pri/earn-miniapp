name: MYFA ad identity hotfix
on:
  push:
    paths:
      - '.github/workflows/myfa-ad-identity-hotfix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ad identity and verify JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/index.js')
          s=p.read_text()
          old="const { userId, network } = req.body;"
          new="const body = req.body || {};\n    const userId = String(body.userId || req.headers['x-telegram-user-id'] || req.query.userId || '');\n    const network = String(body.network || 'monetag');"
          if old in s: s=s.replace(old,new,1)
          old="const userId = req.query.userId;"
          new="const userId = String(req.query.userId || req.headers['x-telegram-user-id'] || '');"
          marker="app.get('/api/myfa-ads/get'"
          a=s.find(marker); b=s.find('\n});',a)
          seg=s[a:b] if a>=0 else ''
          if old in seg:
              seg=seg.replace(old,new,1); s=s[:a]+seg+s[b:]
          old="const { userId, campaignId } = req.body;"
          new="const body = req.body || {};\n    const userId = String(body.userId || req.headers['x-telegram-user-id'] || req.query.userId || '');\n    const campaignId = body.campaignId;"
          a=s.find("app.post('/api/myfa-ads/claim'")
          b=s.find('\n});',a)
          seg=s[a:b] if a>=0 else ''
          if old in seg:
              seg=seg.replace(old,new,1); s=s[:a]+seg+s[b:]
          p.write_text(s)

          idx=Path('public/index.html')
          h=idx.read_text()
          if '/ads-reward-runtime.js' not in h:
              h=h.replace('</body>','<script src="/ads-reward-runtime.js"></script>\n</body>')
              idx.write_text(h)
          PY
          node --check api/index.js
          node --check public/ads-reward-runtime.js
          node --check public/campaign-manager-ui-hotfix.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/index.js public/index.html
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m 'fix: preserve Telegram identity for ads'
          git push
